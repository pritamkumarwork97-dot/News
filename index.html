pansion supports growing demand for AI, cloud, cybersecurity, engineering and other technology services.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/infosys-hyderabad-pocharam-campus-new-1-1-million-sq-ft-block-adds-10-000-seats-supports-13-000-employees-11793440276906.html", "ts": 1793447703.0}, {"t": "US bonds rally, sending yields to biggest monthly decline since 2023", "b": "US Treasuries experienced a notable rise as technology stock selloffs caused a shift towards safer investments. The yield on the benchmark 10-year note had its largest monthly drop in nearly three years. Earnings reports from Amazon and Intel negatively impacted investor confidence amid rising AI costs. Expectations for a December interest rate hike remain high after a recent Federal Reserve meeting.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/bonds/us-bonds-rally-sending-yields-to-biggest-monthly-decline-since-2023/articleshow/135400137.cms", "ts": 1793447633.0}, {"t": "Pharma company Gufic buys Lodha Avalon duplex in Juhu for ₹236 crore", "b": "The purchase adds to a growing list of high-value deals at Lodha Developers’ luxury Mumbai project, which has attracted pharmaceutical promoters and business executives.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/pharma-company-gufic-buys-lodha-avalon-duplex-in-juhu-for-236-crore-11793433884135.html", "ts": 1793447550.0}, {"t": "NTPC Q2 results 2026 brings good news of 1st interim dividend for investors! Check amount, record date, profit details", "b": "NTPC reported a 38.7% year-on-year rise in Q2 FY27 net profit to ₹7,029.56 crore, while revenue increased 21.2% to ₹54,269.95 crore. The company declared its first interim dividend of FY27 at 30% of face value, with November 6 set as the record date.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/ntpc-q2-results-2026-brings-good-news-of-1st-interim-dividend-for-investors-check-amount-record-date-profit-details-11793443410726.html", "ts": 1793446936.0}, {"t": "NTPC Q2 Results: Standalone profit rises 14% YoY to Rs 5,320 crore; revenue up 17%", "b": "NTPC has showcased a strong performance in the second quarter of FY27, with a significant 14% increase in standalone net profit year-on-year. The operational revenue saw a notable rise of 16.8% from the same quarter last year, reflecting solid financial health. An interim dividend of Rs 3 per share was announced for shareholders. In a move to bolster growth, NTPC is also increasing its capital expenditure on pumped storage initiatives.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/ntpc-q2-results-net-profit-rises-14-yoy-to-rs-5320-crore-revenue-up-17/articleshow/135399399.cms", "ts": 1793446055.0}, {"t": "Petrol export duty cut to nil, diesel levy raised by ₹3 a litre", "b": "The government’s fortnightly review raised the export levy on diesel to ₹11.5 per litre from ₹8.5 and on aviation turbine fuel to ₹11 per litre from ₹10.5, while India’s diesel exports touched 700 kilo barrels per day in October, the highest since September 2025, according to Kpler", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/petrol-export-duty-cut-to-nil-diesel-levy-raised-by-3-a-litre/article71649004.ece", "ts": 1793445401.0}, {"t": "Dalal Street Weak Ahead: Nifty stands on firmer footing, but can it break past 23,450?", "b": "The Indian equity markets staged a strong recovery during the week, reversing part of their recent losses and ending on a positive note. The Nifty began the week on a relatively subdued footing but witnessed buying interest at lower levels, helping the Index recover and close above the psychologically important 23,000 mark. The trading range remained relatively wide, with the Nifty oscillating in a 730.75-point range. Volatility eased considerably; the India VIX declined by 9.25% to 15.30, reflecting some moderation in market uncertainty. The headline Index ended the week with a net gain of 453.10 points (+2.00%).135396555The most significant technical development during the week was the Nifty's ability to reclaim its 200-week Moving Average, presently placed at 22,700.18. This is an important positive development, especially after the index slipped below this long-term trend indicator. However, the broader technical structure remains vulnerable, and the recent recovery should not yet be interpreted as a confirmed trend reversal.", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/news/dalal-street-weak-ahead-nifty-stands-on-firmer-footing-but-can-it-break-past-23450/articleshow/135396431.cms", "ts": 1793444704.0}, {"t": "Tata Motors PV vs Maruti Suzuki shares: Which auto stock to buy after Q2 results 2026? Experts' views, target price", "b": "Tata Motors PV vs Maruti Suzuki shares: Most brokerages and analysts have given a strong ‘buy’ rating to Maruti Suzuki shares after the Q2 Results 2026", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/tata-motors-pv-vs-maruti-suzuki-shares-which-auto-stock-to-buy-after-q2-results-2026-experts-views-target-price-11793433708273.html", "ts": 1793444387.0}], "Science": [{"t": "Calling species 'invasive'—and culling them—isn't done lightly. But it matters to Australia's threatened species", "b": "It may sound abstract, but distinctions between \"native,\" \"introduced\" or \"invasive\" species can often be life or death. Species considered invasive in Australia—such as European rabbits and feral pigs—are often culled, while most native animals are generally left alone.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-species-invasive-culling-isnt-australia.html", "ts": 1793469605.0}, {"t": "That Mummy for Sale on Facebook Could Make You Ill", "b": "Experts warn that online black markets for mummified remains could pose health risks.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/31/science/mummy-sale-facebook-ill.html", "ts": 1793469335.0}, {"t": "COP17 Biodiversity Talks in Yerevan, Armenia", "b": "Countries renewed their promises to protect wildlife at U.N. talks in Armenia, but how to cover the costs remains a question.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/31/climate/cop17-biodiversity-yerevan-conclusion.html", "ts": 1793468419.0}, {"t": "How Trump Is Dismantling America’s Scientific Research Machine", "b": "The system that has driven life-altering discoveries and helped make the United States a superpower is now under intense strain.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/31/science/how-trump-is-dismantling-americas-scientific-research-machine.html", "ts": 1793467924.0}, {"t": "Ultracold atoms simulate hard-to-observe matter-antimatter pair production", "b": "According to quantum electrodynamics, the theory describing interactions between light and electrically charged particles, a sufficiently strong electric field can, in principle, convert some of its energy into particles and their antimatter partners. A particle's antimatter partner has the same mass and, for electrically charged particles, the opposite electric charge.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ultracold-atoms-simulate-hard-antimatter.html", "ts": 1793466001.0}, {"t": "Four superconducting cables link two large quantum processors into one", "b": "As quantum computers grow more ambitious, many researchers believe the best way forward is to build them in multiple interconnected parts. In these modular designs, separate quantum processors are linked so they can work together as one larger machine. For this to happen, however, connections must carry fragile quantum information without destroying it.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-superconducting-cables-link-large-quantum.html", "ts": 1793462402.0}, {"t": "Beyond Cyclone Arnab: can India tackle the growing cost of natural disasters? | Insight India", "b": "Cyclone Arnab hit the coast of Andhra Pradesh this week. In preparation, authorities evacuated people, halted transportation services and alerted disaster response forces. This is just the first cyclone of the northeast monsoon season. As climate change threatens to bring increasingly intense cyclones and other natural disasters, will India’s current disaster management programme be able to handle the social and economic costs I?n this episode, Sonikka Loganathan speaks to Safi Ahsan Rizvi, former Adviser to the National Disaster Management Authority, about what goes into disaster management, the costs to the economy and vulnerable populations, and how India has improved its strategy since 1999.", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/videos/shows/beyond-cyclone-arnab-can-india-tackle-the-growing-cost-of-natural-disasters-insight-india/article71650324.ece", "ts": 1793460494.0}, {"t": "Rare Iron Age Celtic helmet discovered in northeastern Poland far from its homeland", "b": "Around 2,400 years ago, at Łysa Góra in Poland, a group of people took a bronze helmet, crushed it, broke it into pieces and threw it into a pit with iron adzes and a scythe. Such helmets are sometimes found in lavish graves of the Celtic warrior elite, from Champagne, France, to Dürrnberg, Austria.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-rare-iron-age-celtic-helmet.html", "ts": 1793458806.0}, {"t": "New gel fuel could make rocket and satellite propulsion easier to control", "b": "A kerosene-based gel developed by Concordia researchers could make rocket and satellite fuels easier to store and control.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-gel-fuel-rocket-satellite-propulsion.html", "ts": 1793458801.0}, {"t": "On umbrellas, springs, and superconductivity", "b": "Springs are usually metal wires wound in a spiral, allowing us to store mechanical energy; the umbrella’s rod consists of multiple cylinders, and the spring opens them up in succession; when you close an umbrella, you compress the spring and store energy in it", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/on-umbrellas-springs-and-superconductivity/article71497022.ece", "ts": 1793454671.0}, {"t": "India’s first fusion power company takes key steps", "b": "Designs for the first privately built tokamak, a nuclear reactor that uses fusion to produce energy, could be firmed up in 2027 by Bengaluru-based startup Pranos Fusion", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/indias-first-fusion-power-company-takes-key-steps/article71649266.ece", "ts": 1793454574.0}, {"t": "The science of Gaganyaan parachutes | Explained", "b": "Why does Gaganyaan need multiple parachutes? How are they tested?", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/the-science-of-gaganyaan-parachutes-explained/article71491468.ece", "ts": 1793454281.0}, {"t": "Bute House protested by environmental campaigners", "b": "A Halloween-themed protest against fossil fuels has targeted the first minister's residence in Edinburgh.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c9rkypk1g7k0o?at_medium=RSS&at_campaign=rss", "ts": 1793454067.0}, {"t": "A mysterious 4,000-year-old wall is rewriting North Africa’s history", "b": "A remarkable 4,000-year-old defensive structure discovered in Morocco is rewriting what scientists thought they knew about ancient North African civilizations. The massive fortifications reveal unexpectedly sophisticated prehistoric societies and suggest that the region played a much greater role in Mediterranean history than previously recognized.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261030003022.htm", "ts": 1793452189.0}, {"t": "Rare fossil discovery reveals new dinosaur species that specialized in eating fruit", "b": "Among the ravenous carnivores and lumbering herbivores that roamed the Cretaceous landscape, another kind of dinosaur was evolving that started to eat something else: the plants that began to flower and produce fruit. The discovery by paleontologists from Stony Brook University, Royal Ontario Museum (ROM) and the North Dakota Geological Survey reveals that a new species, Infernogallus jamesi—a type of small oviraptorosaur—had chewing muscles for mashing soft food, making it the first known dinosaur that specifically ate fruit.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-rare-fossil-discovery-reveals-dinosaur.html", "ts": 1793451602.0}, {"t": "NASA telescope on verge of plunging back to Earth after failed rescue mission", "b": "Most of the 1 ½-ton telescope is expected to burn up in the atmosphere. But a handful of pieces made of denser-than-lead tungsten and some mirror parts could survive reentry, according to NASA's Brad Cenko, the mission's chief scientist", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/nasa-telescope-on-verge-of-plunging-back-to-earth-after-failed-rescue-mission/article71649422.ece", "ts": 1793451433.0}, {"t": "Scientists discover metals that defy the deep freeze at -424°F", "b": "Scientists have discovered a surprising mechanism that allows certain metals to resist cracking at temperatures as low as -253°C (-424°F), when similar materials typically become dangerously brittle. Instead of breaking, two experimental alloys reorganize their internal structures, creating new ways to absorb stress and remain flexible.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261029072127.htm", "ts": 1793450759.0}, {"t": "'Molecular armor' can trap shape-matched planar molecules", "b": "A research team has designed and synthesized a molecular cage with an internal cavity by connecting two curved π-conjugated molecules face-to-face at three points.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-molecular-armor-planar-molecules.html", "ts": 1793448001.0}, {"t": "75,000-year-old Neanderthal may have been killed by a spear aimed at the heart", "b": "A Neanderthal who died 75,000 years ago may have been killed by a wooden spear deliberately aimed at the heart, revealing rare evidence of prehistoric violence. A circular hole in the shoulder blade suggests the weapon pierced the chest and caused a rapidly fatal injury. Surprisingly, the same individual had survived an earlier devastating facial injury, suggesting other Neanderthals provided care and support.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261029072126.htm", "ts": 1793444720.0}, {"t": "From gold rush to cosmic questions: a South Dakota mine and the search for the secrets of the universe", "b": "A mile beneath the Black Hills, scientists are building giant detectors to analyse neutrino particles – and possibly find the answer to existence For more than a century, the mining town of Lead, in the Black Hills of South Dakota, attracted workers with a taste for gold. Now, a flagship experiment being built in the old mine is drawing scientists in search of more intriguing riches: answers to the deepest mysteries of the universe. Construction of the Deep Underground Neutrino Experiment (Dune) in the former Homestake mine is due to start on Monday. Engineers will begin assembling four giant detectors inside caverns blasted from rock a mile underground. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/31/south-dakota-mine-search-secrets-universe-dark-matter-antimatter", "ts": 1793444440.0}, {"t": "Young Canadians focus on mental health at key climate trial", "b": "At a landmark Canadian trial focused on the government's obligations to fight climate change, the young plaintiffs suing Ottawa over alleged policy failures have sought to focus attention on their mental health.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-young-canadians-focus-mental-health.html", "ts": 1793444407.0}, {"t": "Scientists discover a bacterial defense so strange they thought it was broken", "b": "Scientists have discovered a bizarre bacterial defense system that works almost completely backward from anything seen before. Unlike typical bacterial immune systems that keep a deadly toxin under control until a virus attacks, this unusual mechanism waits until an infection begins before producing the DNA that switches on its lethal weapon. The infected bacterium then destroys itself, preventing the virus from multiplying and spreading to neighboring cells.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261029072123.htm", "ts": 1793443110.0}, {"t": "Nations commit to get nature goals back on track", "b": "Nearly 200 nations struck hard-fought agreements Friday at a U.N. biodiversity summit, but the outcome was accompanied by disappointment over missed opportunities to address humanity's destructive toll on nature.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-nations-commit-nature-goals-track.html", "ts": 1793443022.0}, {"t": "ISRO NVS-03 launch: 5 things to know about India’s new navigation satellite", "b": "ISRO successfully launched the NVS-03 navigation satellite from the Satish Dhawan Space Centre in Sriharikota on October 30, 2026, restoring NavIC to a four-satellite, standalone operational status and advancing India’s push for an indigenous, more precise space-time network", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/isro-nvs-03-launch-navic-constellation-5-things-to-know-about-india-next-generation-satellite/article71648294.ece", "ts": 1793442558.0}, {"t": "Launch of NVS-03: PM Modi congratulates scientists, engineers at ISRO", "b": "Mr. Modi also said that equipped with enhanced capabilities, NVS-03 will further India’s pursuit of self-reliance in critical technologies and support navigation services that benefit the people", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/pm-modi-congratulates-isro-scientists-on-gslv-f18-launch-of-nvs-03/article71648465.ece", "ts": 1793431375.0}, {"t": "Rewilding project aims to restore peatland", "b": "Cumbria Wildlife Trust starts work repairing damage to Skiddaw Forest's peatland.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/crq8nw0q7d5ko?at_medium=RSS&at_campaign=rss", "ts": 1793429910.0}, {"t": "To overcome technical hurdles, ISRO flew NVS-03 satellite with pyro valves open: Narayanan", "b": "Pyro valves are crucial in spacecraft propulsion, and it may be recalled that the NVS-02 (launched in 2025), the second spacecraft in the NVS series, was a failure", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/to-overcome-technical-hurdles-isro-flew-nvs-03-satellite-with-pyro-valves-open-narayanan/article71648408.ece", "ts": 1793428017.0}, {"t": "A ferocious El Niño is brewing thanks to record Pacific heat", "b": "Since the modern era of instrumental records began, there have only been three very strong El Niño events, in 2015-16, 1997-98, and 1982-83, with the three-m
