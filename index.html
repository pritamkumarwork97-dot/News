nfluence-polls-vows-india-bloc-wont-accept-defeat-at-ramlila-maidan-rally/articleshow/135424478.cms", "ts": 1793529483.0}], "Science": [{"t": "'Fascinating' rare beetle found in Wales again after 60 years", "b": "It was feared The Short-Necked Oil Beetle had become extinct in Wales after recent surveys", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cry8317pdp5yo?at_medium=RSS&at_campaign=rss", "ts": 1793556292.0}, {"t": "Why some trees thrive far from home—and what that means for carbon sinks", "b": "In a study spanning 192 sites and four continents, researchers have discovered that conifers planted in the Southern Hemisphere grow up to four times faster and are more drought-resistant than those growing in their native ranges.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-trees-home-carbon.html", "ts": 1793556001.0}, {"t": "The Guardian view on listening to people with learning disabilities: a matter of life and death | Editorial", "b": "The Covid pandemic shed an unforgiving light on health and social care inequalities. The lessons have yet to be absorbed The fear that so many felt as the death toll rose during the Covid pandemic was magnified for Fiona Walker. “I know from experience they wouldn’t have valued my life,” she says, in a new report on the treatment of people with learning disabilities during the crisis. The 1.5 million people in the UK with learning disabilities, and their families, had reason for concern. Death rates in England were four to six times higher than average for people with learning disabilities. As is now well established, the pandemic did not create inequalities; it exposed and intensified them. People with learning disabilities die on average 19.5 years earlier than people without, and deaths are almost twice as likely to be classed as avoidable. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/world/commentisfree/2026/nov/01/the-guardian-view-on-listening-to-people-with-learning-disabilities-a-matter-of-life-and-death", "ts": 1793553917.0}, {"t": "Can Scientists Make Football Safer?", "b": "Researchers are exploring novel ways to treat, even prevent, the brain disease C.T.E. One of the most surprising: near-infrared light.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/28/science/cte-nfl-football-brain-safety.html", "ts": 1793553267.0}, {"t": "These Patients Struggle With Runaway Bones. Finally There’s Hope.", "b": "F.O.P., a rare genetic condition, causes uncontrolled explosions of bone. New drugs may slow or halt the process.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/29/science/fop-bones-drugs.html", "ts": 1793553116.0}, {"t": "How permanent daylight saving time could affect schools", "b": "Sleep is fundamental to well-being. Decisions to end semiannual clock changes and remain on permanent daylight saving time (DST) in British Columbia, the Northwest Territories, Alberta, Manitoba and northwestern Ontario have consequences for many Canadians due to potential sleep disruption.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-permanent-daylight-affect-schools.html", "ts": 1793547002.0}, {"t": "Heavy hydrogen in 3I/ATLAS's methane points to a frigid birthplace", "b": "The interstellar comet 3I/ATLAS carries a chemical clue to conditions in the planetary system of its origin, locked away long before it reached our sun. Its methane signature is unusually rich in heavy hydrogen, suggesting that the comet's frozen ingredients took shape in an intensely cold environment around another star—or in the cloud that preceded it.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-heavy-hydrogen-3iatlas-methane-frigid.html", "ts": 1793546402.0}, {"t": "2,700-year-old mummy head yields first molecular evidence linking aloe to Egyptian embalming", "b": "What materials did ancient Egyptians use to preserve the dead, and how can their composition still be investigated thousands of years later? An interdisciplinary team at Marburg University has combined modern natural product analysis with Egyptology and the history of pharmacy to investigate these questions.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-year-mummy-yields-molecular-evidence.html", "ts": 1793541601.0}, {"t": "Explained | What is the Gaia space mission and what has it revealed about the Milky Way?", "b": "The new data released by the European Space Agency’s Gaia mission has revealed the surprise phenomena of ‘starquakes’—massive tsunami-like movements on the surface of stars", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/explained-what-is-the-gaia-space-mission-and-what-has-it-revealed-about-the-milky-way/article65527518.ece", "ts": 1793538226.0}, {"t": "The UK’s legal cannabis market is booming – so why can’t this talented artist get any to treat his epilepsy? | Kojo Koram", "b": "Companies have rushed to supply the drug as a wellness treatment, but patients with serious illnesses aren’t able to get NHS prescriptions In 2022, a prodigiously talented young artist named Louis Petit was preparing to return to the UK, having been effectively exiled in the Netherlands as a teenager so he could access the medical cannabis he needed to control his epilepsy. Six years earlier, Louis, then 12, had been diagnosed with a rare form of the neurological disease when medical cannabis was still illegal in the UK. But in Rotterdam, where it was legal, doctors helped him discover that a medical cannabis oil called Bedrolite, in combination with the right mix of anti-epileptic treatment, could slow and eventually stop his seizures. This was something his neurologists in the UK had previously considered impossible. Dr Kojo Koram is professor of law and political economy at Loughborough University and the author of The Next Fix: The Winners and Losers in the Future of Drugs Do you have an opinion on the issues raised in this article?", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/nov/01/uk-legal-cannabis-market-booming-louis-petit-epilepsy", "ts": 1793536435.0}, {"t": "Common pesticide linked to 2.5 times the risk of Parkinson’s disease", "b": "A UCLA study found that long-term exposure to a common pesticide was linked to more than 2.5 times the risk of Parkinson's disease. Scientists also uncovered how the chemical damages brain cells and identified a promising way to protect them.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261031013035.htm", "ts": 1793536393.0}, {"t": "Aquarium shark that helped 'dispel myths' dies", "b": "Staff at Plymouth's aquarium pay tribute to a sand tiger shark believed to be almost 30 years old.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c64g18lkz0kno?at_medium=RSS&at_campaign=rss", "ts": 1793535230.0}, {"t": "Scientists shrink Archimedes’ screw to the size of a single molecule", "b": "Scientists have built a groundbreaking molecular motor that spins in either direction using electricity, inspired by a machine invented more than 2,000 years ago. Even more remarkably, its rotation can boost electrical conductivity by up to 100 times, potentially transforming the future of molecular electronics.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261030002940.htm", "ts": 1793534146.0}, {"t": "Breaking the ice: Scientists use attracting particles to form an anti-spin ice", "b": "In a recent Nature Communications study, researchers have reported the realization of an anti-spin ice, a system that does the opposite of conventional spin ices by breaking the ice rule that governs them.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ice-scientists-particles-anti.html", "ts": 1793533201.0}, {"t": "Scientists use sound waves to deliver a new attack on deadly brain cancer", "b": "Scientists at the University of Virginia have developed a promising new strategy to fight glioblastoma, one of the deadliest and most difficult-to-treat forms of brain cancer. Their experimental approach combines focused ultrasound, tiny nanoparticles, and genetic molecules called microRNAs to attack multiple cancer-driving genes simultaneously.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261030003017.htm", "ts": 1793530153.0}, {"t": "Ancient ape fossil in Egypt could rewrite the story of human origins", "b": "A 17- to 18-million-year-old ape fossil discovered in Egypt is challenging long-held beliefs about where the ancestors of humans and other modern apes first evolved. Scientists now suspect that North Africa and the Middle East, rather than East Africa, may have been the cradle of modern ape evolution.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261031011638.htm", "ts": 1793529166.0}, {"t": "These Snakes Cartwheel Out of Dangerous Situations", "b": "To escape predators, dwarf reed snakes trade slithering for rolling to safety.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/01/science/these-snakes-cartwheel-out-of-dangerous-situations.html", "ts": 1793527293.0}, {"t": "Cyril Hilsum, Who Helped Invent Flat-Panel Displays in TVs and iPhones, Has Died at 101", "b": "The man who helped develop the technology for liquid crystal displays — the screens in flat-panel televisions and laptops — has died at 101.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/01/technology/cyril-hilsum-dead.html", "ts": 1793527244.0}, {"t": "Swarms of Butterflies Land at New York’s Natural History Museum", "b": "The cartoonist Peter Kuper has filled a corridor with drawings of monarchs, depicting the b
