esearchers for years.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018205101.htm", "ts": 1792462980.0}, {"t": "Russian Satellite Makes a Menacing Approach to Another Craft in Orbit", "b": "Although Kosmos 2612 is now backing away, the maneuver raised alarm bells for analysts who see it as part of a pattern of Russian aggression.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/19/science/russia-satellite-kosmos-2612.html", "ts": 1792455866.0}, {"t": "‘Once-in-a-lifetime chance’: Japan launches historic mission to collect rocks from Mars’s moon Phobos", "b": "Scientists hope Martian material collected will shed light on the origins of the solar system and life on Earth Japan has successfully launched a spacecraft on an unprecedented mission to bring back samples from one of Mars’s moons that scientists hope will shed light on the origins of the solar system and life on Earth. The Martian ⁠Moons Exploration (MMX) spacecraft, propelled by Japan’s flagship H3 rocket, lifted off before dawn from Tanegashima island in the country’s far south-west, the Japan Aerospace Exploration Agency (Jaxa) said. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/world/2026/oct/20/japan-mars-moon-mission-phobos-collect-rocks", "ts": 1792453077.0}, {"t": "Five ways El Niño is affecting the weather around the world", "b": "As the strongest El Niño on record continues to intensify, what impacts on weather patterns are already being felt across the globe? Sarah Keith-Lucas looks at the evidence.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/c6dx07dznpyyo?at_medium=RSS&at_campaign=rss", "ts": 1792451305.0}, {"t": "New AI tool can predict cancer survival by a single patient selfie, study suggests", "b": "System can estimate a person’s biological age and predict chances of cancer survival from a single photograph Doctors have developed an artificial intelligence tool that can pre
