estination in sight, powered by curiosity and engineering. Further imagine making that journey not at bullet train or jet plane speed, but much faster: at 37,800 miles per hour, free from friction in a vast sea of cold, soundless space, bombarded by radiation and cosmic rays yet still able to communicate with folks back home. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/nov/18/nasa-voyager-1-pale-blue-dot", "ts": 1794999656.0}, {"t": "I want to know if toxic lagoon fire caused my husband's rare deadly cancer", "b": "Steve Williams died of lung cancer 14 years after falling in to a lagoon at a toxic waste dump fire.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cm62y2e4qd9yo?at_medium=RSS&at_campaign=rss", "ts": 1794998929.0}, {"t": "Nasa’s Voyager 1 just reached a massive milestone in space - video", "b": "Nasa sent the Voyager 1 and 2 probes into space almost 50 years ago to explore the outer reaches of our solar system. Now Voyager 1, the farthest human-made object from Earth, is about to reach a distance of one light-day away from our planet. To find out more about its astonishing journey, Madeleine Finlay hears from Jim Bell, a planetary scientist and professor at Arizona State University’s school of Earth and space exploration. He explains the seismic impact the mission has had on our understanding of the solar system, and where Voyager 1 could be heading now it has left the heliosphere Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/video/2026/nov/18/nasas-voyager-1-just-reached-a-massive-milestone-in-space-video", "ts": 1794998391.0}, {"t": "People asked for views on blue brook pollution", "b": "The Environment Agency wants to know how the incident affected visitors, residents and businesses.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqpv9mjm78m3o?at_medium=RSS&at_campaign=rss", "ts": 1794991022.0}, {"t": "More than a billion years of Earth's history vanished. Scientists may finally know why", "b": "Scientists may have finally explained why up to more than a billion years of Earth's geological history are missing from rocks around the world. New research suggests that powerful currents deep inside the planet slowly raised and lowered entire continents, allowing erosion to erase vast stretches of geological history before they were buried and preserved.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261116023403.htm", "ts": 1794990476.0}, {"t": "CCMB study points to new way of tackling fungal infections", "b": "Fungi can gradually develop resistance to current antifungal drugs, making infections increasingly difficult to treat", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/cities/Hyderabad/ccmb-study-points-to-new-way-of-tackling-fungal-infections/article71711826.ece", "ts": 1794989846.0}, {"t": "Body found in Derry bog decapitated more than 2,000 years ago, coroner finds", "b": "Inquest-style inquiry concludes iron age remains are of 15- to 22-year-old female who may have been ritually sacrificed A coroner’s investigation into Northern Ireland ’s most venerable cold case has concluded that the victim was decapitated more than 2,000 years ago. The inquest-style inquiry determined that Ballymacombs More Woman – the name given to iron age remains found in a County Derry bog three years ago – was between 15 and 22 years old when she was beheaded from behind with a bladed weapon. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/uk-news/2026/nov/18/ballymacombs-more-woman-derry-bog-decapitated-2000-years-ago", "ts": 1794988836.0}, {"t": "£10m ‘once-in-a-generation’ study to explore effects of children’s social media ban", "b": "Research to look at whether ban can make meaningful change in mental health and wellbeing for under-16s Countries
