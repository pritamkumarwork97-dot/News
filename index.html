h named India A vice-captain", "b": "Rinku Singh named India A vice-captain", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/sports/cricket/rinku-singh-named-india-a-vice-captain-for-rising-stars-asia-cup-after-patidar-withdraws/articleshow/135653380.cms", "ts": 1794120553.0}, {"t": "Adani Enterprises plans ₹35,000-40,000 crore annual capex in next two years", "b": "The planned spending comes as the group seeks to scale up businesses built over recent years, including airports and data centres, while bringing its large manufacturing investments closer to commercial operation.", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/Industry/adani-enterprises-plans-35000-40000-crore-annual-capex-in-next-two-years/article71680605.ece", "ts": 1794120531.0}, {"t": "Singapore Airlines' $1.6 bn cabin revamp: Bigger beds, privacy door for business class, Sanjeev Kapoor’s thalis and more", "b": "Singapore Airlines will invest more than S$2 billion to overhaul cabins across aircraft, with new products arriving from the second half of 2027. First class will feature double beds, business class privacy doors, and more than 100 updated dishes, including creations by Indian chef Sanjeev Kapoor.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/singapore-airlines-1-6-bn-cabin-revamp-bigger-beds-privacy-door-for-business-class-sanjeev-kapoor-s-thalis-and-more-11794119291629.html", "ts": 1794120381.0}], "Science": [{"t": "The Guardian view on Ordnance Survey maps: still a superior way to navigate the landscape | Editorial", "b": "The 225th anniversary of the organisation’s first publication is an opportunity to celebrate its unique contribution to our sense of place In his one-paragraph short story , On Exactitude in Science, Jorge Luis Borges imagines an empire in which the level of cartographical ambition is so high that a map is made on a one-to-one scale with the imperial territory. The quest for perfect accuracy doesn’t end well. But the earliest map-makers for Ordnance Survey, which this week marked the 225th anniversary of its first publication, might have empathised with the obsessive dedication. The 1801 OS map of Kent was 10 years in the making, its military-led production inspired by fears of Napoleonic invasion. But as Rachel Hewitt points out in Map of a Nation , her stirring account of the Ordnance Survey’s early years, its genesis also lay in an Enlightenment-based enthusiasm for comprehending and accurately representing reality.", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/nov/08/the-guardian-view-on-ordnance-survey-maps-still-a-superior-way-to-navigate-the-landscape", "ts": 1794158745.0}, {"t": "100 buses long: Scientists map one of the world's largest known coral colonies", "b": "A huge coral colony stretching more than 1.5 kilometers (0.93 miles) along the outer reef of the Cocos (Keeling) Islands has been identified by researchers, making it one of the largest known coral colonies ever recorded.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-buses-scientists-world-largest-coral.html", "ts": 1794157201.0}, {"t": "Nasa seeks next generation of astronauts to live and work on the moon", "b": "Applications due on 3 December for new generation of explorers who can ‘shape humanity’s future in space’ Nasa has launched a callout for a new generation of astronauts as it searches for explorers who could live and work on the moon. Opening applications for the latest expansion of its Artemis program , the US agency said successful candidates would help “shape humanity’s future in space” as it builds a base on the moon and plans the first crewed missions to Mars. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/08/nasa-astronauts-moon-applications-open", "ts": 1794156884.0}, {"t": "New species of ground-dwelling bird, the largest of its kind, identified in same cave as Homo floresiensis", "b": "In 2009, researchers working in the Liang Bua cave on Flores Island came across a leg bone. The 190,000–120,000-year-old fossil was identified as a bird bone and set aside. Like many bird bones before it, it was overlooked and left to collect dust.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-species-ground-bird-largest-kind.html", "ts": 1794154801.0}, {"t": "Game theory helps SETI search for alien civilizations", "b": "The search for extraterrestrial intelligence (SETI) is mostly concerned with where to look for technosignatures from another civilization. Between 2012 and 2015, SETI's Project Phoenix targeted about 1,000 sun-like stars for signs of intelligent life. But where to look might not be as important as when to look, according to scientists at SETI.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-game-theory-seti-alien-civilizations.html", "ts": 1794151806.0}, {"t": "'Stupendously large' primordial black holes ruled out as a dark matter source", "b": "Primordial black holes are hypothetical objects that could have formed directly from dense clumps of matter in the very early universe. If they exist, their dramatic origins would set them apart from the black holes we see today, which form when massive stars collapse. Some theories suggest that \"stupendously large\" primordial black holes could account for a significant share of the universe's elusive dark matter.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-stupendously-large-primordial-black-holes.html", "ts": 1794148801.0}, {"t": "Doctors Absorb the Stunning Failure of Two High-Profile Heart Drugs", "b": "By every measure, the drugs were no better than placebos, full data revealed on Saturday. Was it the fault of the design of the studies, or our very hypotheses about heart disease?", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/07/science/heart-drugs-failed-novartis-novo-nordisk.html", "ts": 1794147295.0}, {"t": "New drug could be cure for common cause of high blood pressure", "b": "Benefits of baxdrostat are unexpectedly found to remain up to two years after patients stop taking it Millions of people with high blood pressure stand to benefit from a new drug that has stunned doctors by reversing a common cause of the condition for years after patients stopped taking the medication. Patients who took the drug, called baxdrostat, saw their blood pressure improve during a six- to 12-month course of the daily pills, but unexpectedly the benefits remained up to two years later, with some patients no longer on any hypertension drugs and potentially cured of the condition. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/society/2026/nov/08/new-drug-high-blood-pressure-baxdrostat", "ts": 1794146021.0}, {"t": "Dormice 'thrive' at National Trust site", "b": "Killerton National Trust has 100 nest boxes across its estate in Devon.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c50meerl8xp1o?at_medium=RSS&at_campaign=rss", "ts": 1794140525.0}, {"t": "Want to fly to the moon? NASA is looking for new astronauts to help grow its Artemis program", "b": "Want to fly to the moon and help build a permanent lunar base? NASA is accepting applications for a new astronaut class that will help grow the Artemis program.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fly-moon-nasa-astronauts-artemis.html", "ts": 1794138312.0}, {"t": "Chimp sanctuary delivers an ape's food by drone amid Florida floods", "b": "A Florida chimpanzee sanctuary had to deliver food to one of its 200 apes by drone this week because the property was swamped by heavy rain. But the animals stayed safe, and the water finally was receding significantly on Saturday, the organization said.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-chimp-sanctuary-ape-food-drone.html", "ts": 1794138280.0}, {"t": "A nuclear blast could save Earth from an asteroid, but there's a catch", "b": "A nuclear explosion might save Earth from a deadly asteroid, but new research suggests that hitting the wrong side could make the difference between success and disaster. Scientists found that an asteroid's irregular shape can dramatically affect how it responds to an X-ray blast, with deflection effectiveness varying nearly fivefold depending on the angle.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261106174532.htm", "ts": 1794132685.0}, {"t": "A Guide to COP31 Climate Talks in Antalya, Turkey", "b": "Negotiators and leaders are gathering for annual United Nations climate talks. They come as global temperatures are set to breach a key threshold.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/08/climate/what-is-cop31-climate.html", "ts": 1794132110.0}, {"t": "With Hopes Low and Temperatures High, Climate Summit Opens in Turkey", "b": "War, artificial intelligence and the Trump era have overshadowed climate change. But officials from nearly every nation are meeting to confront global warming.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/08/climate/with-hopes-low-and-temperatures-high-climate-summit-opens-in-turkey.html", "ts": 1794132097.0}, {"t": "Did These Scientists Find Evidence of Blood in a Dinosaur Bone?", "b": "Mineralized “structures” discovered in the bone were the fossilized remains of red blood cells, according to a recent study. Other experts aren’t so sure.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/08/science/dinosaur-blood-bone.html", "ts": 1794132064.0}, {"t": "Ancient Siberian tomb reveals surprising secrets of cannabis use 2,800 years ago", "b": "Scientists investigating a 2,800-year-old Siberian tomb discovered roughly 1,000 cannabis seeds and chemical evidence suggesting ancient Scythians used the plant for its intoxicating effects. The remarkable find, surrounded by evidence of elaborate burial rituals and animal sacrifices, offers the oldest directly dated archaeological evidence of psychoactive cannabis use.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261106174528.htm", "ts": 1794125663.0}, {"t": "Countryside managers prepare for climate change", "b": "North Pennines National Landscape's plan includes restoring peatland and wildfire preparedness.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c3ewe99dzdlpo?at_medium=RSS&at_campaign=rss", "ts": 1794122215.0}, {"t": "Hundreds of seagrass shoots found in estuary", "b": "There were fears a restoration trial may not succeed when only six seedlings had emerged in April.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/ck1wvx3r9rgeo?at_medium=RSS&at_campaign=rss", "ts": 1794121573.0}, {"t": "Hawking, the celebrity theoretical physicist", "b": "On November 8, 2018, one of the earliest wheelchairs used by Stephen Hawking fetched a whopping sum of nearly £300,000, while a copy of his doctoral thesis fetched almost £585,000. How did a theoretical physicist turn into one of the most celebrated scientists of recent times? A.S.Ganesh gives you the answer with a brief look at his life and work…", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/hawking-the-celebrity-theoretical-physicist/article71630590.ece", "ts": 1794115476.0}, {"t": "Ukraine’s new frontier: how space has become critical to balance of the war", "b": "In a war driven by drones and battlefield sensors, access to space is essential. After Starlink speed restrictions and Russian Oreshnik missile strikes, Kyiv is racing to develop its own space capabilities For people in t
