nds and financial requirements, with the Treasury planning to consult market participants for a thorough understanding of these changing factors.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/us-stocks/news/us-treasury-shifts-language-opening-door-to-auction-size-changes/articleshow/135543878.cms", "ts": 1793805703.0}, {"t": "Meta draws record orders for debut euro bond sale, Bloomberg News reports", "b": "Meta Platforms has successfully garnered an impressive €53 billion in investor interest for its inaugural euro bond issuance. With an ambition to raise €9 billion divided into six distinct parts, this move follows their recent $15 billion bond offering in the US market. Citigroup and Morgan Stanley are at the helm of this euro bond sale, with pricing anticipated shortly. As of September 30, Meta's total debt reached $83.67 billion.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/us-stocks/news/meta-draws-record-orders-for-debut-euro-bond-sale-bloomberg-news-reports/articleshow/135543860.cms", "ts": 1793805606.0}, {"t": "Gold gains 3% as dollar slides after Democratic midterm gains", "b": "On Wednesday, gold prices surged by 3%, reaching impressive new levels following the midterm elections, during which Democrats secured control of both the Senate and House. This political transformation, combined with a weaker dollar, heightened gold and precious metals demand. Investors are keenly watching for the upcoming US non-farm payrolls report, as rising interest rates and ongoing fiscal risk concerns continue to influence market sentiment.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/us-stocks/news/gold-gains-3-as-dollar-slides-after-democratic-midterm-gains/articleshow/135543824.cms", "ts": 1793805527.0}, {"t": "Unilever to invest €40 million in India R&D and bio-futures innovation", "b": "India is a critical global R&D center for Unilever. India’s emergence as a global innovation powerhouse presents an extraordinary opportunity said Unilever officials.", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/Industry/unilever-to-invest-40-million-in-india-rd-and-bio-futures-innovation/article71665558.ece", "ts": 1793805429.0}, {"t": "Prediction markets get Democratic win right, with a few surprises", "b": "Prediction markets provided insights during the US midterm elections, with $1.48 billion wagered on the outcomes. Democrats gained control of both the Senate and House of Representatives after delivering a rebuke to Donald Trump. Despite some accurate forecasts, notable surprises emerged, such as Annie Andrews' victory in South Carolina against expectations. Kalshi and Polymarket reflected varying probabilities, emphasizing the predictive capabilities of betting markets.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/us-stocks/news/prediction-markets-get-democratic-win-right-with-a-few-surprises/articleshow/135543698.cms", "ts": 1793805424.0}, {"t": "Indian bonds rally most since April as oil slides after US midterm verdict", "b": "Indian government bonds experienced a significant rally influenced by falling oil prices after the US midterm elections. The benchmark bond yield dropped notably, reflecting a three-day decline in yields. Brent crude oil prices decreased, easing inflation and fiscal pressures on India. The Reserve Bank of India anticipates inflation will peak this quarter, supporting future bond market performance.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/bonds/indian-bonds-rally-most-since-april-as-oil-slides-after-us-midterm-verdict/articleshow/135543664.cms", "ts": 1793805323.0}, {"t": "Aptus Value Housing Finance Q2 profit rises 18% to Rs 267 cr", "b": "Aptus Value Housing Finance India achieved a remarkable net profit of Rs 267 crore in the second quarter, signifying s ts to tackle the city's housing crisis. \"Of course, we are concerned about plans to nationalise housing owned by private companies,\" Vonovia CEO Luka Mucic told reporters Wednesday during a conference call on the company's third-quarter results.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/digital-real-estate/realty-news/property-giant-vonovia-concerned-over-berlin-lefts-housing-plans/articleshow/135543553.cms", "ts": 1793805031.0}, {"t": "William Nordhaus Dies; Nobel Winner Influenced Climate Policy", "b": "The Yale professor moved climate change into mainstream economic analysis.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/11/02/business/economy/williiam-nordhaus-nobel-dead.html", "ts": 1793804651.0}, {"t": "Sunday PropTech acquires 89-room hotel in Kolkata, marks entry into city", "b": "Sunday PropTech Ltd marks a significant milestone with its inaugural acquisition of an 89-room hotel in Rajarhat. This venue will be included in its emerging mid-premium Clubhouse brand, bolstering its footprint in eastern India. Given its advantageous proximity to Netaji Subhas Chandra Bose International Airport, it appeals to business travelers. The company plans to revamp and reposition the hotel, while also identifying additional investment prospects in West Bengal.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/digital-real-estate/realty-news/sunday-proptech-acquires-89-room-hotel-in-kolkata-marks-entry-into-city/articleshow/135543130.cms", "ts": 1793804626.0}, {"t": "Nasdaq jumps 2%, Dow soars over 1,000 points after US midterm election results", "b": "The S&amp;P 500 jumped 1.2% in early trading and was potentially on track for its best day in six weeks. The Dow Jones Industrial Average was up 1,178 points, or 2.3%.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/us-market-nasdaq-dow-ai-stocks-after-us-midterm-election-results-11793804138598.html", "ts": 1793804533.0}, {"t": "From Egypt to US Senate: Abdul El-Sayed’s story", "b": "From Egypt to US Senate: Abdul El-Sayed’s story", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/international/us/grandson-of-a-vegetable-seller-in-egypt-raised-by-an-imam-father-and-a-michigan-born-stepmother-the-multi-faith-family-behind-americas-first-muslim-senator-elect-abdul-el-sayed/articleshow/135542396.cms", "ts": 1793803688.0}, {"t": "Agniveers to get regular enrolment after 2-yrs", "b": "Agniveers to get regular enrolment after 2-yrs", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/defence/agnipath-scheme-all-agniveers-to-be-offered-regular-enrolment-after-2-year-extended-engagement/articleshow/135542901.cms", "ts": 1793803656.0}], "Science": [{"t": "NVS-03 reaches geosynchronous orbit; satellite in good health", "b": "‘Four orbit manoeuvres have been successfully completed with a cumulative LAM engine burn of 6164 seconds; with this the satellite has reached Geo Synchronous Orbit at an inclination of 29.980,’ said ISRO", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/nvs-03-reaches-geosynchronous-orbit-satellite-in-good-health/article71667218.ece", "ts": 1793815407.0}, {"t": "The Southwest Is Parched. Can the Recent Floodwaters Quench It?", "b": "A series of storms has added to reservoirs in the Colorado River basin, but the long-term water outlook remains bleak.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/03/climate/floods-arizona-colorado-river-water.html", "ts": 1793811671.0}, {"t": "Back to back GSLV successes help ISRO win back some pride", "b": "Back to back GSLV successes help ISRO win back some pride", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/newsletter/space-wrap/space-wrap-newsletter-back-to-back-gslv-successes-help-isro-win-back-some-pride/article71665366.ece", "ts": 1793804249.0}, {"t": "Scientists may have finally explained why our brains and bodies are cross-wired", "b": "Scientists propose that the brain’s mysterious cross-wiring, which connects each hemisphere to the opposite side of the body, may have originated more than 500 million years ago in the visual systems of ancient fish. Rather than evolving for a specific advantage, this unusual arrangement may simply be a legacy of evolution building new brain circuits on an ancient foundation.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261103003146.htm", "ts": 1793798692.0}, {"t": "Permanent daylight saving time has a dark side, scientists warn", "b": "A new study warns that permanent daylight saving time could force American children to make at least 2 billion additional school commutes in darkness, potentially increasing safety risks and disrupting their biological clocks. Researchers found that fatal crashes involving school-aged pedestrians were roughly twice as likely during dark mornings as after sunrise.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261103003157.htm", "ts": 1793796648.0}, {"t": "A tiny squeeze dramatically changes the magnetism of exotic materials", "b": "Scientists have discovered that a simple mechanical squeeze can dramatically alter the magnetic properties and electrical behavior of exotic materials called altermagnets. The surprising breakthrough could open the door to faster, more energy-efficient electronics and new technologies for quantum computing.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261101010541.htm", "ts": 1793795872.0}, {"t": "MIT scientists break a 20-year rule and unlock never-before-seen crystal structures", "b": "MIT scientists have challenged two decades of conventional thinking by discovering that flexible molecular connections, rather than rigid ones, can unlock entirely new ways to arrange nanoparticles. The breakthrough could lead to a new generation of designer materials with unusual properties and applications in electronics, medicine, and energy.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104012248.htm", "ts": 1793795016.0}, {"t": "The Milky Way grew by devouring galaxies, leaving a trail of ghost stars", "b": "Galactic archaeologists are using precise measures and larger sample sizes afforded by new missions to tease apart minute differences between groups of stars, revealing the history of the Milky Way going back almost 12 billion years", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/the-milky-way-grew-by-devouring-galaxies-leaving-a-trail-of-ghost-stars/article71652934.ece", "ts": 1793793279.0}, {"t": "Why even a strong El Niño does not guarantee a poor Indian monsoon", "b": "Seven Indian monsoons since 1950 have run into a moderate or strong El Niño. Of these, in five years, including 2026, monsoon rainfall levels were at least 10% lower than the long-term average. The IMD refers to this level as 'deficient’. The 2023 season was something of an exception with ‘below average’ rainfall. However, 1997 had ‘average’ rainfall", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/why-even-a-strong-el-nino-does-not-guarantee-a-poor-indian-monsoon/article71652226.ece", "ts": 1793793183.0}, {"t": "William meets firefighters who tackled summer blazes", "b": "The prince says 2026 was the first summer he felt \"worried about the scale of the wildfires\".", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/c94g1m232pgyo?at_medium=RSS&at_campaign=rss", "ts": 1793792108.0}, {"t": "NASA is racing against time to save the Hubble Space Telescope", "b": "NASA is exploring a daring plan to save the legendary Hubble Space Telescope from its eventual fiery plunge into Earth's atmosphere. After more than 35 years of groundbreaking discoveries, Hubble is slowly losing altitude, and without intervention, it could fall back to Earth as early as 2033 or 2034. To keep the iconic observatory operating, NASA is asking private space companies to propose innovative ways to boost Hubble into a higher orbit, upgrade its capabilities, or safely dispose of it when its mission finally ends.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104012254.htm", "ts": 1793791353.0}, {"t": "Very good boys? The dark, dystopian rise of robot dogs | Arwa Mahwadi", "b": "Pups that carry your shopping are one thing – but what about the mechanical canines being bought up in the US by ICE? Or the mutant mutts due to be developed by a startup called Warhound? Have you ever wanted to hang out with a dog with no fur, no face and a chip in its shoulder? If so, I suggest you head to San Francisco, where a startup called Dimensional has been paying people $20 (£15) an hour to walk four-legged robot dogs . This isn’t because the dogs need the exercise – it is because the company needs the training data. As reported in the New York Times, the goal is to develop “operating systems that can integrate with AI agents so the machines can act more independently”. What exactly will these machines do when they can act more independently? The founder of Dimensional insists they will help people. They might carry groceries home, for example, which is certainly something my tiny chihuahua-mix is incapable of. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/nov/04/robot-dogs-ice-dimensional-warhound", "ts": 1793790009.0}, {"t": "SLAC scientists find conclusive proof of a mysterious third type of magnetism", "b": "For nearly 90 years, scientists believed magnetism fell into just two categories, but researchers have now confirmed a remarkable third type called altermagnetism. Using specialized X-rays, they uncovered a unique magnetic signature that proves these materials behave differently from conventional magnets. Altermagnets combine stability with the ability to efficiently carry information, potentially overcoming major limitations in today's electronics. The discovery could lead to faster computers, more efficient data centers, and breakthroughs in quantum technology.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104012256.htm", "ts": 1793789024.0}, {"t": "Delhi air quality worsens ahead of Diwali as firework restrictions enter force", "b": "On Wednesday morning, Delhi's air quality index reading stood at 377, in the \"very poor\" category.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c699z8792n7ro?at_medium=RSS&at_campaign=rss", "ts": 1793777978.0}, {"t": "AI helps Stanford scientists discover a “natural Ozempic” with a surprising advantage", "b": "Stanford researchers have discovered an AI-identified natural molecule that dramatically suppresses appetite and promotes fat loss in animals, potentially offering an Ozempic-like weight-loss treatment without common digestive side effects or significant muscle loss. Called BRP, the molecule reduced food intake by up to 50% and targets a different brain pathway, raising hopes for a more precise obesity treatment if future human trials prove successful.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104004909.htm", "ts": 1793775426.0}, {"t": "Tiktoker 'super excited' to co-host BBC nature show", "b": "Naturewatch, hosted by Chris Packham, Megan McCubbin and Kyle Thomas, is being made in Bristol.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6y93pgydvzdo?at_medium=RSS&at_campaign=rss", "ts": 1793772901.0}, {"t": "Prince William says UK faces terrifying risk of more wildfires due to climate change", "b": "The prince says 2026 was the first summer he felt \"worried about the scale of the wildfires\".", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cr62yv02zwxwo?at_medium=RSS&at_campaign=rss", "ts": 1793772703.0}, {"t": "Why pharma firms are going to Earth’s orbit in search of new cancer drugs", "b": "A space capsule 300 miles above us is growing the tiny crystals of a potential cancer drug in microgravity Roughly 300 miles above our heads, three washing machine-sized capsules are orbiting the Earth. Inside one of them, tiny crystals of a potential cancer drug are being grown in the weightlessness of space. The others are testing heat protection materials and navigation systems for when the capsules plunge back through Earth’s atmosphere at hypersonic speeds. Together, they represent a small but significant step towards what some hope will become a lucrative new industry: manufacturing drugs and other materials in space. The spacecraft belong to California-based Varda Space Industries. On 1 October, it launched two onboard the same rocket, followed by the third on 20 October. With a record three spacecraft now simultaneously in orbit for the first time, the company is edging closer to its ambition of operating a fleet of orbiting pharmaceutical factories. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/04/us-firm-varda-space-industries-manufacturing-drugs-in-space", "ts": 1793772027.0}, {"t": "The next global pandemic could be brewing on a mink farm in Utah – and little is being done to stop it | George Monbiot", "b": "Mink farms are the perfect petri dishes for deadly flu strains to emerge. Yet officials appear to be protecting business interests over human lives Could this be ground zero? Could it be the spot where the next pandemic begins? It’s certainly a candidate, not least because the chain of events that could trigger a plague far worse than Covid-19 looks like the opening sequence of a disaster movie. A really bad disaster movie,
