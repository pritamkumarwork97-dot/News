u", "l": "https://www.thehindu.com/sci-tech/science/science-quiz-unconventional-science-prizes/article71688121.ece", "ts": 1794361402.0}, {"t": "Scientists discover a giant 66-pound rodent that lived 34 million years ago", "b": "Scientists have uncovered fossils of a giant rodent that lived in Thailand 34 million years ago, revealing that enormous rodents evolved much earlier than previously thought. Named Yakamys sirindhornae, the ancient animal may have weighed around 66 pounds, roughly twice as much as other known rodents of its time.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261110042532.htm", "ts": 1794360964.0}, {"t": "237-million-year-old fossils reveal a bizarre armored sea amphibian", "b": "A bizarre, heavily armored amphibian roamed the oceans 237 million years ago, despite the fact that modern amphibians cannot survive entirely in saltwater. Discovered in China, the giant salamander-sized creature may be the first known amphibian to have adapted to a fully marine existence.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261109205409.htm", "ts": 1794358772.0}, {"t": "Duchy tenants may have to buy farms or leave as Prince William plans sell-off", "b": "A ten-year strategy to raise £500m from the Duchy of Cornwall will see farms sold off across England.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cwm242plggldo?at_medium=RSS&at_campaign=rss", "ts": 1794357314.0}, {"t": "'It can kill us': Kenyans fear impact of El Niño with floods predicted", "b": "Forecasters warn that this year's El Niño could be one of the strongest on record, with heavy rain and flooding in Kenya.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c8wy9y37z30vo?at_medium=RSS&at_campaign=rss", "ts": 1794356287.0}, {"t": "Astronomers discover hidden alien planet in James Webb images", "b": "A breakthrough in telescope imaging could reveal countless alien worlds that have be function render(){
 $('h').textContent="News of "+DATE+" · nothing more, nothing less";
 $('n').innerHTML=cats.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';i=0;render()">${c} (${D[c].length})</button>`).join('');
 const L=D[cat],c=$('c');
 if(i>=L.length){c.innerHTML=`<div class="done"><h2>✓ You're all caught up on ${cat}</h2><p class="meta">That was every story for ${DATE}. See you tomorrow.</p></div>`;$('k').textContent="done";return}
 const s=L[i];c.innerHTML=`<div class="meta">${esc(s.s)}</div><h2>${esc(s.t)}</h2><p>${esc(s.b)}</p><div class="meta"><a href="${esc(s.l||'#')}" target="_blank" rel="noopener">Read full story ↗</a></div>`;
 $('k').textContent=(i+1)+" / "+L.length;c.scrollTop=0}
const go=d=>{i=Math.max(0,Math.min(D[cat].length,i+d));render()};
$('p').onclick=()=>go(-1);$('x').onclick=()=>go(1);
document.onkeydown=e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)};
document.ontouchstart=e=>sx=e.touches[0].clientX;
document.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1)};
render();
</script></body></html>
