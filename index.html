nounced in Q2 results; stock gained 7% in 2 weeks", "b": "Crisil approved a third interim dividend of ₹17 per share, equal to 1,700% of face value. Shareholders on record as of October 29 are eligible, with payment due by November 17, 2026. Quarterly revenue rose 20.2% year-on-year to ₹1,095.16 crore.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/crisil-shareholders-alerts-rs-17-per-share-dividend-record-date-announced-in-q2-results-stock-gained-7-in-2-weeks-11792841666173.html", "ts": 1792843392.0}, {"t": "C.E.O.s Say the A.I. Rollout Is Going Well. Employees Feel Differently.", "b": "Surveys show workers and executives have different views on A.I.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/10/24/business/dealbook/ceos-say-the-ai-rollout-is-going-well-employees-feel-differently.html", "ts": 1792843203.0}, {"t": "Rising demand from families needing Christmas help", "b": "Charlotte Riley says more families are reaching out for help for a variety of reasons.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqp8gjz4k7g6o?at_medium=RSS&at_campaign=rss", "ts": 1792842935.0}], "Science": [{"t": "How flare ribbons reveal hidden solar explosions on the sun", "b": "Many topics in astronomy and astrophysics are esoteric. There's not much of a relationship between something like the supermassive black hole at the center of the Milky Way and the life of a regular person going about their business. But the sun is different. Its presence in our lives is inescapable. Its behavior, especially its flaring, has an impact.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-flare-ribbons-reveal-hidden-solar.html", "ts": 1792864801.0}, {"t": "'One-positron cyclotron' could test a key prediction of the Standard Model", "b": "The positron is the antimatter counterpart of the electron, identical in mass but carrying an equal and opposite electric charge. Like the electron, it also behaves like a tiny bar magnet, and according to a key prediction of the Standard Model of particle physics, its magnetic moment should be exactly equal and opposite to the electron's.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-positron-cyclotron-key-standard.html", "ts": 1792862402.0}, {"t": "ISRO will not be privatised, says chairperson Narayanan", "b": "Contributions from private companies should not be misinterpreted as privatisation of the space agency, says the chairperson", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/cities/chennai/isro-will-not-be-privatised-says-chairperson-narayanan/article71620020.ece", "ts": 1792859418.0}, {"t": "Newly identified protein pathway helps HIV stay hidden despite treatment", "b": "Current HIV medicines are effective at suppressing the virus in the blood. However, HIV can remain \"asleep\" or dormant inside certain immune cells and in the brain. These hidden pockets of virus, called HIV reservoirs, are the main reason HIV cannot be cured with today's treatments.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-newly-protein-pathway-hiv-stay.html", "ts": 1792857601.0}, {"t": "Nanoscale alloy redesign tackles cold brittleness for potential deep-space and deep-sea applications", "b": "Metallic materials used in extremely cold environments must maintain high strength, ductility and fracture toughness to support applications in aerospace, clean energy, superconducting systems and deep-space exploration. However, traditional alloys often suffer performance degradation at ultralow temperatures because of the long-standing trade-off between strength, ductility and toughness. Although metals may become stronger at lower temperatures, they can also become more brittle and prone to fracture.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-nanoscale-alloy-redesign-tackles-cold.html", "ts": 1792854002.0}, {"t": "Amber weather warning as Storm Boelo hits Scotland", "b": "The Met Office has issued an amber warning for wind over Scotland from 21:00 until 21:00 on Sunday.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cmqlnkq6p6y7o?at_medium=RSS&at_campaign=rss", "ts": 1792852818.0}, {"t": "Seabird family tree predicts which species accumulate plastic better than diet, global analysis finds", "b": "What seabirds eat might seem like a good starting point for identifying species that tend to accumulate plastic in their digestive systems. Yet a recent global analysis suggests that mapping the evolutionary relatives of birds could offer better clues than their diets or feeding methods alone.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-seabird-family-tree-species-accumulate.html", "ts": 1792850401.0}, {"t": "Could lowering high blood pressure be as simple as stimulating your ear?", "b": "A small device that gently stimulates nerves through the ear could offer a new way to tackle stubborn high blood pressure. In a clinical trial of 63 patients already taking medication, the treatment proved safe, easy to use at home, and well tolerated. Although it did not significantly outperform a placebo overall, patients with more severe hypertension showed promising reductions in blood pressure.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023023732.htm", "ts": 1792847700.0}, {"t": "A hidden bias in human language challenges 70 years of science", "b": "A groundbreaking study challenges 70 years of assumptions about how human language works. By analyzing billions of word uses, scientists discovered that meaning is organized around power, danger, and order rather than emotion alone. Even more surprisingly, human language shows a powerful hidden preference for safety, suggesting that our words may reflect ancient survival instincts.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023023738.htm", "ts": 1792846882.0}, {"t": "Ancient stalagmites reveal exceptions to Asia–South America monsoon seesaw over the past 450,000 years", "b": "In places like South Asia, Africa and parts of the Americas, monsoon rains supply water for drinking, crops and hydropower for billions of people. Understanding the patterns that monsoons tend to follow can help people plan for drought risks affecting agriculture, reservoirs and hydropower across distant regions.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ancient-stalagmites-reveal-exceptions-asiasouth.html", "ts": 1792846801.0}, {"t": "Some Buy Telescopes. These People Build Them From Scratch.", "b": "For a century, amateur telescope makers have gathered at the Stellafane convention to celebrate their craft. Will the event last another 100 years?", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/24/science/space/stellafane-telescopes-makers.html", "ts": 1792846670.0}, {"t": "NASA’s asteroid Bennu samples reveal a 4.5-billion-year-old secret", "b": "Tiny samples from asteroid Bennu are rewriting scientists' understanding of how our Solar System formed. New evidence suggests that Bennu was born where material from the inner and outer Solar System mixed, with Jupiter playing a surprising role in shaping its formation.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023023734.htm", "ts": 1792846206.0}, {"t": "Scientists propose a way to detect dangerous “mirror life” before it exists", "b": "Scientists have proposed a way to detect “mirror life,” a hypothetical form of life that could pose serious risks to humans, animals, and ecosystems if artificially created. Using special fluorescent molecules and a type of polarized light also used in 3D movie technology, researchers believe they could distinguish ordinary organisms from their mirror-image counterparts.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023023726.htm", "ts": 1792845556.0}, {"t": "Astronomers uncover a mysterious magnetic web above the Sun", "b": "The Sun’s seemingly peaceful regions are hiding a surprisingly complex magnetic world. Using a balloon-borne telescope high above Earth, scientists discovered delicate, thread-like magnetic structures woven through the solar atmosphere, apparently shaped by twisting motions on the Sun’s surface. They also mapped magnetic fields inside towering jets of solar material, revealing how those fields change with height.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023023723.htm", "ts": 1792844618.0}, {"t": "These tiny snakes roll four times faster than they slither", "b": "Tiny snakes in Southeast Asia have mastered an extraordinary escape technique: rolling across the ground at speeds up to four times faster than ordinary slithering. Scientists discovered that dwarf reedsnakes accomplish this feat through precisely coordinated body movements that allow their bodies to rotate while their heads remain remarkably stable.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023023718.htm", "ts": 1792843923.0}, {"t": "Cleaner brick kilns cut pollution, but gains did not reach workers, research finds", "b": "Relatively simple changes to the way traditional brick kilns operate in Bangladesh can reduce pollution, save fuel and improve the quality of bricks they produce.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-cleaner-brick-kilns-pollution-gains.html", "ts": 1792843207.0}, {"t": "New long‑clawed British dinosaur is the first of its kind in Europe", "b": "The fossilized skull of a new species of mysterious meat-eating dinosaur from the Isle of Wight has been rediscovered in the collections of the Natural History Museum after over 100 years in storage.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-longclawed-british-dinosaur-kind-europe.html", "ts": 1792843201.0}, {"t": "Storm Boelo to bring severe gales and heavy rain into Sunday", "b": "An amber weather warning has been issued for much of Scotland, parts of Northern Ireland and northern England, as Storm Boelo approaches.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cv8ez97k0wnlo?at_medium=RSS&at_campaign=rss", "ts": 1792842538.0}, {"t": "Scientists discover a hidden switch that burns fat and blocks new fat cells", "b": "Scientists have discovered that switching off a protein called Mitch makes human cells burn more fat and prevents new fat cells from developing. The breakthrough builds on experiments in mice that showed remarkable resistance to obesity and improved muscular endurance, raising hopes for a new approach to weight-loss treatment.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023002905.htm", "ts": 1792840568.0}, {"t": "Swinging virtual lightsabers and punching improve pattern-based learning in VR tests", "b": "Punching a virtual response box or swinging a virtual lightsaber can dramatically improve learning on certain tasks, according to new research from Florida Atlantic University's College of Engineering and Computer Science, which challenges long-standing assumptions about how people learn.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-virtual-lightsabers-pattern-based-vr.html", "ts": 1792837201.0}, {"t": "Wales plans to ban steel pylons as government launches consultation", "b": "The Welsh government says it is consulting on an \"undergrounding-first approach\" to electricity lines.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c9x28dgj2r0go
