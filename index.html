hm interference in a lattice gauge theory", "b": "In a new Nature Physics study, researchers demonstrated the Aharonov-Bohm effect in a quantum simulation of a lattice gauge theory using a hybrid trapped-ion quantum computer.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-paths-flux-ions-simulate-aharonovbohm.html", "ts": 1794074402.0}, {"t": "Earth's gravity may have kept the early moon's volcanic heart beating", "b": "We typically think of the moon as a static, floating object that has remained the same for basically its entire lifetime, with an occasional asteroid impact serving as an exception. That understanding is grounded in physics—the moon should have cooled rapidly after forming when a huge protoplanet hit the early Earth around 4.5 billion years ago. But some lunar material returned from the Chang'e-5 mission was notably formed only around 2 billion years ago, yet appeared to be volcanic in origin.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-earth-gravity-early-moon-volcanic.html", "ts": 1794072601.0}, {"t": "Scientists discover new jellyfish species in waters off Alicante in Spain", "b": "The Mediterranean Sea still holds species unknown to science. One of them is Copula lucentia, a tiny jellyfish measuring just a few millimeters. Discovered off El Campello, in Alicante, it was formally described in 2024 by a research team at the University of Alicante (UA) Marine Laboratory in Dénia, which forms part of the university's Ramón Margalef Multidisciplinary Institute for Environmental Research.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-scientists-jellyfish-species-alicante-spain.html", "ts": 1794067201.0}, {"t": "Heavy rain can more than double glacier speeds in Alaska", "b": "Glaciers are often thought of as unyielding blocks of ice that slowly carve out the landscape as they move downhill by gravity. But sometimes their slow crawl becomes a surge that sees them move orders of magnitude faster than their usual speed.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-heavy-glacier-alaska.html", "ts": 1794066005.0}, {"t": "How Cardiologists’ High Hopes for Two Drugs Were Dashed", "b": "By every measure, the drugs were no better than placebos, full data revealed on Saturday. Was it the fault of the design of the studies, or our very hypotheses about heart disease?", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/07/science/heart-drugs-failed-novartis-novo-nordisk.html", "ts": 1794063004.0}, {"t": "The introduction of a medieval public health system exposed the population to roundworm", "b": "Medieval health and sanitation efforts involved deliberate interventions; however, some of these measures had the opposite effect, leading to an increased spread of disease in Trondheim.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-introduction-medieval-health-exposed-population.html", "ts": 1794061801.0}, {"t": "Still on the President’s Agenda: Daylight Saving Time", "b": "Following an election-year rout for Republicans, Trump castigated lawmakers for not passing the Sunshine Protection Act. Some scientists have warned against the change.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/07/science/donald-trump-daylight-saving-time.html", "ts": 1794061268.0}, {"t": "Lonnie Thompson Has Died. He Dodged Avalanches to Preserve Climate History.", "b": "His observations helped establish shriveling mountain glaciers as an unmistakable consequence of human-caused warming. He was 78.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/06/science/lonnie-thompson-dead.html", "ts": 1794061169.0}, {"t": "Thunderstruck: what does the future hold for lightning?", "b": "Humans have always been awed by the power and beauty of lightning. How does the experience and understanding of it change in a warming world? In a rock shelter in Kakadu national park in the north of Australia is an image of a being the Bininj people call Namarrkon . His flesh bleached away to reveal the bones beneath, he wears stone axes on his head, elbows and knees, and wields a great band of lightning that runs from his ankles up, over his head. Namarrkon’s journey from the Arafura Sea to the Arnhem Land escarpment helped shape the landscape, according to the dreamtime stories of the Bininj. And in the great storms that arc and rumble across the landscape during the buildup and the wet season, it is Namarrkon who splits the clouds with his stone axes to create the thunder and lightning and release the life-giving rain. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/ng-interactive/2026/nov/08/future-of-lightning-global-heating-weather-australia", "ts": 1794060013.0}, {"t": "Theory predicting an older universe without dark matter or dark energy passes key cosmological tests", "b": "An alternative model in which the universe is 26.7 billion years old and needs neither dark matter nor dark energy has held up against several major cosmology tests, according to a new University of Ottawa study. The research, titled \"A Big Bang Nucleosynthesis Consistency Test of the CCC+TL Cosmology,\" is published in the journal Universe.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-theory-older-universe-dark-energy.html", "ts": 1794060002.0}, {"t": "‘Mind-blowing’: dark-sky fans gather on Exmoor to see what light pollution hides", "b": "The UK is 14th most light-polluted country, but in south-west England the veil is lifted at the dark skies festival “It’s just mind-blowing,” says the astronomer and teacher Jo Richardson. She is standing in Exmoor national park talking about Saturn, the first planet she ever saw through a telescope. But it is not the cosmic colour of the planet that Richardson is drawn to, nor its mysteries – it is the vastness. “Saturn, on average, is 800m miles away,” she says, the equivalent to travelling the circumference of the Earth 32,000 times. “You can see it through a telescope here. That’s just nuts.” Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/environment/2026/nov/07/dark-skies-festival-exmoor-light-pollution", "ts": 1794056411.0}, {"t": "Why treating soil acidity crop by crop is no longer enough for prairie farmers", "b": "To protect their future harvests, Western Canadian farmers need to manage soil acidity across their entire multiyear rotation rather than crop by crop, long-term research from the University of Alberta suggests.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-soil-acidity-crop-longer-prairie.html", "ts": 1794056401.0}, {"t": "Diwali celebrations coincide with worsening air. Here's how to stay safer", "b": "For people across South Asia, especially in northern India, Diwali celebrations coincide with the return of hazardous winter air, raising concerns about how to celebrate safely.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-diwali-celebrations-coincide-worsening-air.html", "ts": 1794051601.0}, {"t": "Polar vortex faltering weeks earlier than ever recorded", "b": "Meteorologists said Friday they were observing an unprecedented early disruption of the polar vortex, raising the risk of cold snaps across the Northern Hemisphere, though there remains significant uncertainty.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-polar-vortex-faltering-weeks-earlier.html", "ts": 1794050404.0}, {"t": "Pakistani astronaut to board Shenzhou 24 and become the first foreigner on China's space station", "b": "A Pakistani astronaut will join the crew of China's Shenzhou 24 spacecraft on a rests were nothing like we imagined", "b": "Scientists have uncovered evidence that Europe was dominated for more than 20 million years by open woodlands, colorful meadows, and large grazing animals, not the dense forests long considered its natural state. The surprising discovery challenges modern reforestation strategies, suggesting that planting thick forests could actually harm the biodiversity conservationists hope to protect.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104012333.htm", "ts": 1794044688.0}, {"t": "Rubin Observatory discovers two hidden companions of the Milky Way. Hundreds more may be waiting", "b": "The Vera C. Rubin Observatory has already uncovered two previously unknown companions of the Milky Way using preliminary observations covering just 7% of the night sky. The discoveries include an extremely faint galaxy 355,000 light-years away and a star cluster hidden behind cosmic dust. Scientists suspect hundreds of additional satellite galaxies remain undiscovered, and Rubin's powerful telescope could finally bring them into view.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104012252.htm", "ts": 1794042763.0}, {"t": "At COP31, the ‘overshoot’ narrative cannot replace climate action", "b": "No COP decision has referred to the quantitative value of the total or remaining carbon budget nor has discussed which countries have spent it the most. If COP31 is to deliver real impetus to climate action, its decisions must revert to the basics", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/energy-and-environment/at-cop31-the-overshoot-narrative-cannot-replace-climate-action/article71677165.ece", "ts": 1794041325.0}, {"t": "New Forest wildfire restoration work begins", "b": "Work begins to restore nature to part of the New Forest destroyed by a summer wildfire.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cw98zzn7z04vo?at_medium=RSS&at_campaign=rss", "ts": 1794035673.0}, {"t": "Disasters and debt. Escaping the 'climate-debt doom loop'", "b": "It took around 480,000 trucks to haul away 4.8 million metric tons (5.3 million tons) of rubble across western Jamaica after Hurricane Melissa tore through the Caribbean in 2025, United Nations satellites showed.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-disasters-debt-climate-doom-loop.html", "ts": 1794018002.0}, {"t": "One of the year's most prolific meteor showers to light up the night sky this weekend", "b": "The Leonid meteor shower, known for its bright and fast meteors, will kick off this weekend and continue until the end of November.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cmlykqq7zg9zo?at_medium=RSS&at_campaign=rss", "ts": 1794017008.0}, {"t": "Untangling the patterns of the cosmic microwave background to better understand the early universe", "b": "A figure in red trudges across a blanket of white. Snow squeaks under the scientist's feet, too dry to be slick or soft. Only a line of flags and a few large buildings—the scientist's destination—break up the landscape. The sun hovers on the horizon, never quite setting against a blue sky devoid of clouds.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-untangling-patterns-cosmic-microwave-background.html", "ts": 1794010801.0}, {"t": "Spot a baby bird on the ground? Don't be tempted to bird‑nap it", "b": "Spring is the season of blooming flowers and buzzing bees.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-baby-bird-ground-dont-birdnap.html", "ts": 1794006002.0}, {"t": "The wasps that horrified Darwin reveal evolution's one-way streets", "b": "Few insects have a more gruesome lifestyle than Darwin wasps. Rather than simply hunting other animals, these parasitic wasps lay their eggs on or inside living hosts, including caterpillars, beetles and spiders. Their larvae then feed on their hosts, gradually consuming them and eventually killing them.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-wasps-horrified-darwin-reveal-evolution.html", "ts": 1794003601.0}, {"t": "A dead star's mysterious rings reveal what could happen when our Sun dies", "b": "Astronomers have discovered a strange double ring of planetary wreckage around a dead star, revealing a possible preview of our Solar System's distant future. The two rings are separated by a mysterious gap that researchers believe is maintained by surviving planetary bodies, including one potentially as large as Pluto or the Moon. Their different chemical compositions suggest they may contain the remains of separate destroyed planets.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104012250.htm", "ts": 1794003176.0}, {"t": "Air holes turn silicon wafers into flat ultraviolet focusing mirrors for compact optics", "b": "Traditional lenses and mirrors focus light using curved surfaces. Metasurfaces can achieve similar functions with a flat layer of nanoscale structures that locally control the phase of light. Extending these flat optics into the ultraviolet could support compact systems for high-resolution imaging, spectroscopy, and sensing, but it introduces a fundamental materials problem: many of the materials used to make metasurfaces strongly absorb UV light.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-air-holes-silicon-wafers-flat.html", "ts": 1794002401.0}, {"t": "Biotech Firm Claims Some Credit for Groundbreaking Virus Research", "b": "Radical Numerics turned heads with its announcement about a novel treatment. Now a former partner, Tabula Bioscience, says it performed much of the research.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/06/science/radical-numerics-tabula-phage.html", "ts": 1794001920.0}, {"t": "How a metabolite protects the enzyme that consumes it", "b": "Metabolites are consumed by enzymes to produce other vital molecules as well as to control metabolite levels. But how do cells avoid consuming too much? Researchers from the MPI of Biochemistry, with the University of Nevada, Las Vegas, and the de Duve Institute in Brussels, have deciphered such molecular regulation in tryptophan metabolism. The essential amino acid tryptophan binds to a second site on the enzyme TDO2, distinct from where it is consumed. This sequesters a region needed by two effectors, the kinase CK2 and the ubiquitin ligase CUL1–β-TrCP, which act sequentially to signal TDO2 degradation. The findings are now published in Molecular Cell.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-metabolite-enzyme-consumes.html", "ts": 1794001201.0}, {"t": "Scientists accidentally solve a chemistry mystery that lasted 60 years", "b": "After more than 60 years of unsuccessful attempts, scientists have finally isolated stable examples of elusive boron-oxygen molecules once considered too unstable to capture. The surprising breakthrough, achieved using relatively simple chemical reactions, could pave the way for an entirely new class of exotic compounds.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261103003205.htm", "ts": 1794000484.0}, {"t": "New method measures microplastics in the air using an uncrewed aerial system", "b": "Microplastics have been found in our bodies and the food we eat—and even in remote environments around the world, including seawater and ice in the Arctic. Despite their prevalence, little is known about how they move through the atmosphere. New CIRES-led research, which demonstrates a new method for sampling microplastics in the atmosphere using an uncrewed aerial system (UAS), aims to change that. The findings are published in the journal Scientific Reports.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-method-microplastics-air-uncrewed-aerial.html", "ts": 1794000004.0}, {"t": "Future warming events will outdo the extreme heat waves of the recent past, new study finds", "b": "The extreme heat waves we have seen over the last few years may only serve as a preview of what is to come as a result of climate change. A new study led by researcher Philipp Aglas-Leitner from Freie Universität Berlin, published in Nature Communications, finds that future heat waves could last longer, impact larger areas, and be much more severe.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-future-events-outdo-extreme.html", "ts": 1793998801.0}, {"t": "Light-powered method resurrects 'dead-end' compounds for drug discovery", "b": "Throughout the drug development process, which can take a decade or more, tens of thousands of chemical compounds are produced that never go on to become medicines. A Florida State University researcher is part of a team that has discovered a new way to give some of these \"dead ends\" a second chance at becoming the foundation for tomorrow's blockbuster drugs.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-powered-method-resurrects-dead-compounds.html", "ts": 1793997601.0}, {"t": "Quantum gas microscope reveals individual atoms in first tunable three-component Hubbard system", "b": "For the first time, an international team of researchers from Germany, Thailand, India, China and the United States has created a three-component Hubbard system with tunable interactions in the laboratory. In doing so, the team used a quantum gas microscope to make the individual atoms visible. The study, published in Science, provides an important foundation for future quantum simulations of nuclear physics and materials science.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-quantum-gas-microscope-reveals-individual.html", "ts": 1793996401.0}, {"t": "European forests need to solve two crises—but not necessarily in one place", "b": "Forest areas can act both as carbon sinks and as vital habitats for thousands of species—but not necessarily at the same time. This has important implications for how Europe should manage its forests, says a University of Copenhagen researcher.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-european-forests-crises-necessarily.html", "ts": 1793995201.0}, {"t": "These Newly Elected Lawmakers Know Something Trump Doesn’t: Science", "b": "Among those elected to Congress on Tuesday are a mathematician, a microbiologist and a chemical engineer. They plan to take on a White House that has threatened funding cuts to research.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/06/science/scientists-election-congress.html", "ts": 1793994643.0}, {"t": "MTG-I2 satellite delivers remarkable first images, capturing a weather view of Europe every 2.5 minutes", "b": "Europe's meteorological satellite agency, EUMETSAT, has released the first image from the Flexible Combined Imager (FCI) on board Meteosat Third Generation Imager 2 (MTG-I2), just over two months after the satellite's launch on Aug. 27, 2026. The satellite will provide forecasters with high-resolution observations of Europe every 2.5 minutes. This unprecedented frequency will help forecasters monitor fast-developing weather hazards more closely and support earlier, more precise warnings.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-mtg-i2-satellite-remarkable-images.html", "ts": 1793994010.0}, {"t": "High-precision timeline helps clarify an ancient magma surge in the North Cascades", "b": "Where oceanic crust subducts beneath continental crust, belts of volcanoes known as continental arcs can form. Located around the world, these arcs may undergo episodic magma flare-ups—dramatic surges in the flow of magma into the continental crust at rates up to 20 times higher than normal. However, what triggers these extreme surges, which last tens of millions of years, can be unclear.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-high-precision-timeline-ancient-magma.html", "ts": 1793994006.0}, {"t": "Want to have a better chat? Scientists say the secret is ‘pink noise’", "b": "The most enjoyable conversations strike a balance between exploring a topic and pulling in fresh ideas, study finds As an early stab at rules for conversation, Cicero did a fine job: watch your tone, never look bored, never lose your temper and never ramble on, particularly about yourself, he advised. Now scientists have followed in the great orator’s footsteps and discovered a telltale signature of an enjoyable chinwag. The secret of a mutually satisfying exchange is a healthy dose of pink noise, they say. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/06/better-conversation-study-pink-noise", "ts": 1793991649.0}]},DATE="07 November 2026",cats=Object.keys(D);let cat=cats[0],i=0,sx=0;
