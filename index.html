s/articles/c3dxwjx7xpj0o?at_medium=RSS&at_campaign=rss", "ts": 1793119813.0}, {"t": "Scotland's recycling rates at five-year low. How is your area doing?", "b": "Environmental regulator Sepa says households recycled 42.8% of waste in 2025 - down from 44.3% the previous year.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c62ke84qwl1vo?at_medium=RSS&at_campaign=rss", "ts": 1793115160.0}, {"t": "What's happening to our rubbish?", "b": "As Scotland's recycling rate falls to its lowest level in five years, Kevin Keane looks at what happens to our rubbish.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/c9ly02pj4kdjo?at_medium=RSS&at_campaign=rss", "ts": 1793115050.0}, {"t": "Lula’s win gives Brazil an opportunity to cement its climate leadership, but challenges remain", "b": "In his fourth term, the President can potentially negotiate across the divides that currently frustrate climate agreements, given his country’s status as Latin America’s largest economy, host to most of the Amazon, and its diplomatic relationships with the EU, the U.S., China, the BRICS countries and other devel", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/lulas-win-gives-brazil-an-opportunity-to-cement-its-climate-leadership-but-challenges-remain/article71631670.ece", "ts": 1793111945.0}, {"t": "Are seed oils unhealthy? Why are so many influencers speaking out against them? | Gideon Meyerowitz-Katz", "b": "Randomised trials of omega-6s do not show an increase in inflammation caused by the fatty acid Read more in the Antiviral series If you’ve been online lately, you’ve probably been bombarded with the discourse about seed oils. Once a completely innocuous food that no one really talked about, they have become the enemy of the moment. Robert F Kennedy Jr, the secretary of health and human services in the US, has called them “toxic” and vowed to act against them. There are countless activewear-clad influencers online saying that nothing harms your health more than these products. Which is odd, because the Australian dietary guidelines say seed oils are basically fine. You should limit them because they’re high in calories but otherwise there’s no major reason – according to the guidelines and most experts – why you should avoid them. As Prof Lauren Ball, director of the University of Queensland’s Centre for Community Health and Wellbeing, says: “There’s no convincing evidence that eating seed oils like canola or sunflower oil in normal dietary amounts harms our health.", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/oct/28/are-seed-oils-unhealthy-scientific-evidence", "ts": 1793109637.0}, {"t": "Wildlife appeal closes in on £30m target", "b": "The government pledges £1.9m to wildlife groups' efforts to buy the Rothbury Estate.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c69wznnn4p7yo?at_medium=RSS&at_campaign=rss", "ts": 1793107573.0}, {"t": "Regular spaceplane flights planned in project", "b": "Spaceplanes could take off on regular flights from Cornwall following an agreement.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmdxwzz7x4pno?at_medium=RSS&at_campaign=rss", "ts": 1793106710.0}, {"t": "Neutrinos Are Everywhere. A Physicist Explains.", "b": "Dr. Francis Halzen, the recipient of the Nobel Prize in Physics, sheds some light on the mysterious, subatomic particles that whiz through us everyday.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/26/style/neutrinos-francis-halzen-interview.html", "ts": 1793105767.0}, {"t": "A physicist who took atoms near absolute zero, and physics further", "b": "Claude Cohen-Tannoudji had many connections with India, including acknowledging the work of a little-known scientist who had died three decades before Cohen-Tannoudji won the Nobel Prize", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/claude-cohen-tannoudji-laser-cooling-pancharatnam-michael-berry-ramaseshan/article71625449.ece", "ts": 1793105386.0}, {"t": "Plant-based meat yields higher share of absorbable protein than traditional meat: study", "b": "Laboratory tests show higher protein bioavailability in five plant-based products than in their chicken counterparts; researchers caution further studies needed to assess health benefits", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/plant-based-meat-yields-higher-share-of-absorbable-protein-than-traditional-meat-study/article71628261.ece", "ts": 1793105254.0}, {"t": "Common drugs may help dangerous viruses spread through the body", "b": "A surprising discovery reveals that widely used anti-inflammatory drugs may unintentionally help dangerous viruses spread through the body. Scientists found that JAK inhibitors, prescribed for rheumatoid arthritis and other inflammatory diseases, can weaken a crucial immune defense against influenza, COVID-19, and other infections. By suppressing genes that normally fight viruses, these medications may leave patients more vulnerable to infection.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261026225606.htm", "ts": 1793097981.0}, {"t": "What is Nasa's Artemis III mission? And what comes next?", "b": "Artemis III will help test crucial systems needed for the planned Artemis IV Moon landing in 2028.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cr5j40ezgz4o?at_medium=RSS&at_campaign=rss", "ts": 1793097206.0}, {"t": "More high winds hit parts of UK as Storm Boelo clean-up continues", "b": "A Met Office weather warning is in place for Scotland and Northern Ireland for much of Tuesday.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqm264jxxnxzo?at_medium=RSS&at_campaign=rss", "ts": 1793097040.0}, {"t": "James Webb discovers a scorching lava planet with a “giant sunscreen”", "b": "A scorching lava planet 280 light-years away has surprised astronomers by apparently maintaining a thick atmosphere despite conditions that should have stripped it away billions of years ago. James Webb Space Telescope observations suggest that TOI-561 b reflects about 75% of incoming starlight, possibly because of mineral clouds that act like a giant sunscreen. The planet may also be continually replenishing its atmosphere through gases released from a global ocean of molten rock.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261026225603.htm", "ts": 1793096452.0}, {"t": "Smithsonian scientists just recreated the first 2 billion years of the Universe", "b": "Scientists have created one of the largest and most detailed simulations of the early universe ever made, offering an extraordinary new glimpse into the cosmos shortly after the Big Bang. Called Lumina, the groundbreaking simulation recreates the universe’s first 2 billion years, showing how dark matter, gas, and radiation interacted to give rise to the earliest stars, galaxies, and black holes.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261026225600.htm", "ts": 1793094515.0}, {"t": "Did the Hardest A.I. Problem Just Get Much Easier?", "b": "A prominent researcher claims to have a revolutionary approach to “interpretability,” or the science of why A.I. models do what they do. Other experts aren’t so sure.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/27/science/ai-problem-interpretability.html", "ts": 1793091780.0}, {"t": "Antidepressants Don’t Correct A Chemical Imbalance. How, Then, Do They Work?", "b": "Here’s how psychiatrists like me think about the most promising hypotheses.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/27/science/how-antidepressants-ssri-work.html", "ts": 1793091692.0}, {"t": "In Kashmir’s traditional rice, clues to a journey from East Asia", "b": "Kashmir’s traditional varieties carry cold-tolerance and other locally adapted genes that modern varieties have partly lost, making them potentially valuable as climate change increases stress on crops, new research has found. The analysis also indicated the varieties are more closely related to those from the Korean Peninsula and Northeast China", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/in-kashmir-traditional-rice-clues-to-a-journey-from-east-asia/article71626287.ece", "ts": 1793091447.0}, {"t": "Why scratching an itch feel so good", "b": "Scratch, scratch… and then you hit the exact spot. Aah, yes! We have all had that satisfying moment when a stubborn itch finally disappears under our fingernails. But why does scratching an itch feel so good, and sometimes even feel pleasurable?", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/children/why-scratching-an-itch-feel-so-good/article71519105.ece", "ts": 1793091238.0}, {"t": "What is ‘human composting’ — how does it work?", "b": "The idea of turning a human body into compost might sound unusual, or even unsettling. But how does it actually work? Is it a better alternative to existing methods?", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/what-is-human-composting-how-does-it-work/article71630017.ece", "ts": 1793083634.0}, {"t": "Country diary: Our tiny island is awash with waxcaps | Tim Earl", "b": "Calf of Man, Isle of Man: Such is the wealth of Manx fungi, a map is being built to plot it all. We took a special trip as part of that project The bird observatory on the Calf of Man was sulking under a low cloud base as we stepped ashore at South Harbour. The dank mist was perfect for our surprise visit to the island, as it was not for the birds we had come across, but fungi – in particular, waxcaps. My wife, Liz, and I had taken the chance to accompany Nev Kilkenny, a visiting mycologist, who would help identify and study some autumn mushrooms and toadstools – and contribute to a map that is being assembled of Manx fungi. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/environment/2026/oct/27/country-diary-our-tiny-island-is-awash-with-waxcaps", "ts": 1793079002.0}, {"t": "Would you pay to have the ‘best baby’? Liberal eugenics and the troubling quest for human perfection", "b": "For decades the idea of eugenics has been taboo. Now it is returning in a new commercial guise For a very long time, I dreamed of being cured. I was born in 1981. I learned to walk early enough, but I stumbled and fell more easily than other children. My parents began to worry that something was wrong, that my muscles were weaker than they should be. Eventually, at the age of three, I was diagnosed with a form of spinal muscular atrophy (SMA). In the 1980s, the precise mechanics were not yet understood, but the condition was known to be hereditary, probably linked to a recessive gene. It was also known to be progressive. As I aged, my muscles would not keep pace. At eight, I began to use a wheelchair for longer distances. By the time I was 18, I rarely walked outdoors any more. It is hard to be young and to know that you are growing weaker rather than stronger.", "s": "Science | The Guardian", "l": "https://www.theguardian.com/news/ng-interactive/2026/oct/27/would-you-pay-to-have-the-best-baby-liberal-eugenics-and-the-troubling-quest-for-human-perfection", "ts": 1793077204.0}, {"t": "Perimenopause is everywhere. How do you know if you’re in it? – podcast", "b": "Perimenopause has become a hot topic, with celebrities sharing their experiences and doctors offering tips and advice online. But despite the benefits of growing awareness, a rising number of women are now encountering misinformation about treatments such as HRT.
