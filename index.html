https://www.thehindu.com/business/pnb-eyes-200-crore-quarterly-profit-each-from-credit-card-cash-management-verticals/article71704160.ece", "ts": 1794726694.0}, {"t": "SEBI to issue AI usage guidelines for capital markets, focus on investor protection, says Chairman Tuhin Pandey", "b": "The SEBI chief said the proposed guidelines would focus on establishing appropriate guardrails for AI use, including disclosures, accountability of regulated entities and a ‘human-in-the-loop’ approach", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/sebi-to-issue-ai-usage-guidelines-for-capital-markets-focus-on-investor-protection-says-chairman-tuhin-pandey/article71704284.ece", "ts": 1794726503.0}, {"t": "Mahanagar Gas hikes CNG prices in Mumbai by ₹1.5/kg, sixth hike since May", "b": "Cumulatively prices of the vehicular gas have increased ₹9.5 per kg across six tranches since May 14", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/Economy/mahanagar-gas-hikes-cng-prices-in-mumbai-by-15kg-sixth-hike-since-may/article71704245.ece", "ts": 1794725978.0}, {"t": "FPIs pump ₹84,290 crore into equities in first fortnight of November", "b": "According to the data, Foreign Portfolio Investors (FPIs) made a net investment of ₹84,290 crore in Indian equities during November 2-13, covering nine trading sessions.", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/markets/fpis-pump-84290-cr-into-equities-in-first-fortnight-of-november/article71704213.ece", "ts": 1794724359.0}, {"t": "Geopolitics Looms Over Eurovision, but Not Its Asian Edition", "b": "So far, the contest’s organizers have kept politics offstage. The European edition shows how difficult that can be.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/11/14/world/asia/eurovision-asia-politics.html", "ts": 1794714592.0}, {"t": "Anthropic’s valuation can’t secure its moat", "b": "Its engineers need to keep building progressively more capable models; the AI firm has also not established that it will be able to sustain its profitability after honouring its infra commitments", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/Industry/anthropics-valuation-cant-secure-its-moat/article71702866.ece", "ts": 1794708971.0}, {"t": "SpaceX Makes History With Successful Rocket Catch in Texas", "b": "The Starship spacecraft returned from orbit to the same spot where it lifted off, marking a key milestone in SpaceX’s vision of building fully reusable rockets.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/11/14/science/spacex-starship-first-catch.html", "ts": 1794702993.0}, {"t": "Beauty advent calendars can cost hundreds but are they value for money?", "b": "Beauty calendars have become a Christmas staple and have become particularly popular with female shoppers.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqn83l442724o?at_medium=RSS&at_campaign=rss", "ts": 1794700867.0}, {"t": "Family Dollar to Pay $63 Million Settlement for Overcharging Customers", "b": "Since 2023, the discount retailer has been overcharging shoppers “millions of dollars” at checkout, according to a complaint filed by federal regulators and 17 states.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/11/14/business/family-dollar-overcharging-settlement.html", "ts": 1794698404.0}], "Science": [{"t": "Tangled quantum whirlpools caught unraveling in an ultracold gas", "b": "When a cloud of atoms is cooled close to absolute zero, its atoms can merge into a Bose–Einstein condensate (BEC): an exotic fluid in which atoms across the whole cloud share a single quantum state. Current theories predict that as a disordered quantum gas settles into this ordered state, a tangle of tiny vortices should form and gradually unravel.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-tangled-quantum-whirlpools-caught-unraveling.html", "ts": 1794760801.0}, {"t": "Climate response: Why previous warming makes all the difference", "b": "Global temperatures may continue to rise even after human CO₂ emissions stop. The temperature change that follows is known as the zero emissions commitment (ZEC), and it is often assumed to be close to zero. A study led by the Met Office Hadley Center, with co-authors from several institutions including the University of Liverpool, found that the temperature response depends on how much warming has already occurred.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-climate-response-previous-difference.html", "ts": 1794756601.0}, {"t": "Giant, prehistoric rodent fossils discovered in southern Thailand", "b": "An international team of paleontologists, including researchers from McGill University, has discovered \"remarkably large\" rodent fossils in the pit of a mine in southern Thailand. The finding, published in Scientific Reports, provides a new perspective on the early manifestation of rodent gigantism—the process by which animals evolve to become larger—demonstrating that the evolutionary history of large-bodied rodents is considerably older and more geographically widespread than previously recognized, the researchers said.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-giant-prehistoric-rodent-fossils-southern.html", "ts": 1794754801.0}, {"t": "Vitamin C could help block cancer-linked chemicals in your stomach, study finds", "b": "Scientists have discovered that vitamin C may help prevent potentially cancer-causing chemicals from forming in the stomach after eating foods containing nitrates and nitrites. A new mathematical model suggests that taking vitamin C after meals could reduce these harmful reactions, offering a possible new strategy for lowering cancer risk.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261114202236.htm", "ts": 1794751998.0}, {"t": "A common osteoporosis drug blocked spinal damage in a surprising new study", "b": "Scientists have uncovered a surprising genetic connection to spinal degeneration and found that an existing osteoporosis drug can prevent damaging mineral buildup in zebrafish spines. The discovery could pave the way for new treatments that slow or prevent a major cause of chronic back pain.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261113232105.htm", "ts": 1794751419.0}, {"t": "Gout is on the rise – and excruciating. Why are sufferers still judged for it?", "b": "About 1.6 million people in the UK have this agonising condition, but it is often viewed as a comical malady brought on by overconsumption and idleness. What can be done to end the stigma? Brett McAllister-Byrne was in his early 30s when he first noticed a sharp ache in his ankle and big toe. “I felt it the night after playing football, and I thought I must have had a knock or something,” he says. “But then it just got worse and worse.” The next morning McAllister-Byrne, an urban planner, was in too much pain to go to work. When he described the episode to his family, they suggested it might be gout. “I was like, really?” he says. “Can you get that in your 30s?” Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/lifeandstyle/2026/nov/15/gout-is-on-the-rise-and-excruciating-why-are-sufferers-still-judged-for-it", "ts": 1794751216.0}, {"t": "New observations challenge evidence for an 'outsize' black hole in the early universe", "b": "A recent reanalysis of the outsize black hole galaxy UHZ1 using existing X-ray data and new infrared observations challenges a previous groundbreaking claim. Three years ago, this galaxy made news for hosting an unusually massive and heavily dust-obscured black hole formed through direct collapse. Led by Fan Zou of the University of Michigan, the new study reports no signs of hidden black hole activity. The paper, published in The Astrophysical Journal on Oct. 14, suggests UHZ1 could be a low-mass, metal-poor, star-forming galaxy.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-evidence-outsize-black-hole-early.html", "ts": 1794751204.0}, {"t": "Uranus and Neptune’s bizarre magnetic fields may finally be explained", "b": "The strange, wildly tilted magnetic fields of Uranus and Neptune have puzzled scientists since NASA's Voyager 2 spacecraft explored the planets in the 1980s. New simulations suggest that extreme conditions deep inside these icy giants create unusual electrical properties that could explain their magnetic fields. Remarkably, the models indicate that their magnetic poles could shift by tens of degrees within just a few decades, far faster than Earth's.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261114202204.htm", "ts": 1794750202.0}, {"t": "Taiwan Indigenous farmer revives climate-resilient millet", "b": "Indigenous farmer Banu Ismahasan walks through a golden field of tall stalks in southeastern Taiwan, harvesting by hand the grain heads of an ancient crop resistant to extreme weather.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-taiwan-indigenous-farmer-revives-climate.html", "ts": 1794750008.0}, {"t": "Nations grapple with loss of 1.5C target at UN climate summit", "b": "For a decade, the 1.5C goal has served as the north star of climate action, a line nations pledged to hold to avoid the worst ravages of a warming planet.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-nations-grapple-loss-15c-climate.html", "ts": 1794748805.0}, {"t": "SpaceX's Starship returns from orbit and is captured by launch pad arms in a dramatic first", "b": "SpaceX's Starship made a triumphant return to Earth on Saturday, caught in midair by giant mechanical arms where its journey began 22 hours earlier.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-spacex-starship-orbit-captured-pad.html", "ts": 1794748003.0}, {"t": "Astronomers discover a dead star spinning every 8 minutes and sending mysterious radio pulses", "b": "Scientists have discovered a strange stellar pair more than 5,000 light-years away, where a dead star spinning every eight minutes produces mysterious radio pulses while orbiting a Sun-like star. The breakthrough also revealed massive magnetic storms on the companion star, offering fresh clues to one of astronomy's emerging mysteries.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261114202136.htm", "ts": 1794747849.0}, {"t": "ALMA reveals three star-forming cores at different stages inside one gas clump", "b": "Astronomers have revealed three dense cores at different evolutionary stages within the massive star-forming region G40.282−0.219, shedding light on the physical and chemical differences among cores within the same massive dense clump.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-alma-reveals-star-cores-stages.html", "ts": 1794747601.0}, {"t": "SpaceX pulls off first-ever spaceship ‘catch’", "b": "Starship returned from orbit and was caught by the “chopstick arms” at SpaceX’s Starbase launch pad in Texas, in a milestone for fully reusable rockets", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/international/spacexs-starship-returns-from-orbit-and-is-captured-by-launch-pad-arms-in-a-dramatic-first/article71703046.ece", "ts": 1794747336.0}, {"t": "A simple supplement could help your immune system fight cancer and viral infections", "b": "A surprising discovery from Rockefeller University suggests that a common amino acid could play a powerful role in protecting against cancer and viral infections. Scientists found that low arginine levels interfere with the immune system's ability to recognize dangerous cells, while increasing arginine intake reduced colon cancer tumors and improved viral infection outcomes in mice. Even more remarkably, giving mice arginine after they contracted influenza helped them recover.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261113232000.htm", "ts": 1794746212.0}, {"t": "How to spot November's planetary parade in the pre-dawn sky", "b": "The planets of Mercury, Venus, Mars and Jupiter will align in pre-dawn sky throughout November.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cke8rr37lrryo?at_medium=RSS&at_campaign=rss", "ts": 1794739797.0}, {"t": "‘Birdbrain’ Is a Misnomer. Crows Make Decisions Faster Than We Can", "b": "In a recent experiment, crows could process and respond to visual cues at twice the speed as humans and monkeys.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/15/science/birdbrain-crows-birds-research-decision.html", "ts": 1794736836.0}, {"t": "NASA's Voyager 1 closes in on a light-day in interstellar space for new distance record", "b": "NASA is looking at another 18,000 years before the spacecraft achieves a full light-year and more than double that before it comes near another star", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/nasas-voyager-1-closes-in-on-a-light-day-in-interstellar-space-for-new-distance-record/article71704036.ece", "ts": 1794722387.0}, {"t": "Alzheimer’s may start shrinking two brain regions years before memory loss", "b": "Johns Hopkins scientists have uncovered hidden warning signs of Alzheimer’s disease that may appear up to a decade before memory loss begins. Brain scans revealed that two regions involved in memory and emotion start shrinking before the hippocampus, the area doctors typically examine for signs of Alzheimer’s. These early changes are linked to abnormal tau protein buildup and could provide a powerful new way to identify people at risk.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261114202130.htm", "ts": 1794717116.0}, {"t": "Scientists discover a bizarre paradox among endangered penguins", "b": "A groundbreaking drone survey has revealed a startling split in the fate of New Zealand's endangered Erect-crested penguins. While one population has remained stable for decades, another has declined by more than 40%, apparently due to a combination of predators, worsening storms, and changing ocean conditions. Even more surprisingly, the tiny Bounty Islands support nearly as many breeding pairs as the Antipodes Islands, despite being 40 times smaller.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261112230458.htm", "ts": 1794714172.0}, {"t": "Dinosaurs may have been eating seaweed 100 million years ago", "b": "Dinosaurs may have been snacking on seaweed and other ocean foods more than 100 million years ago, according to surprising new evidence hidden in their fossilized teeth. Researchers discovered chemical signatures suggesting that coastal dinosaurs and other prehistoric animals relied partly on nutrients originating in the sea. The findings reveal that marine resources traveled through ancient food chains, supplementing the diets of everything from plant-eating dinosaurs to predators.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261112230502.htm", "ts": 1794711654.0}, {"t": "Physicists use laser light to unlock a crystal's hidden electrical powers", "b": "Scientists have discovered how to use flashes of laser light to organize tiny electrical regions inside a crystal, solving a decades-old
