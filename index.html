/india/aiadmk-would-welcome-dhanush-with-both-hands-says-rajendra-balaji/articleshow/135018032.cms", "ts": 1792258223.0}, {"t": "'Swelling crowd, situation worsened by rain': What we know so far about Kolkata pandal stampede", "b": "The stampede took place at Chorbagan Sarbojanin Durgotsab Samity puja pandal, a prominent puja in central Kolkata, during the peak hours on Saturday evening.", "s": "India News: Latest India News, Today breaking News Headlines, Real-time News coverage from India | Hindustan Times | Hindustan Times", "l": "https://www.hindustantimes.com/india-news/kolkata-pandal-stampede-swelling-crowd-rain-chorbagan-sarbojanin-durgotsab-samity-puja-pandal-deaths-101792256978388.html", "ts": 1792258152.0}, {"t": "'Thoughts with those who have lost their loved ones': PM Modi on Kolkata stampede", "b": "The incident occurred around 7.40 pm in the Girish Park police station area amid heavy crowds of pandal visitors and rainfall. As rain began, people waiting outside the pandal rushed forward, causing some to fall on the road and triggering a stampede, a senior police officer told PTI. All the injured were rescued and taken to Calcutta Medical College for treatment.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/thoughts-with-those-who-have-lost-their-loved-ones-pm-modi-on-kolkata-stampede/articleshow/135017835.cms", "ts": 1792258029.0}, {"t": "Kolkata pandal stampede: Mamata Banerjee expresses 'shock and grief', TMC alleges poor crowd management", "b": "In an X post, the TMC stated that eyewitnesses and local residents reported little to no police presence for crowd control at the Chorebagan Puja Pandal.", "s": "India News: Latest India News, Today breaking News Headlines, Real-time News coverage from India | Hindustan Times | Hindustan Times", "l": "https://www.hindustantimes.com/india-news/kolkata-pandal-stampede-mamata-banerjee-expresses-shock-and-grief-tmc-alleges-poor-crowd-management-101792257850866.html", "ts": 1792258027.0}, {"t": "Kolkata Durga Puja Stampede: 19 dead; PM Modi, Amit Shah, Rahul Gandhi, Mamata Banerjee express grief", "b": "In a heartbreaking incident at a Durga Puja pandal in north Kolkata, a stampede claimed the lives of at least 19 people and left 25 others injured amid a surge of visitors driven by panic from heavy rains. Rescue efforts were promptly initiated, and medical staff rushed the injured to hospitals.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/kolkata-durga-puja-stampede-pm-modi-amit-shah-mamata-express-grief/articleshow/135017733.cms", "ts": 1792257744.0}, {"t": "Kolkata stampede Highlights: At least 17 dead in crush; PM announces ₹2L ex gratia; President expresses condolences", "b": "Kolkata Chorbagan stampede Highlights: A stampede-like situation broke out at Kolkata's Chorbagan Sarbojanin Durga Puja pandal on 17 October amid heavy rain and overcrowding. At least 17 people lost their lives in the incident. Reports of fatalities remain subject to official confirmation.", "s": "mint - news", "l": "https://www.livemint.com/news/kolkata-durga-puja-chorbagan-stampede-live-several-feared-dead-suvendu-adhikari-medical-college-helpline-number-top-news-11792256180203.html", "ts": 1792257546.0}, {"t": "Sabarimala temple opens for Thulam month rituals; CM Satheesan offers prayers", "b": "The revered Sabarimala Lord Ayyappa temple was opened on Saturday for the rituals of the Thulam month, drawing numerous devotees eager to pay their respects. Kerala Chief Minister V D Satheesan, along with other esteemed guests, visited the shrine for prayers. The temple's opening for devotees is scheduled for 5 am on Sunday, coinciding with Mahanavami and Vijayadashami, a unique occurrence in many decades.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/sabarimala-temple-opens-for-thulam-month-rituals-cm-satheesan-offers-prayers/articleshow/135016954.cms", "ts": 1792256815.0}, {"t": "Only big pandals mean fat money? Why small Durga Puja committees in West Bengal are struggling", "b": "West Bengal’s Durga Puja season delivered uneven business gains, with major puja organisers, malls and e-commerce platforms reporting strong activity while smaller committees and traditional retailers struggled.&nbsp;", "s": "mint - news", "l": "https://www.livemint.com/news/india/only-big-pandals-mean-fat-money-why-small-durga-puja-committees-in-west-bengal-are-struggling-11792255812223.html", "ts": 1792256626.0}, {"t": "Kolkata pandal stampede: Heavy rush amid rain led to deadly incident - top developments", "b": "A chaotic stampede unfolded at the Sarada Park Durga Puja pandal in north Kolkata due to a crowd surge, leading to at least 1 deaths and 15 injuries. Emergency services transported the injured to Calcutta Medical College and Hospital for immediate medical assistance. The West Bengal health minister, alongside other political leaders, responded by visiting the scene and the hospital.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/kolkata-pandal-stampede-heavy-rush-amid-rain-led-to-deadly-incident-top-developments/articleshow/135017310.cms", "ts": 1792256331.0}, {"t": "Kolkata stampede LIVE: Toll reaches 19, CM Suvendu Adhikari says Chorbagan puja organisers detained", "b": "Kolkata stampede LIVE: A stampede took place at Chorbagan Sarbojanin Durgotsab Samity puja pandal in Kolkata.", "s": "India News: Latest India News, Today breaking News Headlines, Real-time News coverage from India | Hindustan Times | Hindustan Times", "l": "https://www.hindustantimes.com/india-news/kolkata-stampede-live-updates-chorbagan-sarbojanin-durgotsab-samity-durga-puja-pandal-deaths-bengal-suvendu-adhikari-101792254911241.html", "ts": 1792256065.0}, {"t": "Tamil Nadu BJP slams ministers for allowing Muslim aide in skull cap into temple", "b": "The BJP alleged that the incident, which took place on Saturday, went against a Madras high court order issued in January 2024 that restricts non-Hindus from proceeding beyond the temple’s flagmast unless they submit an undertaking affirming their faith in the deity and their willingness to follow Hindu customs. The party also claimed that the entry violated the temple’s dress code and religious traditions.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/tamil-nadu-bjp-slams-ministers-for-allowing-muslim-aide-in-skull-cap-into-temple/articleshow/135017190.cms", "ts": 1792255532.0}, {"t": "CJP founder Abhijeet Dipke granted bail after arrest in Delhi; asked to sign peace bond", "b": "Dipke was produced before a special executive magistrate at the Mandir Marg police station, which granted him bail subject to certain conditions", "s": "mint - news", "l": "https://www.livemint.com/news/india/cjp-founder-abhijeet-dipke-granted-bail-after-arrest-in-delhi-asked-to-sign-peace-bond-11792249790056.html", "ts": 1792254655.0}, {"t": "‘Taking away right to vote, protest’: Uddhav backs opposition's ‘regime change’ call against government", "b": "‘Taking away right to vote, protest’: Uddhav backs opposition's ‘regime change’ call against government", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/taking-away-right-to-vote-protest-uddhav-backs-oppositions-regime-change-call-against-government/articleshow/135017025.cms", "ts": 1792254476.0}, {"t": "FSSAI issues notices to Nestlé India, HUL over misleading products and non-compliances; What are the claims?", "b": "The Food Safety and Standards Authority of India (FSSAI) has issued notices to Hindustan Unilever (HUL) and Nestlé India over alleged violations. The regular has flagged two of their products.", "s": "mint - news", "l": "https://www.livemint.com/news/india/fssai-issues-notices-to-nestl-india-hul-over-misleading-products-what-are-the-claims-11792252684689.html", "ts": 1792254035.0}, {"t": "At least 17 dead in stampede-like situation at Kolkata's Chorbagan Durga Puja pandal; CM Suvendu Adhikari at hospital", "b": "Several people were injured after a section of Kolkata's Chorbagan Sarbojanin Durga Puja pandal collapsed amid heavy crowds on Saptami evening.", "s": "mint - news", "l": "https://www.livemint.com/news/india/several-injured-in-stampede-like-situation-at-kolkatas-chorbagan-durga-puja-pandal-11792253088233.html", "ts": 1792253258.0}, {"t": "NCB busts two synthetic drug labs in Greater Noida, seizes drugs worth Rs 50 crore", "b": "The Narcotics Control Bureau conducted a significant raid on two synthetic-drug laboratories in Greater Noida. During the operation, authorities seized large quantities of Methamphetamine and precursor chemicals. Two individuals were arrested, including a Nigerian national using a false identity. Investigators are tracing financial and chemical supply networks linked to the suspects. Citizens are urged to report suspicious activities to promote public safety and environmental health.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/ncb-busts-two-synthetic-drug-labs-in-greater-noida-seizes-drugs-worth-rs-50-crore/articleshow/135016626.cms", "ts": 1792252947.0}, {"t": "'Deserves Celebration': Economist On India's Post-Covid Economic Performance", "b": "He said that the growth streak of five years of over 7 per cent growth matches India's 2003-2007 run, when India attracted global attention as one of the BRIC economies.", "s": "NDTV News Search Records Found 1000", "l": "https://www.ndtv.com/india-news/deserves-celebration-economist-on-indias-post-covid-economic-performance-12200115#publisher=newsstand", "ts": 1792252866.0}, {"t": "'A proud dad': Assam CM Himanta Biswa shares emotional note as son receives law degree, posts photo with CJI Surya Kant", "b": "CM Sarma, in his post on X, also reflected on his son's decision to take a year off for CLAT preparation.", "s": "India News: Latest India News, Today breaking News Headlines, Real-time News coverage from India | Hindustan Times | Hindustan Times", "l": "https://www.hindustantimes.com/india-news/a-proud-dad-assam-cm-himanta-biswa-shares-emotional-note-as-son-receives-law-degree-posts-photo-with-cji-surya-kant-101792249865569.html", "ts": 1792252498.0}, {"t": "Delhi Food Body Finds Lizard At Reliance Retail, Cockroaches At Zepto Store", "b": "The inspections covered facilities operated by Swiggy Instamart, Zepto, Blinkit, Zomato Hyperpure and Reliance Retail. Officials found hygiene violations, improper food storage and lapses in maintaining the prescribed temperatures, the Delhi government said on Saturday.", "s": "NDTV News Search Records Found 1000", "l": "https://www.ndtv.com/india-news/delhi-food-body-finds-lizard-at-reliance-retail-cockroaches-at-zepto-store-12200104#publisher=newsstand", "ts": 1792252128.0}, {"t": "India-New Zealand FTA: Sheep meat gets zero duty, kiwi fruit at 15% as tariff cuts take effect October 20", "b": "India has notified its first set of customs duty concessions for imports from New Zealand under the bilateral free trade agreement, with preferential rates taking effect on October 20.&nbsp;", "s": "mint - news", "l": "https://www.livemint.com/news/india/indianew-zealand-fta-sheep-meat-gets-zero-duty-kiwi-fruit-at-15-as-tariff-cuts-take-effect-october-20-11792250495410.html", "ts": 1792252101.0}, {"t": "Supreme Court’s enquiry committee launches complaint portal over violence during July protests", "b": "A complaint portal has been launched by the High Powered Enquiry Committee for individuals affected by protests. This portal allows victims to confidentially submit their complaints regarding violence that occurred in July. The Ministry of Home Affairs stated that submissions can also be made in person or via post. The committee will prioritize cases involving serious violence, especially against women protesters.", "s": "India News | Latest India News Today & Real-time News from India, India Breaking News", "l": "https://timesofindia.indiatimes.com/india/supreme-courts-enquiry-committee-launches-complaint-portal-over-violence-during-july-protests/articleshow/135016581.cms", "ts": 1792251851.0}, {"t": "US' Russia sanction waiver a relief for India's exporters, energy security: Experts", "b": "On October 16, Trump waived sanctions, restrictions and duties under SRIA, citing national interest.", "s": "India News: Latest India News, Today breaking News Headlines, Real-time News coverage from India | Hindustan Times | Hindustan Times", "l": "https://www.hindustantimes.com/india-news/us-russia-sanction-waiver-a-relief-for-indias-exporters-energy-security-experts-101792250907111.html", "ts": 1792251790.0}, {"t": "Rahul Gandhi to address public meeting in Goa as Congress concludes outreach yatra on October 18", "b": "Rahul Gandhi will join the Congress’s Goy Rakhon Yatra in Goa on Sunday and address its concluding meeting in Margao.", "s": "India News: Latest India News, Today breaking News Headlines, Real-time News coverage from India | Hindustan Times | Hindustan Times", "l": "https://www.hindustantimes.com/india-news/rahul-gandhi-to-address-public-meeting-in-goa-as-congress-concludes-outreach-yatra-on-october-18-101792242240987.html", "ts": 1792249970.0}, {"t": "Man killed, four injured in suspected militant attack on Kuki village in Manipur", "b": "A tragic incident unfolded in Chassad village, Manipur, where a militant attack led to the death of one man and injuries to four others. Gunfire erupted between the militants and a local armed faction, with the violence persisting into the even s-next-week-preview-dividend-history-11792235803320.html", "ts": 1792241354.0}, {"t": "US' Russia sanction waiver a relief for India", "b": "US' Russia sanction waiver a relief for India", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/economy/foreign-trade/us-russia-sanction-waiver-a-relief-for-indias-exporters-energy-security-experts/articleshow/135014460.cms", "ts": 1792240848.0}, {"t": "Axis appoints HDFC veteran to lead Bharat Banking", "b": "Axis appoints HDFC veteran to lead Bharat Banking", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/industry/banking/finance/banking/axis-bank-appoints-former-hdfc-bank-veteran-rahul-shukla-to-head-commercial-bharat-banking/articleshow/135014153.cms", "ts": 1792239725.0}, {"t": "Central Bank of India Q2 profit rises 21% as loans grow 30%", "b": "Central Bank of India reported a 21% rise in September 2026 quarterly net profit to Rs 1,469 crore, supported by 26% net interest income growth and 30% loan expansion. Asset quality improved, with net NPA declining to 0.31%, while operating efficiency strengthened.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/central-bank-of-india-q2-profit-rises-21-as-loans-grow-30/articleshow/135014014.cms", "ts": 1792239265.0}, {"t": "Expired food found at Delhi delivery stores", "b": "Expired food found at Delhi delivery stores", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/industry/cons-products/food/buying-groceries-online-for-festivals-unsafe-ghee-expired-green-peas-yoghurt-brownies-found-at-delhi-facilities-mosquitoes-and-lizards-also-spotted/articleshow/135013603.cms", "ts": 1792238836.0}], "Science": [{"t": "Quantum magic state cleanup cuts errors 40-fold in first successful hardware test", "b": "Qubits, the quantum equivalent of digital bits, are fragile and prone to errors. That makes building reliable quantum computers extremely difficult. One fix has been to use traditional magic state distillation, which filters out flaws, but it is extremely resource-intensive.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-quantum-magic-state-cleanup-errors.html", "ts": 1792260002.0}, {"t": "A Reporter Who Saw Covid Coming Has Died", "b": "Helen Branswell recognized the threat of the pandemic ahead of the vast majority of journalists and even medical experts. She was 69.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/17/health/helen-branswell-dead.html", "ts": 1792257420.0}, {"t": "What an ancient volcanic eruption teaches us about resilience today", "b": "When a massive environmental disaster strikes, do societies simply collapse and disappear? Or do people find a way to adapt, rebuild and recover?", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ancient-volcanic-eruption-resilience-today.html", "ts": 1792256405.0}, {"t": "Hand-cranked device tells blood type and red cell levels in 1 minute", "b": "When someone is badly injured, doctors urgently need two facts: the patient's blood type, so that a transfusion is safe, and their hematocrit, the share of the blood made up of red blood cells, which reveals blood loss or anemia. Hospitals measure both with large machines that need electricity and trained staff, which are often unavailable in ambulances, disaster zones or remote clinics.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-cranked-device-blood-red-cell.html", "ts": 1792252801.0}, {"t": "Salt crystals could hold clues to life beneath Enceladus's ice", "b": "The ocean beneath Saturn's moon Enceladus lies under kilometers of ice, but some of its contents do reach the surface. Jets near the south pole spray out water vapor and icy particles, offering a way to investigate the hidden ocean without drilling down to it.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-salt-crystals-clues-life-beneath.html", "ts": 1792251601.0}, {"t": "Australian scavengers don't just eat everything and slink away. They approach a carcass like a buffet", "b": "When scientists talk about scavengers, you might imagine an animal sniffing out or stumbling across a carcass, eating as much as possible and slinking away.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-australian-scavengers-dont-approach-carcass.html", "ts": 1792249201.0}, {"t": "The ambiguous costs of climate change", "b": "As human activity has increased temperatures globally, determining the costs directly incurred by climate change is challenging. The effects of climate change on extreme weather events—such as hurricanes and heat waves—can be locally specific and variable, and observations and climate modeling might not accurately capture those effects.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ambiguous-climate.html", "ts": 1792246801.0}, {"t": "Lone, starless cloud may be a 'dark' galaxy", "b": "Astronomers using China's FAST radio telescope have discovered a compact cloud of hydrogen with no visible stars or galaxy around it. This could be one of the strongest candidates yet for an isolated \"dark galaxy,\" containing nearly 500,000 times the sun's mass in neutral hydrogen. The discovery paper was posted to the arXiv preprint server on Sept. 24.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-lone-starless-cloud-dark-galaxy.html", "ts": 1792244404.0}, {"t": "NASA’s Roman Space Telescope exceeds expectations by nearly 30%", "b": "NASA’s Nancy Grace Roman Space Telescope has exceeded expectations after engineers made incredibly tiny adjustments to sharpen its view of the universe. By moving a mirror just one-sixteenth the width of a human hair, the team helped bring its powerful instruments into near-perfect alignment. Roman’s Wide Field Instrument now produces image quality nearly 30% better than predicted, promising exceptionally sharp cosmic surveys.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261016070630.htm", "ts": 1792243693.0}, {"t": "This bird flies thousands of miles, but its wings have a catch", "b": "Scientists have uncovered an unexpected trade-off in the wings of the European nightjar, a bird that migrates thousands of kilometers but sacrifices high-speed flight efficiency to hunt insects with remarkable agility. Even more surprisingly, it generates thrust on the upward wingbeat, a technique that could inspire new flying technologies.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261016070624.htm", "ts": 1792242302.0}, {"t": "Red-sensitive pigments in mantis shrimp eyes act as reversible light switches", "b": "With about 30 visual pigments, compared to just three in humans, mantis shrimp possess a visual system that remains a mystery. Researchers from ULiège and Humboldt University in Berlin have, for the first time, analyzed these pigments one by one and discovered that some detect red light that very few animals can perceive. This finding, published in Science Advances, has potential applications in optogenetics.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-red-sensitive-pigments-mantis-shrimp.html", "ts": 1792242001.0}, {"t": "Brain cells meant to protect us may be fueling cognitive decline", "b": "Scientists have uncovered a surprising cause of age-related cognitive decline involving brain cells previously thought to be entirely beneficial. As these cells become dysfunctional, they can produce abnormal amounts of myelin, disrupting nerve fibers and potentially contributing to worsening memory and thinking skills.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015073222.htm", "ts": 1792241062.0}, {"t": "NASA’s Webb reveals the wild weather of a mysterious world 20 light-years away", "b": "NASA’s James Webb Space Telescope has revealed that a turbulent world 20 light-years away has a surprisingly orderly weather system, with three recurring atmospheric states driven by temperature changes and shifting clouds. The breakthrough gives scientists a powerful new tool for uncovering weather patterns on distant worlds and understanding the conditions that shape their atmospheres.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015073215.htm", "ts": 1792240009.0}, {"t": "Electrical sliding switches graphene between magnetic states", "b": "In a discovery that could offer a new way to control quantum properties in two-dimensional materials, researchers at Cornell have found that electrically sliding the layers of ultrathin graphene can switch the material between distinct magnetic states that persist even after the voltage is removed.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-electrical-graphene-magnetic-states.html", "ts": 1792238406.0}, {"t": "Global survey links financial hardship to lower trust in science", "b": "Poor access to health care, limited local influence over research priorities and an unequal distribution of scientific benefits are undermining public confidence in science, experts warn, following the release of a global trust survey.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-global-survey-links-financial-hardship.html", "ts": 1792238401.0}, {"t": "Popular song lyrics express less emotion over time, analysis of 38K+ songs finds", "b": "New research from Michigan State University finds that popular music has gradually become less explicit about emotion and relationships—both across generations of artists and within artists' careers.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-popular-song-lyrics-emotion-analysis.html", "ts": 1792236005.0}, {"t": "During El Niño, a perfect storm of weather systems could spell disaster for the Great Barrier Reef", "b": "The strong El Niño currently under way in the Pacific Ocean raises the specter of marine heat waves and coral bleaching once again threatening Australia's iconic Great Barrier Reef. And now new research has revealed the complex interplay of atmospheric patterns and weather systems thousands of kilometers apart that can combine in a recipe potentially fatal for coral reefs.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-el-nio-storm-weather-disaster.html", "ts": 1792234807.0}, {"t": "For a Mere $2 Million, You Could Own Three Books That Unlocked the Universe", "b": "At Sotheby’s, a feast of rare science books includes volumes from Copernicus, Galileo and Newton that together revolutionized human understanding of the cosmos.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/17/science/sothebys-science-books-auction.html", "ts": 1792227710.0}, {"t": "Optical imaging links altered metabolism and oxygen use in Alzheimer's disease", "b": "Alzheimer's disease is best known for its effects on memory and cognition, but the disease also involves changes in how brain cells produce and use energy. Mitochondria, the structures that supply much of a cell's energy, can become dysfunctional in Alzheimer's disease. At the same time, changes in blood flow and oxygen availability may place additional demands on brain tissue. Understanding how these processes interact could help researchers characterize metabolic changes that accompany the disease.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-optical-imaging-links-metabolism-oxygen.html", "ts": 1792225001.0}, {"t": "Scientists discover how deep sleep builds muscle, burns fat, and boosts the brain", "b": "Scientists have discovered a surprising two-way relationship between sleep and growth hormone, revealing how the brain carefully balances physical recovery with wakefulness. The findings could help explain why poor sleep harms metabolism and brain health, potentially opening the door to new treatments for sleep and neurological disorders.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261016081140.htm", "ts": 1792214090.0}, {"t": "Avian flu and costs among reasons for loss of captive birds at Castle Espie", "b": "Difficulties in transporting animals since Brexit has contributed to the decline in the number of captive birds.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6m24e1ln130o?at_medium=RSS&at_campaign=rss", "ts": 1792213833.0}, {"t": "How animal identifiability affects children's food choices", "b": "Naming a chicken and describing its favorite habits is enough to make preschoolers choose poultry less often. This effect translates into verbal declarations and actual meal choices, but food preferences still most often win over empathy, according to a new paper by researchers from SWPS University.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-animal-affects-children-food-choices.html", "ts": 1792204801.0}, {"t": "Brazil sees record fall in Amazon deforestation as key election looms", "b": "The Amazon rainforest is a crucial buffer against climate change - but deforestation had expanded under former president Jair Bolsonaro.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqe8rzg6zl00o?at_medium=RSS&at_campaign=rss", "ts": 1792204389.0}, {"t": "Why hasn't the UK had any named storms yet?", "b": "So far this autumn wet and windy weather patterns have been steered away from the UK. When could we see that change?", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/ck5yn68 uence the infrared emission observed by the James Webb Space Telescope. The model has now been published in Astronomy & Astrophysics.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-3d-reveals-shadows-reshape-chemistry.html", "ts": 1792190404.0}, {"t": "Scientists discover cell division does more than make new cells: It helps reshape tissues", "b": "Every time a tissue grows or renews itself, cells must divide inside an already crowded environment. That creates a fundamental problem that scientists have not fully understood: How does a tightly packed sheet of cells make room for two daughter cells when there was once only one?", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-scientists-cell-division-cells-reshape.html", "ts": 1792189201.0}, {"t": "Sexual violence concepts launched online are spilling into the real world", "b": "Andrew Tate, a self-described misogynist and an online influencer with millions of followers, faces charges in several countries of allegedly causing physical harm, including rape and sex trafficking of women and girls.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-sexual-violence-concepts-online-real.html", "ts": 1792188005.0}, {"t": "New high-frequency method boosts 2D material readout for next-gen quantum computers", "b": "Quantum computers represent a next step in the fast-paced evolution of technology. Using quantum bits (qubits), they have the potential to run certain calculations exponentially faster than conventional computers. However, developing and fine-tuning quantum computers requires an enormous number of repetitive tests. To accelerate quantum technology development, we need a method that can read quantum states at ultrafast speeds.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-high-frequency-method-boosts-2d.html", "ts"
