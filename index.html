Platforms IPO to raise $3.2bn, opens 21 Oct", "b": "While the company has not cut the number of shares on offer, with the IPO still comprising of 270 million new shares, the offer is now valued at around ₹30,200 crore, or about $3.2 billion, at the upper end of the ₹1,069-1,119 price per share.", "s": "mint - markets", "l": "https://www.livemint.com/market/ipo/jio-platforms-ipo-dates-details-11791965033362.html", "ts": 1791990596.0}, {"t": "Canada targets India trade pact by year-end", "b": "Canada targets India trade pact by year-end", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/economy/foreign-trade/canada-and-india-aim-for-major-trade-pact-by-year-end-to-boost-economic-ties/articleshow/134945593.cms", "ts": 1791990050.0}, {"t": "Reliance Jio IPO has good news for eligible employees! Reservation of shares worth up to ₹500 crore confirmed", "b": "Jio Platforms’ IPO will reserve up to ₹500 crore for eligible employees. The mega issue will open for subscription on Wednesday, October 21, and close on Friday, October 23, 2026. The anchor investor bidding date has been scheduled for Monday, October 19.", "s": "mint - markets", "l": "https://www.livemint.com/market/reliance-jio-ipo-has-good-news-for-eligible-employees-reservation-of-shares-worth-up-to-rs-500-crore-confirmed-11791987214019.html", "ts": 1791990044.0}], "Science": [{"t": "Same-day heat wave and wildfire smoke exposure is increasing worldwide", "b": "Europe's heat waves this past summer broke countless records, and wildfires spread across Spain and France, forcing mass evacuations.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-day-wildfire-exposure-worldwide.html", "ts": 1792002080.0}, {"t": "Storm Harry: Drifting buoys help improve early forecasts of extreme events in the Mediterranean Sea", "b": "A network of drifting buoys equipped with barometers can help improve weather forecasts of extreme Mediterranean storms by providing crucial atmospheric observations from areas of the sea where measurements are scarce. A new study published in the Quarterly Journal of the Royal Meteorological Society provides the first assessment of the impact of these observations during Storm Harry, which affected the Mediterranean region in January 2026.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-storm-harry-drifting-buoys-early.html", "ts": 1792002027.0}, {"t": "Scientists establish new genus of deep-sea 'spaghetti worms'", "b": "Scientists have announced a new genus of deep-sea segmented marine \"spaghetti worms\" with suction cups on their bodies, showing just how much undiscovered biodiversity is out there in the deep seas around Australia.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-scientists-genus-deep-sea-spaghetti.html", "ts": 1792002023.0}, {"t": "SpaceX rocket launch causes stunning ‘jellyfish cloud’ visible off US east coast", "b": "Expanding plume of fuel exhaust crystalized in the sky and reflected sunlight off frozen particles after Florida launch A SpaceX rocket provided a stunning pre-dawn display over Florida as a massive, luminescent “jellyfish cloud” spread for miles, caused by an expanding plume of fuel exhaust crystalizing in the sky and reflecting sunlight off the frozen particles. The phenomenon occurred shortly after Tuesday’s 6.33am ET launch of the Falcon 9 rocket carrying cargo to the International Space Station. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/us-news/2026/oct/14/jellyfish-cloud-spacex-rocket-launch", "ts": 1792001725.0}, {"t": "Software advance brings complex quantum simulations to standard computers", "b": "A major software advance could aid the creation of bigger, more reliable quantum computers, a study suggests. Researchers have developed an algorithm that enables off-the-shelf computers to run quantum simulations previously only possible using the world's most powerful supercomputers.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-software-advance-complex-quantum-simulations.html", "ts": 1792000869.0}, {"t": "Fighting off microbial invasions drains plants' iron stores, but one protein helps restore balance", "b": "Energy production in our cells, oxygen traveling in our blood and immune cells fighting infection all depend on iron, an essential mineral that enters the food chain when plants absorb it from soil. But iron is often scarce—likely increasingly so as global weather and temperatures continue to change—and we aren't the only ones that need it.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-microbial-invasions-iron-protein.html", "ts": 1792000865.0}, {"t": "Bering Land Bridge base camp reveals what life was like nearly 14,000 years ago", "b": "The area of water between Russia and North America and the Pacific and Arctic oceans is now known as the Bering Strait. Yet it was once what we call the Bering Land Bridge, an exposed land and maritime region that connected Asia to North America.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-bering-bridge-base-reveals-life.html", "ts": 1792000858.0}, {"t": "Main factors in pornography use among adolescents identified", "b": "A study by the Universitat Rovira i Virgili (URV) has analyzed which factors are most associated with pornography use during adolescence. The results show that the most predictive variable is gender, followed by problematic internet use, cannabis and alcohol consumption, family conflict and engaging in certain risky sexual behaviors. The research, published in the journal Computation, was based on the 2023 ESTUDES survey and used a sample of 33,543 adolescents. The aim was to determine which personal, family, digital and behavioral variables are most useful for predicting whether an adolescent reports having viewed or used pornography in the previous 30 days.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-main-factors-pornography-adolescents.html", "ts": 1792000848.0}, {"t": "New DNA tool could help detect harmful algal blooms before they spread", "b": "A new study by researchers at the University of South Florida and Florida Atlantic University has demonstrated that a DNA sequencing tool can rapidly identify harmful algae in coastal waters, offering a new approach for monitoring species that could lead to improved methods for detecting potentially dangerous species before blooms become widespread.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-dna-tool-algal-blooms.html", "ts": 1792000837.0}, {"t": "Removing rats and restoring native plants could help atolls withstand rising seas", "b": "Protecting seabirds and restoring natural vegetation could give low-lying tropical atoll islands a fighting chance against the threat of sea-level rise, a new study reveals.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-rats-native-atolls-seas.html", "ts": 1792000826.0}, {"t": "Bleached Coral Rebounded After Touching Healthy Coral, Study Finds", "b": "After sick corals were placed in direct contact with healthy ones of the same genetic make-up, they recovered at “incredible” speed, scientists found.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/14/climate/coral-bleaching-healing-touch.html", "ts": 1792000808.0}, {"t": "Warmer coastal waters drive heavy cyclone rainfall farther inland, raising flood risks", "b": "A research team at The Hong Kong Polytechnic University (PolyU) has found that the area affected by tropical cyclone (TC) rainfall is extending inland along Northern Hemisphere coasts at an average rate of approximately 3.8 kilometers (2.4 miles) per decade. Driven by rising nearshore sea surface temperature (SST), this shift is increasing disaster risks for inland regions. The work is published in the journal Nature Communications.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-warmer-coastal-heavy-cyclone-rainfall.html", "ts": 1791999606.0}, {"t": "Nine studies reveal consumers favor eco-friendly additions over waste-cutting removals", "b": "When hotels replace single-use toiletries with refillable dispensers, or companies strip unnecessary items from product bundles to cut waste, they may expect consumers to hail these changes as environmentally responsible.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-reveal-consumers-favor-eco-friendly.html", "ts": 1791999601.0}, {"t": "Could AI ‘change the stakes’ in the development of bioweapons?", "b": "Experts say the technology could help terrorists and nation states with production but that significant hurdles remain In his annual speech on threats to the nation, Sir Ken McCallum, the head of the UK’s intelligence service, MI5, warned that AI had the potential to “change the stakes” on existing and even new bioweapons. Here we look at how AI might help in the development of bioweapons and the hurdles that remain. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/technology/2026/oct/14/could-ai-change-the-stakes-in-the-development-of-bioweapons", "ts": 1791999254.0}, {"t": "Bacteria turn 3D-printed sand into solid building elements", "b": "Cement manufacturing is one of the largest sources of CO₂ emissions in the construction industry. At the Department of Architecture, Karen Antorveza Paez, who has just completed her doctorate at ETH Zurich, is researching an alternative that works in a different way: instead of firing rocks at over 1,000°C, she is getting bacteria to bond grains of sand together into solid architectural elements.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-bacteria-3d-sand-solid-elements.html", "ts": 1791998424.0}, {"t": "Gathering rare airborne observations of firestorm clouds", "b": "Just minutes into a planned research flight from Colorado to Oregon in August to study massive storm clouds fueled by intense wildfires, scientists discovered that a fire in Utah offered a more promising target. The mission support staff on the ground scrambled to draw up a new flight plan, and the pilots of the U.S. National Science Foundation National Center for Atmospheric Research (NSF NCAR) Gulfstream V worked to get the green light from air traffic controllers to fly toward the wildfire-generated thunderstorm.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-rare-airborne-firestorm-clouds.html", "ts": 1791998417.0}, {"t": "'Sundown towns' linked to lingering racial bias", "b": "A sundown town is a community that prohibited Black people from staying within its borders after dark or from owning property. This was done through laws, signs, threats, harassment or violence. More than 150 years after the end of slavery and a generation after Civil Rights reforms, a new study finds that places designated as \"sundown towns\" in the past are more racist today.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-sundown-towns-linked-lingering-racial.html", "ts": 1791998401.0}, {"t": "Toothless 'hell chicken' dinosaur may have had a taste for fruit", "b": "While many dinosaurs were fearsome predators with razor-sharp teeth, others were peaceful herbivores munching on plants. We can now add a new species to the list of plant-eaters, Infernogallus jamesi. Its name means hell chicken, and its fossilized remains were found in the Hell Creek Formation, a fossil-rich rock formation extending across parts of Montana, South Dakota and North Dakota. And it is providing fresh insights into how some dinosaur diets evolved.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-toothless-hell-chicken-dinosaur-fruit.html", "ts": 1791997802.0}, {"t": "A New World of Lung Cancer Therapy Awaits Pope Leo", "b": "Lung cancer is still a leading cause of cancer death, but that rate is half what it was in the 1990s, partly because newly developed treatments are working.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/14/science/pope-leo-lung-cancer-therapies-genetic-mutations.html", "ts": 1791997341.0}, {"t": "Local DNA motion inside the cell stays nearly constant throughout interphase", "b": "Human genomic DNA is wrapped around core histone proteins to form nucleosomes, the fundamental units of chromatin. During interphase, the period between cell divisions, DNA is replicated and the nucleus becomes larger. At the same time, cells must continuously carry out essential genome functions such as transcription, DNA replication and DNA repair. How the behavior of genomic DNA is maintained during these large changes has remained unclear.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-local-dna-motion-cell-stays.html", "ts": 1791997211.0}, {"t": "How drought shapes the impact of Xylella fastidiosa on almond trees", "b": "Xylella fastidiosa is a pathogen that poses a serious threat to agri-food systems. An insect-borne bacterium that eventually causes trees to dry out and die, it was first detected in Spain in 2016, alarming the farming community. Although it is more commonly associated with olive trees, it also inflicts heavy losses on almond crops.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-drought-impact-xylella-fastidiosa-almond.html", "ts": 1791997208.0}, {"t": "How Top Trump Officials Stoked Fears of a Nuke That Could Fry the Power Grid", "b": "For more than a decade, conservative activists held that a single atomic bomb could, without killing Americans directly, lay waste to the country — a claim that built fervor for war with Iran.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/14/science/electromagnetic-pulse-nuke-trump-officials.html", "ts": 1791997150.0}, {"t": "Australia's oldest underwater archaeology reveals ancient life within a lost landscape", "b": "New discoveries from Australia's oldest known underwater archaeological record reveal how First Peoples lived, transported goods and used different places within a vast cultural landscape that was submerged when rising seas transformed the continent after the last ice age.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-australia-oldest-underwater-archaeology-reveals.html", "ts": 1791996011.0}, {"t": "A tiny magnetic whirlpool could point to a new kind of ultra-efficient memory", "b": "Every time a computer stores or erases information, it uses energy. The amount is tiny for a single operation, but those operations happen billions of times every second. For decades, scientists have wondered just how little energy a memory device could use before reaching the fundamental theoretical limit set by the laws of physics. Now, researchers have shown that it is possible to come close.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-tiny-magnetic-whirlpool-kind-ultra.html", "ts": 1791996008.0}, {"t": "Industrial fire linked to fish and eels' deaths", "b": "Chemicals from firewater runoff entered a brook and spread downstream where dead fish and eels were later found, the Environment Agency has confirmed.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cqrky20ndv1jo?at_medium=RSS&at_campaign=rss", "ts": 1791995808.0}, {"t": "Mont Blanc's snowy crown grows nearly 2 meters higher in 3 years", "b": "Mont Blanc's snowy crown has been measur
