ll at room temperature. The breakthrough overturns a major practical limitation of exotic quantum experiments and could help bring powerful new light-based computing and sensing technologies closer to reality.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261105224536.htm", "ts": 1794223179.0}, {"t": "Scientists discover a surprising link between acorns and lyme disease", "b": "After more than 35 years of research, scientists have uncovered surprising clues about what really drives Lyme disease risk. Contrary to longstanding assumptions, deer populations appear less important than mice, which can fuel a 40% increase in tick numbers the following year. Even acorn production can predict tick population surges two years in advance, while extreme temperatures may be far less deadly to ticks than scientists once believed.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261106174518.htm", "ts": 1794221975.0}, {"t": "A simple supplement may help clear brain fog after cancer", "b": "A surprising new study from UCLA suggests that a naturally occurring molecule could help breast cancer survivors overcome the frustrating brain fog and exhaustion that can linger long after treatment ends. Researchers found that women taking an oxaloacetate supplement for eight weeks experienced substantial improvements in memory, concentration, mental clarity, and fatigue.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104084013.htm", "ts": 1794220403.0}, {"t": "NASA reveals bold new plan to return astronauts to the Moon in 2028", "b": "NASA has revealed an accelerated plan to land astronauts on the Moon in 2028, with SpaceX and Blue Origin developing competing lunar landers and a crucial orbital test scheduled for 2027. Faster rocket preparations, new lightweight spacesuits, and redesigned missions could help pave the way for a permanent lunar presence and future human exploration of Mars.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261108233054.htm", "ts": 1794215608.0}, {"t": "Is it true that … dock leaves cure nettle stings?", "b": "It’s a time-honoured treatment and rubbing certainly helps, but other leaves could be just as good If you’ve ever brushed against a stinging nettle, chances are someone told you to find a dock leaf. The wide green leaves of dock plants seem to grow conveniently nearby, and rubbing one on a sting is a time-honoured remedy. But does it actually work? Probably not in any way that’s unique to the plant, says John Tregoning, a professor at Imperial College London and the author of Live Forever? A Curious Scientist’s Guide to Wellness, Ageing and Death . Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/lifeandstyle/2026/nov/09/is-it-true-that-dock-leaves-cure-nettle-stings", "ts": 1794211203.0}, {"t": "Scientists predict 2026 hottest year on record as climate talks begin", "b": "Scientists are predictng this could be the hottest year on record as the COP31 climate summit opens.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6pvgg7mdvdvo?at_medium=RSS&at_campaign=rss", "ts": 1794209412.0}, {"t": "Can you solve it? The multi-choice maths quiz taking over the world", "b": "This Kangaroo is jumping! There is nothing in education quite like the Kangaroo. A multiple-choice maths challenge sat by more than seven million children in around 120 countries, from Afghanistan to Zimbabwe, it is arguably the world’s most widely-taken primary and secondary school test. Today’s puzzle is taken from the 2024 Kangaroo. But before we get there, some background. 2 3 4 5 6 Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/09/can-you-solve-it-the-multi-choice-maths-quiz-taking-over-the-world", "ts": 1794208202.0}, {"t": "How an Intern and a Biologist Rescued an Orpha ok at his life and work…", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/hawking-the-celebrity-theoretical-physicist/article71630590.ece", "ts": 1794199308.0}, {"t": "DNA on the Shroud of Turin reveals centuries of hidden secrets", "b": "The Shroud of Turin, one of history's most mysterious religious artifacts, is yielding surprising new clues through DNA analysis. Scientists have uncovered a complex mixture of biological traces that may reveal more about the cloth's past and the environments it encountered. The findings offer a fresh scientific perspective on a centuries-old mystery that continues to spark fascination and debate.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261108202703.htm", "ts": 1794192504.0}, {"t": "Hidden climate superpower: Why some ocean “snow” carries six times more carbon", "b": "Scientists have discovered that the stickiness of underwater “marine snow” plays a surprisingly important role in how much carbon reaches the deep ocean. Gooier particles resist bacterial breakdown and can transport more than six times as much carbon to the depths, revealing an unexpected connection between ocean slime and Earth's climate.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261105224558.htm", "ts": 1794186873.0}, {"t": "A glimmer of good news for Britain's sleepy dormouse", "b": "New figures suggest hazel dormice may be recovering after decades of decline, with warmer summers boosting survival.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c85ynn0p5k71o?at_medium=RSS&at_campaign=rss", "ts": 1794185803.0}, {"t": "Scientists discover stunning new Amazon fish that may already be endangered", "b": "Researchers have discovered a stunning new species of tiny orange-patterned fish in the Brazilian Amazon, but its survival may already be at risk. Named Laimosemion laranja, the bri
