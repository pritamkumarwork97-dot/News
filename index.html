ket-news/microsoft-shares-defy-massive-global-outage-close-higher-on-friday-outlook-teams-services-recover-things-to-know-11794647299206.html", "ts": 1794654587.0}, {"t": "Tata Sons Listing: Noel Tata decodes why there should be no tinkering; what he said at Hindustan Times Leadership Summit", "b": "Noel Tata warned that listing Tata Sons could shift the group’s priorities toward shareholder returns and away from philanthropy. He said Tata Trusts would work with regulators and stakeholders to preserve conglomerate’s existing philosophy amid an ongoing dispute over its listing requirements.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/tata-sons-listing-noel-tata-decodes-why-there-should-be-no-tinkering-what-he-said-at-hindustan-times-leadership-summit-11794643211510.html", "ts": 1794654521.0}, {"t": "Who is Rene Haas? Arm CEO emerges as potential Nvidia chief after Jensen Huang’s exit; what makes him a frontrunner?", "b": "Nvidia has reportedly approached Arm CEO Rene Haas as a potential successor to Jensen Huang. A former Nvidia executive, Haas brings deep knowledge of the chipmaker and experience leading Arm. However, Nvidia says its CEO search is at an early stage, with no candidates formally approached.", "s": "mint - companies", "l": "https://www.livemint.com/companies/people/who-is-rene-haas-arm-ceo-emerges-as-potential-nvidia-chief-after-jensen-huang-s-exit-what-makes-him-a-frontrunner-11794652190506.html", "ts": 1794654124.0}, {"t": "Nvidia CEO race: Could Jensen Huang's children succeed him? Full list of potential contenders", "b": "Several names have emerged as possible contenders, including Nvidia's Chief Financial Officer Colette Kress, data centre head Ian Buck and leaders from rival semiconductor companies such as Arm and AMD.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/nvidia-ceo-race-could-jensen-huangs-children-succeed-him-full-list-of-potential-contenders-11794652643571.html", "ts": 1794654023.0}, {"t": "Dividend stock to buy: TD Power shares rally 369% in 3 years, more upside ahead? Check target price before record date", "b": "TD Power Systems will be in focus ahead of its November 18 dividend record date. The board approved a dividend of ₹0.65 per share. Strong Q2 results, a robust order book and upgraded guidance have supported the stock, which SBI Securities rates Buy with a ₹732 target.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/dividend-stock-to-buy-td-power-shares-rally-369-in-3-years-more-upside-ahead-check-target-price-before-record-date-11794648803654.html", "ts": 1794652037.0}, {"t": "Noel Tata flags Tata Group execution challenges at HTLS 2026, outlines plans to sharpen Tata Trusts’ philanthropy", "b": "At HTLS 2026, Noel Tata flagged execution gaps in Tata Group’s big projects, stressing capital allocation and delivery discipline. He also outlined Tata Trusts’ focus on measurable philanthropic impact and plans for 40-50 hospitals.", "s": "mint - companies", "l": "https://www.livemint.com/companies/people/noel-tata-flags-tata-group-execution-challenges-at-htls-2026-outlines-plans-to-sharpen-tata-trusts-philanthropy-11794649800752.html", "ts": 1794650928.0}, {"t": "Dalal Street Week Ahead: Can Nifty bulls overcome key resistance levels?", "b": "The Nifty's current technical structure remains positive. Although a sharp rebound from the vicinity of the 200-week moving average has significantly improved the near-term technical setup, the Index is near its overhead resistance area.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/news/dalal-street-week-ahead-can-nifty-bulls-overcome-key-resistance-levels/articleshow/135829497.cms", "ts": 1794650884.0}, {"t": "He Was China’s Man in Panama. Then He Became a Wanted Man.", "b": "A Chinese businessman arrived in Panama with money and power. Then he sold a port when his luck turned. Now China wants him sent back.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/11/14/business/zhang-liang-china-panama.html", "ts": 1794650432.0}, {"t": "Microsoft says services fully restored after hourslong global outage", "b": "The ‌technology giant said it was “monitoring the backlog of email messages ‌accrued during this ​event” before considering the issue with ⁠the enterprise services resolved.", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/sci-tech/technology/microsoft-says-consumer-products-services-recovered-still-monitoring-enterprise-services/article71701075.ece", "ts": 1794650314.0}, {"t": "USFDA concludes inspection at Zydus’ LiqMeds in U.K. with four observations", "b": "The inspection was conducted from November 9-13, the company said in a regulatory filing to stock exchanges", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/Industry/usfda-concludes-inspection-at-zydus-liqmeds-in-uk-with-4-observations/article71701350.ece", "ts": 1794649410.0}, {"t": "Kiran Mazumdar-Shaw believes the Microsoft outage creates opportunity for homegrown suite Zoho — here's how", "b": "Biocon founder Kiran Mazumdar-Shaw believes the recent Microsoft outage creates opportunity for Sridhar Vembu-led Zoho to offer homegrown alternatives to the office suite provider. Here's how…&nbsp;", "s": "mint - companies", "l": "https://www.livemint.com/companies/kiran-mazumdar-shaw-believe-microsoft-outage-how-create-opportunity-sridhar-vembu-zoho-offer-homegrown-alternative-suite-11794645738571.html", "ts": 1794648855.0}], "Science": [{"t": "A cosmic magnifying glass could reveal the same supernova two more times in roughly 70 years", "b": "Thanks to the gravitational lensing caused by a massive galaxy cluster and high-resolution images from the James Webb Space Telescope (JWST), astronomers discovered an exploding star when the universe was 4.9 billion years old. The discovery paper, posted to the arXiv preprint server on Oct. 23, presents a prediction for when the rest of the distorted images of SN Ares will arrive.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-cosmic-magnifying-glass-reveal-supernova.html", "ts": 1794680401.0}, {"t": "Some of the oldest rocks ever discovered shed light on Earth's early history", "b": "Earth is approximately 4.5 billion years old, according to estimates. However, rocks dating back to the planet's earliest days are extremely rare. Hence the excitement over the discovery in northern China of some of the oldest known rocks on Earth, dating back 3.95 billion years. And one of the reasons for all the attention is that they're revealing new clues about how Earth's crust formed and evolved.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-oldest-earth-early-history.html", "ts": 1794675633.0}, {"t": "Brain Implants Give A.L.S. Patients the Voice to Speak and Sing", "b": "In one demonstration, a former singer sang a musical scale. Afterward she cried tears of joy.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/14/science/brain-implants-als-voice.html", "ts": 1794675609.0}, {"t": "World's largest freshwater lake is recovering after decades of decline", "b": "Lake Baikal in Siberia holds around 20% of the world's surface freshwater, making it the most voluminous freshwater lake (Lake Superior on the United States–Canada border is the largest by surface area). This makes the lake one of the most important environments for biodiversity—in fact, it was designated a UNESCO World Heritage site in 1996 because of this. Yet it has shown considerable decline over the last century, with aridification spreading across East Asia.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-world-largest-freshwater-lake-recovering.html", "ts": 1794670801.0}, {"t": "Archaeologists shed new light on wealth and status among Europe's early herders", "b": "How unequal were prehistoric societies? And how can archaeologists measure wealth in cultures that left behind no written records, no tax registers and no census data?", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-archaeologists-wealth-status-europe-early.html", "ts": 1794664801.0}, {"t": "A common food emulsifier could solve one of rocketry's oldest fuel problems", "b": "In propulsion system design, engineers have long faced a trade-off between solid and liquid rocket fuels. Each has advantages and disadvantages, and in an effort to try to min/max the efficacy of different types of fuel, researchers have long placed an emphasis on a hybrid between solids and liquids—in other words, they've been working with gels. Unfortunately, gels have their own sets of problems to deal with.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-common-food-emulsifier-rocketry-oldest.html", "ts": 1794661206.0}, {"t": "Scientists find a simple daily routine linked to less pain and depression", "b": "A simple change to your daily routine could make a surprising difference in how you feel, both physically and mentally. University of Missouri researchers found that older adults who followed consistent daily schedules reported less physical pain and fewer symptoms of depression, even when they struggled with insomnia. Keeping regular times for sleeping, eating, and other activities may help regulate the body's internal clock, which influences mood, sleep, and overall health.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261113231624.htm", "ts": 1794660481.0}, {"t": "Stanford scientists discover hidden brain signals that predict Alzheimer’s years before symptoms", "b": "Stanford researchers have discovered that hidden patterns of brain activity can predict Alzheimer’s risk years before memory problems appear, potentially offering an earlier warning than traditional biomarkers. The same patterns also reveal which brains are unusually resistant to aging, raising hopes for future treatments that could help protect memory.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261112230444.htm", "ts": 1794659105.0}, {"t": "Alaska laments decline of its prized salmon populations", "b": "In his Alaskan community, fisherman Bob Candopoulos has long welcomed tourists to his business that's showcased by a sign featuring a king salmon.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-alaska-laments-decline-prized-salmon.html", "ts": 1794657612.0}, {"t": "A giant icy world hiding beyond Pluto could be our sixth dwarf planet", "b": "Astronomers have uncovered a potentially enormous new dwarf planet beyond Pluto, hidden for years in one of the most crowded regions of the night sky. The discovery of 2026 ED138 could expand the solar system's official dwarf planet family and hints that more mysterious worlds may be lurking far beyond Neptune.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261112230447.htm", "ts": 1794657522.0}, {"t": "California steels for storms that could trigger massive waves, flooding", "b": "California was bracing Friday for a storm series packing heavy rain and surf that could once again flood coastal communities and potentially send monster waves pounding shores.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-california-steels-storms-trigger-massive.html", "ts": 1794656406.0}, {"t": "SpaceX's Starship set for return to Earth after booster catch aborted", "b": "SpaceX said its Starship spacecraft was \"healthy\" as it orbited the Earth and on track to return Saturday to its Texas launch site, where Elon Musk's company was planning to \"catch\" the vehicle for the first time.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-spacex-starship-earth-booster-aborted.html", "ts": 1794655134.0}, {"t": "How to spot November's planetary parade in the pre-dawn sky", "b": "The planets of Mercury, Venus, Mars and Jupiter will align in pre-dawn sky throughout November.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cke8rr37lrryo?at_medium=RSS&at_campaign=rss", "ts": 1794654471.0}, {"t": "Hundreds of children in England prescribed weight-loss jabs, figures show", "b": "Exclusive: investigation finds prescriptions for children under 12, as experts stress need for specialist supervision and long-term monitoring Hundreds of children in England are receiving prescriptions for GLP-1 medications, including some younger than 12, the Guardian can reveal. GLP-1 medications were initially developed to help people with type 2 diabetes control their blood sugar levels, but have since become a popular slimming aid, with products such as Wegovy and Mounjaro becoming household names. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/14/children-iengland-prescribed-weight-loss-jabs", "ts": 1794643239.0}, {"t": "Extreme weather leaves gardeners hedging their bets", "b": "Gardeners across Sussex are changing their planting strategies after this year's unprecedented heat.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6qj5r2qzqpwo?at_medium=RSS&at_campaign=rss", "ts": 1794640334.0}, {"t": "Bluetongue virus confirmed on County Down farm", "b": "Officials from the Department of Agriculture, Environment and Rural Affairs said the virus had been detected in three sheep.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmr4gxvrxd9yo?at_medium=RSS&at_campaign=rss", "ts": 1794639418.0}, {"t": "SpaceX's Starship soars into orbit after booster explosion prevents an unprecedented double catch", "b": "SpaceX's attempt to recover its entire Starship back at the launch pad was thwarted when the booster fell into the Gulf of Mexico and exploded Friday, but the spacecraft still soared into orbit in its boldest test yet.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-spacex-starship-soars-orbit-booster.html", "ts": 1794638050.0}, {"t": "SpaceX launches 15th Starship flight with hopes of achieving first round trip", "b": "Starship expected to descend from space after completing 14 orbits around Earth, setting up its debut catch landing for ​Saturday afternoon; the Super Heavy booster was diverted from its return flight path to a fixed point over the Gulf of Mexico before exploding a short distance ‌over the sea surface", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/spacex-launches-15th-starship-flight-with-hopes-of-achieving-first-round-trip/article71700818.ece", "ts": 1794629851.0}, {"t": "SpaceX’s Latest Starship Launch Skips Attempt to Catch the Booster", "b": "SpaceX could still try to catch the rocket’s upper stage tomorrow. Progress toward a fully reusable rocket remains mixed.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/13/science/spacex-launch-starship-rocket-catch.html", "ts": 1794625620.0}, {"t": "5,000-year-old skulls reveal a disturbing secret of ancient Egypt's first kings", "b": "A 5,000-year-old mystery surrounding the tombs of Egypt’s first kings has taken a disturbing turn. Scientists reexamining 46 ancient skulls discovered evidence of potentially fatal head injuries in 18, suggesting that at least 39% of those studied may have been deliberately killed. The findings support a century-old theory that royal attendants were sacrificed when kings died, possibly to serve them in the afterlife.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261112025540.htm", "ts": 1794625145.0}, {"t": "The role of social relationships in scaling agricultural innovations: A dimension that remains underreported in research", "b": "A study published in Frontiers in Sustainable Food Systems reveals that, although partnerships and institutional collaboration feature prominently in climate-oriented agricultural research, their relationship with the scaling of innovations is rarely explicitly documented. The findings highlight the need to better understand the role of social relationships to strengthen the design, monitoring and evaluation of scaling processes.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-role-social-relationships-scaling-agricultural.html", "ts": 1794624001.0}, {"t": "Heavier-than-expected electron behavior may explain slower electrical flow in alpha-gallium oxide", "b": "Power electronic devices help control the flow of electricity and convert it into forms needed by different machines, such as electric vehicles, renewable energy systems and industrial equipment. Some electrical energy is lost as heat during this process, reducing efficiency and potentially affecting the device's performance. Semiconductor materials that can withstand high voltages, carry electricity efficiently and release heat effectively would make these devices more efficient and reliable.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-heavier-electron-behavior-slower-electrical.html", "ts": 1794619201.0}, {"t": "Scientists capture electrons making seemingly impossible quantum jumps", "b": "Scientists have captured electrons making seemingly impossible jumps across forbidden energy gaps in graphene, with some transitions occurring at a remarkable 100% probability. The breakthrough offers an unprecedented look at quantum behavior and could help unlock a new generation of ultrafast, light-controlled electronics.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261112025523.htm", "ts": 1794618785.0}, {"t": "SpaceX Starship megarocket blasts off before expected return for reuse", "b": "Flight 15 expected to orbit Earth about 14 times over 22 hours, before company catches it at Starbase, Texas SpaceX’s Starship megarocket blasted off from Texas on Friday afternoon as the aerospace company sought to make history with a double catch of its reusable rocket, but ultimately fell short. Starship, the world’s largest rocket, standing at 407ft, is expected to orbit Earth about 14 times over the course of 22 hours, before the company catches the rocket at its launchpad at Starbase in south Texas. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/13/spacex-starship-megarocket-blasts-off-earth-orbit", "ts": 1794617632.0}, {"t": "Jojo the gorilla has spent his life alone. Can he finally find a companion?", "b": "Jojo was poached as an infant and grew up in captivity. His keepers want to find him a friend - but it's not straightforward.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cwm2mn272nqlo?at_medium=RSS&at_campaign=rss", "ts": 1794614636.0}, {"t": "Fiji petrel eludes 10-day search as communities aim to protect bird's habitat", "b": "A new study details scientists' search for one of the planet's rarest birds in the waters off Fiji's Gau Island. Spanning 10 days, the expedition yielded no verified sightings of the critically endangered Fiji petrel, one of the world's most elusive birds. Fewer than 50 individuals are believed to remain on Earth.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fiji-petrel-eludes-day-communities.html", "ts": 1794613201.0}, {"t": "Unstable plasma heats itself with waves it generates, experiments reveal", "b": "Fusion power is expected to be a sustainable energy source that emits no carbon dioxide during electricity generation. To achieve this, research is underway worldwide to confine high-temperature plasma using magnetic fields. To initiate a fusion reaction, high-energy particles or waves must be injected from outside to heat the plasma to extremely high temperatures.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-unstable-plasma-generates-reveal.html", "ts": 1794612002.0}, {"t": "Same farms, different answers: When nitrogen pollution estimates don't add up", "b": "To reduce nitrogen pollution stemming from synthetic fertilizer and livestock waste, California's Central Valley relies on five data sets to estimate surplus nitrogen. However, most parts of the United States use just one or two data sets—the U.S. Department of Agriculture's agricultural survey and census—to estimate nitrogen surplus.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-farms-nitrogen-pollution-dont.html", "ts": 1794610807.0}, {"t": "Hidden 'master switch' allows bacteria to breach the body's defenses", "b": "Researchers at Penn Dental Medicine have uncovered a previously unknown molecular mechanism by which bacteria rapidly compromise the body's protective barriers, a finding that could reshape how scientists approach a wide range of serious diseases.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-hidden-master-bacteria-breach-body.html", "ts": 1794609601.0}, {"t": "'Planimal' cells retain nearly entire algal genome after experimental cell fusion", "b": "Most DNA in an organism is inherited from its parent or parents. This form of genetic inheritance is referred to as vertical inheritance because genes are passed down from generation to generation.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-planimal-cells-retain-entire-algal.html", "ts": 1794608401.0}, {"t": "Modified $450 3D printer builds living materials with more than 100 layers", "b": "Living materials created with a 3D printer are like living tissues with one notable exception: You get to choose exactly which cells are in them, as well as their final 3D shape. Depending on the type of bacteria included in the print, the material can clean up contaminated water or break down waste materials such as plastic.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-3d-printer-materials-layers.html", "ts": 1794607201.0}, {"t": "Genomic analysis restores species status to 12 overlooked Great Barrier Reef corals", "b": "An international team of scientists working with Queensland Museum's CoralBank project has uncovered previously hidden coral diversity on Australia's east coast, revealing that 12 corals once considered variations of other species are distinct species in their own right.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-genomic-analysis-species-status-overlooked.html", "ts": 1794606001.0}, {"t": "Common ADHD classroom accommodations may not help students succeed, study finds", "b": "Extra time on assignments. Frequent breaks. A quiet place to work. For students with attention-deficit/hyperactivity disorder (ADHD), these are some of the most common accommodations schools provide to make learning easier. But are they actually helping children succeed? A new study from Florida International University (FIU) suggests that some widely used approaches may be falling short.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-common-adhd-classroom-accommodations-students.html", "ts": 1794604802.0}, {"t": "Happy face, angry voice: Human–dog interaction study tracks conflicting cues", "b": "Dogs, having lived alongside humans for tens of thousands of years, are keenly tuned in to our emotions. Behavioral experiments, brain studies and even measurements of heart rate all suggest dogs respond differently depending on the emotional expressions they encounter in humans.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-happy-angry-voice-humandog-interaction.html", "ts": 1794603606.0}, {"t": "A perfect couple: Chromium keeps ruthenium grounded in water electrolysis", "b": "They say opposites attract, and many couples do fit this pattern. One is pragmatic and down-to-earth, while the other is a dreamer with their head in the clouds. Yet, these differences make them perfect for each other. According to researchers at ICFO, chemical interactions between atoms are not that different. Ruthenium, for instance, belongs to the \"dreamer\" class. It is commonly used in single-atom catalysts that speed up water electrolysis, which splits water to obtain green hydrogen. However, on its own, ruthenium tends to over-oxidize and dissolve during operation, like an idealist who takes flight without looking back.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-couple-chromium-ruthenium-grounded-electrolysis.html", "ts": 1794602401.0}, {"t": "A newly discovered South African dinosaur was a heavyweight even as a youngster", "b": "It probably walked on two legs and weighed about 400 kilograms (880 pounds), despite still being a youngster. Meet Nyana rooiwalensis, a newly identified dinosaur species that lived more than 200 million years ago in what is now South Africa.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-newly-south-african-dinosaur-heavyweight.html", "ts": 1794601204.0}, {"t": "Molecular sensor makes invisible traces of mercury easier to see", "b": "Mercury contamination presents an obvious challenge: it is invisible. A glass of water or a piece of fruit can seem perfectly normal to the naked eye, even when trace amounts of toxic mercury are present. Detecting such minute levels usually requires specialized laboratory tools and trained experts.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-molecular-sensor-invisible-mercury-easier.html", "ts": 1794600009.0}, {"t": "Fruit fly sleep protein yields peptides that inhibit drug-resistant bacteria in lab tests", "b": "Researchers at University of Tsukuba and collaborating institutions have identified short antimicrobial peptides derived from Nemuri, a sleep-inducing protein in the fruit fly Drosophila melanogaster. The research is published in the journal Nature Communications.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fruit-fly-protein-yields-peptides.html", "ts": 1794598804.0}, {"t": "New genetic atlas reveals traces of 10,000 years of sheep breeding", "b": "For around 10,000 years, humans have selectively bred sheep for desirable traits. Generation after generation, we have chosen animals for their wool, size and reproductive characteristics and gradually left our mark on their DNA.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-genetic-atlas-reveals-years-sheep.html", "ts": 1794597606.0}, {"t": "What could El Niño mean for winter weather in the US and Canada?", "b": "El Niño winters typically bring more rain in the southern USA and drier, warmer conditions further north but the impacts on snowfall are complex.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/c6pvg22k2w2do?at_medium=RSS&at_campaign=rss", "ts": 1794595815.0}]},DATE="14 November 2026",cats=Object.keys(D);let cat=cats[0],i=0,sx=0;
