icles/c820qnznkrn4o?at_medium=RSS&at_campaign=rss", "ts": 1795608731.0}, {"t": "GTA VI made $3.79 billion in a day, but who really wins? Why Take-Two isn’t the only one cashing in on the record debut", "b": "GTA VI generated $3.79 billion in first-day sales, but Take-Two isn't the only winner. Gaming platforms, retailers and GTA Online could also benefit.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/gta-vi-made-3-79-billion-in-a-day-but-who-really-wins-why-take-two-isn-t-the-only-one-cashing-in-on-the-record-debut-11795604645129.html", "ts": 1795608351.0}, {"t": "Fed policymakers at odds over causes of high inflation", "b": "US inflation is expected to increase again in October, with potential implications for Federal Reserve interest rate decisions. Economists predict the Personal Consumption Expenditures Price Index to reach 3.8% this month. Analysts are divided regarding whether inflation is caused by demand or supply shocks stemming from recent policies. Market forecasts suggest three more rate hikes, signaling ongoing concerns about rising prices.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/us-stocks/news/fed-policymakers-at-odds-over-causes-of-high-inflation/articleshow/136160394.cms", "ts": 1795607511.0}], "Science": [{"t": "Great Nicobar Island project: Final Calcutta High Court hearing deferred as Centre seeks to file affidavit, objections", "b": "Centre argues that the FRA is not implemented in the A&NI, objects to some petitions claiming that they should be heard by the NGT or SC; next hearing posted for January 13, 2027; court to hear Attorney General of India on January 22", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/great-nicobar-island-project-final-calcutta-high-court-hearing-deferred-as-centre-seeks-to-file-affidavit-objections/article71743226.ece", "ts": 1795630498.0}, {"t": "Images of asteroid targeted to test Earth's defences reveal stadium-sized crater", "b": "The asteroid's surface was transformed after a spacecraft was deliberately crashed into it four years ago", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cw8dv112r5gmo?at_medium=RSS&at_campaign=rss", "ts": 1795627816.0}, {"t": "Europe’s Hera Mission Releases Close-Up Images of the Asteroid Hit by a NASA Spacecraft", "b": "A European mission called Hera has just revealed the first close-up look at the aftermath of NASA’s audacious planetary defense test.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/25/science/hera-nasa-photos-dart-asteroid.html", "ts": 1795627806.0}, {"t": "Bizarre Material May Herald the Future of Computer Chips", "b": "Unlike copper, newly described “nanoribbons” conduct electricity better as they shrink. If refined, the material could usher in a supercharged generation of microchips.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/25/science/chips-wires-copper-niobium.html", "ts": 1795622405.0}, {"t": "Canadian astronaut welcomes baby girl from space station", "b": "Joshua Kutryk, currently on his first space mission, is just the fourth astronaut in history to miss the birth of a child while aboard the International Space Station.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/ckx283y8wwwgo?at_medium=RSS&at_campaign=rss", "ts": 1795621299.0}, {"t": "New York's annual Thanksgiving Parade threatened by approaching storm", "b": "Strong winds and heavy rain are expected to impact celebrations across the USA, with the risk that the famous Macy's Thanksgiving Day parade could be impacted.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cr894e8dd7wqo?at_medium=RSS&at_campaign=rss", "ts": 1795617702.0}, {"t": "China sends first foreign astronaut to ISS rival as it globalises space operations", "b": "Muhammad Zeeshan Ali – the first Pakistani to reach orbit – greeted with Chinese ‘space handshake’ at Tiangong station China has flown the first foreign astronaut to its Tiangong space station, starting what it says will be the globalisation of its space operations as the US-led International Space Station (ISS) enters its final years of operation. Floating through a hatch to enter Tiangong, Pakistan’s Muhammad Zeeshan Ali grinned broadly as he was embraced by the onboard crew in what China’s space agency called the country’s first foreign “space handshake”. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/25/china-sends-first-pakistani-astronaut-into-space", "ts": 1795616309.0}, {"t": "A rare bird on stony rivers shows why Himalayan water needs its sediment", "b": "The Himalayan rivers are home to several species that depend on rivers and their ecosystems, including fish, aquatic invertebrates like stonefly larvae and mayfly nymphs, and flora such as Himalayan alder and sea buckthorn along the banks and on the floodplains. When a river changes, all these environs, and their species, change as well", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/energy-and-environment/ibisbill-rare-bird-stony-rivers-himalayan-water-sediment-illegal-mining/article71742273.ece", "ts": 1795612776.0}, {"t": "Hostile architecture: the design choices keeping wildlife out of urban India", "b": "For animals and birds in India’s urban areas, hostile architecture takes many forms. ‘From spikes on ledges and nets over balconies to broken glass or spikes on compound walls that prevent animals from entering or perching,’ Shilpa Shirish, who specialises in culturally sensitive design at the Indian Institute of Human Settlements, Bengaluru, said", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/hostile-architecture-the-design-choices-keeping-wildlife-out-of-urban-india/article71742099.ece", "ts": 1795605587.0}, {"t": "Beaver supermoon lights up skylines around the world – video", "b": "A stunning supermoon rose over skylines around the world. Supermoons occur when the full moon coincides with the moon being at or near its closest point to Earth, making it appear larger than usual. The November full moon is also known as the beaver moon, a name thought to date to when hunters traditionally set traps for beavers in autumn to secure a supply of warm fur for the winter Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/video/2026/nov/25/beaver-supermoon-lights-up-skylines-around-the-world-video", "ts": 1795604358.0}, {"t": "What is Beaver Supermoon, when is the next supermoon and more", "b": "The November full moon, known as the Beaver Moon, appears larger and brighter than usual due to its proximity to Earth", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/what-is-beaver-supermoon-november-2026-next-full-moon/article71741634.ece", "ts": 1795602967.0}, {"t": "A space telescope hunting for dark matter just discovered something unexpected", "b": "ESA’s Euclid space telescope has discovered its first previously unknown comet, despite being designed to study distant galaxies and the mysteries of the dark Universe. The icy object is approximately 1.3 billion kilometers from Earth and follows an unusual orbit that takes thousands of years to complete.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261124055852.htm", "ts": 1795602904.0}, {"t": "Why has China sent the first Pakistani astronaut to space?", "b": "Pakistan's Muhammad Zeeshan Ali has become the first foreign national to board China's Tiangong space station.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cj5y1p067kxno?at_medium=RSS&at_campaign=rss", "ts": 1795602410.0}, {"t": "Physicists trap antimatter in a breakthrough that could explain why the universe exists", "b": "Positrons are the antimatter counterpart of an electron. Physicists trapped a positron and cooled it to temperatures near absolute zero. Positron is suspended in a wall-free trap, safely separated from ordinary matter. Team will conduct most precise comparison yet between matter and antimatter. Any difference between the electron and positron could expose cracks in the Standard Model of particle physics.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261124055849.htm", "ts": 1795601182.0}, {"t": "AI's shock-and-awe raid on maths looks like pride before a fall | Rafael Behr", "b": "Machines are bulldozing through hard problems to assert the power of their tech bro creators, not to advance human knowledge In most walks of life, trying something 12,363,153,437,138 times and getting the same result is reason enough to assume it works every time. Not in maths, where a conjecture that holds up more than 12tn times looks very probably true but doesn’t qualify as proven. That was the status of the Riemann hypothesis, one of the most famous mathematical conundrums in existence, until last week . Then Levent Alpöge, a mathematician working at Anthropic, said he and his collaborator, Claude AI, had crossed the line from conjecture to proof. Rafael Behr is a Guardian columnist Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/nov/25/ai-mathematics-human-knowledge-progress-technology-industry", "ts": 1795601115.0}, {"t": "COP31 and the unmet promises of climate action", "b": "COP31 has once again laid out the gap between what countries promise and what they are actually prepared to do. With the window to keep warming below 1.5 degrees rapidly closing, the coming year should be spent on fixing what is broken", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/cop31-fossil-fuels-unmet-promises-climate-finance-action/article71741894.ece", "ts": 1795600852.0}, {"t": "What is a thought made of? Why human consciousness may be beyond AI’s reach", "b": "A new theory suggests that the brain may chemically encode and retrieve memories rather than relying solely on electrical signals. Researchers propose that interactions between brain cells and their molecular surroundings could help explain the intimate connection between memory, emotion, and thought. Their findings challenge the assumption that increasingly powerful computers could eventually develop human-like consciousness.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261124055712.htm", "ts": 1795599054.0}, {"t": "The cow, the flea and the genome: One Health and the statecraft of prevention", "b": "A cattle virus at home and a plague scare abroad make the same argument this World One Health Day: life is epidemiologically indivisible, and the institutions that govern and study it must learn to be so too", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/health/the-cow-the-flea-and-the-genome-one-health-and-the-statecraft-of-prevention/article71630249.ece", "ts": 1795592622.0}, {"t": "Huge fly-tip grew undetected over several months", "b": "The council says the 20-tonne pile of rubbish was dumped over garden fences.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqzjr4m9ljzxo?at_medium=RSS&at_campaign=rss", "ts": 1795587266.0}, {"t": "China launches crewed spaceship carrying first Pakistani astronaut to its space station", "b": "Using a Long March-2F rocket, the spacecraft took ‌off at 8:18 a.m. (0018 GMT) ‌from ⁠the Jiuquan Satellite Launch Centre ⁠in northwest China", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/chinas-shenzhou-24-space-flight-takes-off-with-pakistani-national-as-first-foreign-astronaut/article71740891.ece", "ts": 1795587062.0}, {"t": "Dolphins with active social lives and big friendship groups live longer, Australian researchers discover", "b": "Decades of data collected at WA’s Shark Bay shows level of socialising may affect longevity for Indo-Pacific bottlenose dolphins Dolphins who spend time socialising in large and consistently sized social groups tend to live longer, new research has found. Indo-Pacific bottlenose dolphins are marine mammals that can live for more than 50 years and have complex social lives. They spend time socialising in groups – which increase in size during their youth and early adulthood, before declining towards the end of their life, according to a study in PLOS Biology. Sign up to get climate and environment editor Adam Morton’s Clear Air column as a free newsletter Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/environment/2026/nov/25/dolphins-with-active-social-lives-and-big-friendship-groups-live-longer", "ts": 1795586525.0}, {"t": "How a new way of measuring tides could make flood forecasts more accurate", "b": "Analysis of differences in tidal height across beaches could lead to more localised tide and flood forecasts The sea might look level, but it turns out tidal height can vary by as much as a metre across the length of a single beach, new research shows. This development is important when it comes to flood predictions and when forecasting which locations are most vulnerable to storm surges. Up until now, our knowledge of tidal levels has been limited. Tide gauges tell us about a specific location, and satellite radar measurements typically average across tens of kilometres. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/25/new-way-of-measuring-tides-flood-forecasts-accurate", "ts": 1795586408.0}, {"t": "AI cracks math’s most famous problem. Have mathematicians lost a guiding light?", "b": "Levent Alpöge of Anthropic has announced that he and the company’s AI model Claude have found a proof of the Riemann hypothesis, which concerns the distribution of prime numbers. Mathematicians have spent more than 160 years trying to prove it", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/anthropic-scientist-claims-proof-of-maths-most-famous-problem-with-ai-help/article71727161.ece", "ts": 1795582530.0}, {"t": "China's Shenzhou-24 carries Pakistan's first astronaut into space", "b": "Muhammad Zeeshan Ali, a former fighter pilot, is the first foreigner to join a Chinese crewed space mission.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6x2e0j3kx28o?at_medium=RSS&at_campaign=rss", "ts": 1795581983.0}, {"t": "Physicists just sent an unblockable message through a brick wall using gravity", "b": "Scientists have successfully transmitted a message through a brick wall using nothing but gravity, an old elevator, and an incredibly sensitive detector. By moving a massive counterweight between two positions, researchers encoded the word \"Gravity\" into tiny changes in gravitational pull. Unlike Wi-Fi or radio signals, gravity passes through ordinary barriers without being blocked, offering a potentially revolutionary way to communicate.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261123005343.htm", "ts": 1795573778.0}, {"t": "Einstein’s 120-year-old theory may be missing something big about the Big Bang", "b": "A surprising discovery by MIT and UC Santa Barbara physicists reveals that Einstein’s famous theory of particle motion misses something important when particles travel near the speed of light. Their new calculations show that heavy quarks moving through an ultra-hot plasma experience rare but unusually powerful jolts that Einstein’s traditional model cannot fully explain.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/
