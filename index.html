-sale-of-china-business-as-ai-push-reshapes-growth-strategy-report-11792323492872.html", "ts": 1792324097.0}, {"t": "Rahul Gandhi vows to fight ‘vote chori’ in Goa", "b": "Rahul Gandhi vows to fight ‘vote chori’ in Goa", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/politics-and-nation/by-stealing-votes-they-have-attacked-the-constitution-rahul-gandhi-vows-to-fight-vote-chori-in-goa/articleshow/135028166.cms", "ts": 1792323789.0}, {"t": "JSW Steel gets relief in ₹2,169 crore mining dispute: What was the case and what Orissa HC ruled", "b": "In an exchange filing on Sunday, the company said the court concluded hearings and delivered its judgments on October 16, 2026.", "s": "mint - companies", "l": "https://www.livemint.com/companies/what-was-the-jsw-steel-mining-case-orissa-hc-quashes-696-crore-demand-orders-fresh-review-of-1-473-crore-11792321515297.html", "ts": 1792323332.0}, {"t": "School Holiday on October 19: Check closures", "b": "School Holiday on October 19: Check closures", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/new-updates/school-holiday-on-october-19-check-state-wise-closures-for-durga-puja-maha-navami-vijayadashami-ayudha-pooja-dasara-2026-other-festivals/articleshow/135027856.cms", "ts": 1792322913.0}, {"t": "Sumitomo-backed Yes Bank faces up to ₹5,200 crore earnings hit as SC upholds squashing of its AT-1 bonds write-off", "b": "The Supreme Court overturned Yes Bank’s 2020 write-off of ₹8,415 crore in AT-1 bonds. The bank says that it would have reported a net loss of ₹5,217 crore in the September quarter had it recognised the impact. Details here.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/sumitomobacked-yes-bank-faces-up-to-5-200-crore-earnings-hit-as-sc-upholds-squashing-of-its-at-1-bonds-writeoff-11792316431134.html", "ts": 1792322728.0}, {"t": "IPO GMP race: Zetwerk vs Sahajanand vs Bonfiglioli Transmissions vs Tonbo Imaging - check share listing price prediction", "b": "IPO demand varied on Friday: Tonbo Imaging drew the strongest interest, with 7.77 times subscription, while Zetwerk attracted the least interest at 31%. Bonfiglioli and Sahajanand were subscribed 99% and 82%, respectively. All four offerings were scheduled to close on Monday, 19 October.", "s": "mint - markets", "l": "https://www.livemint.com/market/ipo/ipo-gmp-race-zetwerk-vs-sahajanand-vs-bonfiglioli-transmissions-vs-tonbo-imaging-check-share-listing-price-prediction-11792318401392.html", "ts": 1792322414.0}, {"t": "Energy stocks dividend leaderboard: Power Grid, NTPC, SJVN, NHPC or IREDA - Which power stock beats the rest on yield?", "b": "Power Grid leads the five energy stocks in annual dividend yield at 3.08%, followed by NTPC at 2.63%. SJVN, NHPC and IREDA paid less than ₹2 per share in dividends over the past year, while their share-price returns varied.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/energy-stocks-dividend-leaderboard-power-grid-ntpc-sjvn-nhpc-or-ireda-which-power-stock-beats-the-rest-on-yield-11792318828215.html", "ts": 1792321918.0}, {"t": "Gleaning group gives £1m of produce to food banks", "b": "Gleaning Cornwall warns that more funding is needed as costs rise sharply.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6n49w1r2zxjo?at_medium=RSS&at_campaign=rss", "ts": 1792321384.0}, {"t": "Iran's seven-day Hormuz offer puts US on the clock", "b": "Iran's seven-day Hormuz offer puts US on the clock", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/international/world-news/iran-keeps-strait-of-hormuz-reopening-offer-on-table-says-path-depends-on-us/articleshow/135027230.cms", "ts": 1792319531.0}, {"t": "What is the Budget and what could be in it?", "b": "Chancellor John Healey will set out his plans for UK taxes on 28 October.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6x2zrjl7kjno?at_medium=RSS&at_campaign=rss", "ts": 1792318937.0}, {"t": "Stocks to buy: Ganesh Dongre of Anand Rathi recommends Larsen and Toubro, Equitas, Bajaj Finance shares | Target, SL", "b": "Stock market outlook: Hawkish US Fed, other global central banks including RBI, and the upward bias in US 10-year boond yields, may continue to dictate FIIs' trade patttern, says Ganesh Dongre of Anand Rathi", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/stocks-to-buy-ganesh-dongre-of-anand-rathi-recommends-larsen-and-toubro-equitas-bajaj-finance-shares-target-sl-11792314410454.html", "ts": 1792318873.0}], "Science": [{"t": "New monolithic ion trap opens quantum simulations to more researchers", "b": "Some quantum systems are so complex that even the most powerful supercomputers struggle to simulate their behavior. One solution is quantum simulation: building a controllable quantum system in the lab and tuning it to mimic the one researchers want to understand.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-monolithic-ion-quantum-simulations.html", "ts": 1792346406.0}, {"t": "A new way to detect stabilizing properties of optical devices", "b": "In optical fibers, chips and other light-guiding devices, minor defects can scatter photons and disrupt their path. A new study demonstrates a way to reveal properties which, in certain systems, help light wave behavior withstand such flaws. The method could help speed up the search for new kinds of electronics and optical technologies, and contribute to more reliable quantum devices.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-stabilizing-properties-optical-devices.html", "ts": 1792346401.0}, {"t": "Physicists prove a long-suspected quantum speed limit for thermalization", "b": "Whether we are waiting for a car windshield to defrost in winter or a warm drink to cool down, how long it takes for an object to settle into a stable, even temperature within its environment (thermal equilibrium) depends on numerous factors. These can include surface area, the material properties of an object and airflow.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-physicists-quantum-limit-thermalization.html", "ts": 1792344001.0}, {"t": "Genome detectives: Researchers sequence the genome of a harmful plant pathogen", "b": "Graduate students in Penn State's College of Agricultural Sciences contributed to the first complete genome sequence of a harmful plant pathogen from an ornamental Prunus host through an active-learning activity in a plant disease diagnosis course.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-genome-sequence-pathogen.html", "ts": 1792342801.0}, {"t": "The Guardian view on plague in Russia: what is most worrying is the lack of information | Editorial", "b": "In the three weeks since a health worker’s death in Siberia, officials have stonewalled the WHO – setting a worrying precedent for future pandemics Is there a plague outbreak in Russia? If the answer were a clear yes, there shouldn’t be much reason to worry. With swift medical intervention, plague is treatable. But in the nearly three weeks since a worker at a Siberian plague research unit died of a mysterious respiratory illness, state officials have been consistently tight-lipped about what happened and whether there were any further cases. It is this uncertainty that has the World Health Organization (WHO) and international community worried: partly because there is a – very small – risk of an outbreak, and partly because it is yet another warning that the international coordination we rely on to prevent pandemics is fraying along with the rest of international politics, and could easily fail to protect us in the future. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/oct/18/the-guardian-view-on-plague-in-russia-what-is-most-worrying-is-the-lack-of-information", "ts": 1792341004.0}, {"t": "Scientists discover a way to reverse coral bleaching at record speed", "b": "For the first time, scientists have observed bleached corals on the brink of death fully recover through brief contact with healthy clones. Ghostly white corals returned to full health in a laboratory setting within seven weeks, the fastest documented recovery to date, according to a study published in Science Advances.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-scientists-reverse-coral.html", "ts": 1792339201.0}, {"t": "Warming could help make the Indian Ocean a stronger climate buffer", "b": "The world's oceans help slow climate change by absorbing carbon dioxide (CO₂) from the atmosphere, but how much they take up can vary throughout the year. New research, published in Geophysical Research Letters, suggests these seasonal patterns are changing across the Indian Ocean, potentially affecting how it helps to regulate Earth's climate.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-indian-ocean-stronger-climate-buffer.html", "ts": 1792336801.0}, {"t": "Close social bonds help wild jackdaws hold feeding spots but come with waiting costs", "b": "Close social relationships are known to contribute to the survival of many animals, including humans. Maintaining social bonds over time, however, can also require effort and sacrifices.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-social-bonds-wild-jackdaws.html", "ts": 1792333201.0}, {"t": "Japan's MMX mission aims to swipe soil samples from Mars's moon Phobos", "b": "A Japanese space mission is about to launch towards Mars. But it will not land on the planet itself. Instead, the Martian Moons Exploration (MMX) mission will focus on Phobos, the bigger of Mars's two small moons.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-japan-mmx-mission-aims-swipe.html", "ts": 1792332001.0}, {"t": "Scientists discover a natural compound that could protect the brain from too much salt", "b": "Eating too much salt may do more than raise blood pressure. It could also harm memory and social behavior. In a new study, Japanese researchers discovered that a soy-derived compound called LPC70 helped protect mice from several damaging effects of a high-salt diet. Mice given the supplement had lower blood pressure, better memory, and improved social interactions compared with mice consuming excess salt alone.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230032.htm", "ts": 1792331194.0}, {"t": "Physicists create a bizarre new quantum state called a fractional fermi sea", "b": "Physicists have discovered a strange new state of quantum matter in which ultracold atoms defy familiar organizational rules, forming a highly excited yet surprisingly orderly configuration called a \"fractional Fermi sea.\" The discovery challenges established quantum theories and hints at exotic quasiparticles that scientists have dubbed potential \"super-Fermions.\"", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018084644.htm", "ts": 1792330641.0}, {"t": "Eating blueberries every day may have a surprising effect on your mood", "b": "Eating blueberries every day could have surprising effects on mood, according to a small study that found greater reductions in depressive symptoms among older adults who consumed the fruit for three months. Researchers also detected changes in gut microbial enzymes, suggesting a possible gut-brain connection, although the mood benefits were not statistically significant compared with a placebo.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230028.htm", "ts": 1792329744.0}, {"t": "Hybrid diamond chip strengthens interactions between light and quantum bits", "b": "Researchers have developed and demonstrated a new hybrid photonic platform that integrates quantum emitters with photonic devices, providing a way to reliably control the interaction between photons and quantum information carriers. The chip-based platform, which combines gallium phosphide (GaP) with a diamond substrate, could help make quantum networks more practical by providing a way to connect quantum devices over long distances.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-hybrid-diamond-chip-interactions-quantum.html", "ts": 1792328405.0}, {"t": "Magic mushroom ingredient takes the fight out of aggressive fish", "b": "A psychedelic compound found in magic mushrooms appears to have an unexpected effect: calming highly aggressive fish. Researchers discovered that low doses of psilocybin significantly reduced aggressive attacks in mangrove rivulus fish without disrupting their normal social interactions. The findings suggest psilocybin may selectively calm escalating aggression rather than simply suppressing all behavior.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230036.htm", "ts": 1792327933.0}, {"t": "Scientists discover a surprising twist in Japan's 7,300-year-old volcanic apocalypse", "b": "A catastrophic volcanic eruption 7,300 years ago devastated Japan, but new research reveals that its impact on prehistoric populations was far more complex than previously believed. While some communities disappeared or declined, others unexpectedly flourished as survivors migrated, adapted, and found new ways to thrive.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230023.htm", "ts": 1792326981.0}, {"t": "Scientists uncover 3 key brain pathways linked to lasting depression relief", "b": "Researchers have uncovered three brain pathways linked to lasting improvements in people receiving deep brain stimulation for severe, treatment-resistant depression. They also discovered that patients who failed to improve after two years shared a striking pattern: insufficient stimulation of a crucial brain connection. The findings suggest that millimeters in electrode placement could make a major difference in treatment outcomes.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230021.htm", "ts": 1792325948.0}, {"t": "Two monster black holes could collide in just 100 years", "b": "Astronomers have uncovered compelling evidence of two supermassive black holes spiraling toward a potentially spectacular collision at the center of galaxy Mrk 501. A previously unseen jet of particles revealed the likely presence of a second black hole, with observations suggesting the pair completes an orbit every 121 days. Depending on their masses, these cosmic giants could merge in as little as 100 years.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261016070650.htm", "ts": 1792324998.0}, {"t": "Lion droppings yield previously unknown microbial species, exposing hidden diversity inside Africa's big cats", "b": "Scientists know a great deal about how lions hunt, breed and survive, but the microscopic communities living inside them have remained largely unexplored. Now, a study of wild lions in Namibia is beginning to change that, while revealing how much biology is still missing from the world's genomic databases.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-lion-yield-previously-unknown-microbial.html", "ts": 1792324801.0}, {"t": "The New Science of Stuttering", "b": "Experts are reaching consensus on what the condition is. Now they’re debating how best to treat it.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/18/science/the-new-science-of-stuttering.html", "ts": 17923
