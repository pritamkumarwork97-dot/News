"ts": 1792771563.0}, {"t": "Shriram Finance Q2 profit jumps 59% YoY to Rs 3,677 crore on strong interest income, lower funding costs", "b": "Shriram Finance reported a 59.4% year-on-year rise in standalone net profit to Rs 3,677 crore for the quarter ended September 2026 backed by rise in net interest income growth and lower finance costs. It reported net profit of Rs 2,307 crore a year agoNet interest margin improved to 9.52% from 8.19% a year earlier. “Our long-term guidance has consistently been around 8.5%, but it will take some time to return to that level. For the next two quarters, we expect NIM to remain around 9%,” Parag Sharma, MD & CEO told ET. He attributed the growth in profit to two factors. “The first was growth in business volumes, and the second was the substantial benefit from lower interest costs, which lifted net interest income,” he added.Net interest income rose 38% to Rs 8,661 crore from Rs 6,267 crore. The increase was driven by a 15.6% rise in interest income to Rs 13,669 crore, while interest expenses declined 9.9% to Rs 5,008 crore.Operating profit increased 53.3% to Rs 6,809 crore, while the cost-to-income ratio improved to 22.52% from 27.76%.", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/shriram-finance-q2-profit-jumps-59-yoy-to-rs-3677-crore-on-strong-interest-income-lower-funding-costs/articleshow/135150195.cms", "ts": 1792771528.0}, {"t": "Shree Cement profit falls 15% YoY to Rs 263 crore on higher fuel costs", "b": "Shree Cement’s September-quarter net profit fell over 15% year-on-year to Rs 263 crore for the third consecutive quarterly decline. Revenue rose 24% and sales volumes increased 14%, but soaring fuel costs pressured profitability despite stronger premium product sales.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/shree-cement-profit-falls-15-yoy-to-rs-263-crore-on-higher-fuel-costs/articleshow/135150160.cms", "ts": 1792771384.0}, {"t": "Jana Small Finance Bank Q2 profit jumps 127%, raises FY27 growth outlook", "b": "Jana Small Finance Bank reported a 127% year-on-year rise in Q2 profit to Rs 170 crore, supported by business growth, higher margins and improved gross asset quality. The bank raised its annual profit growth guidance to 100%, while loans and deposits expanded.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/jana-small-finance-bank-q2-profit-jumps-127-raises-fy27-growth-outlook/articleshow/135150094.cms", "ts": 1792771228.0}, {"t": "Why Anger About Data Centers and Energy Prices May Not Swing Votes", "b": "In Ohio, many voters say their frustration about the increase in electricity and fuel prices and the growth of data centers won’t influence whom they vote for.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/10/23/business/energy-environment/ohio-election-gas-prices.html", "ts": 1792771209.0}, {"t": "U.S. Government Takes a Cut of Chip Business in Japan-Funded Deal", "b": "President Trump’s novel deal-making is on display in upstate New York, where the administration is funneling Japanese funds into a government-owned chip factory.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/10/23/business/economy/us-japan-chip-deal.html", "ts": 1792771185.0}, {"t": "A Fight Over Felon Voting Prompts a Free Speech Debate", "b": "A Minnesota group worried that its opposition could expose it to prosecution under the state’s deceptive-practices law. Its lawsuit could have wide implications for limiting speech around elections.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/10/23/business/media/election-disinformation-laws-minnesota.html", "ts": 1792770292.0}, {"t": "The little-known investment Martin Lewis wants you to understand...", "b": "The little-known investment Martin Lewis wants you to understand", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/c8ly0357prl7o?at_medium=RSS&at_campaig 6. However, on a sequential basis, the company posted a strong turnaround in the September quarter, against a loss of Rs 3,962.13 crore in the previous quarter (Q1FY27).The company's revenue from operations gained 29.78% YoY at Rs 1,57,817.93 crore in the quarter under review, compared with Rs 1,21,604.70 crore reported in Q2FY26. Total expenses at the state-owned company rose 32.54% YoY to Rs 1,51,932.8 crore against Rs 1,14,634.91 crore in the year-ago quarter.On a sequential basis, earnings before interest, tax, depreciation and amortisation (EBITDA) stood at Rs 8,971 crore, compared with a loss of Rs 4,077 crore in the preceding quarter.", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/bpcl-q2-results-net-profit-declines-21-yoy-to-rs-4863-crore-revenue-grows-29/articleshow/135149653.cms", "ts": 1792769275.0}, {"t": "'We could take all of the oil in Iran': Trump", "b": "'We could take all of the oil in Iran': Trump", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/defence/we-could-take-all-of-the-oil-in-iran-trump-weighs-quick-end-to-iran-war-against-letting-conflict-wither/articleshow/135149569.cms", "ts": 1792769169.0}, {"t": "RBI governor reiterates listing requirement for top NBFCs as focus intensifies on Tata Sons", "b": "India's central bank governor said on Friday non-bank finance companies classified in the upper layer are required to list on the stock market, reiterating the Reserve Bank of India's stance on the listing of Tata Sons without commenting directly on the company.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/news/rbi-governor-reiterates-listing-requirement-for-top-nbfcs-as-focus-intensifies-on-tata-sons/articleshow/135149631.cms", "ts": 1792769141.0}], "Science": [{"t": "Black holes spinning near maximum rate could split in two, calculations suggest", "b": "Two black holes can collide and merge into one. But could the opposite happen: could a single black hole split into two smaller ones? That question is explored in a new theoretical study: \"When Black Holes Admit Pair-of-pants Topologies,\" published in the journal Physical Review D.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-black-holes-maximum.html", "ts": 1792779612.0}, {"t": "Hoarders without borders: Study suggests investors aid international expansion", "b": "Venture capital firms can help young businesses expand internationally by providing funding as well as market knowledge, expertise and access to professional networks, according to a research literature review published in the International Journal of Management and Enterprise Development.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-hoarders-borders-investors-aid-international.html", "ts": 1792779607.0}, {"t": "From sea anemone to human fertility: A new research organism for understanding meiosis", "b": "Every egg cell and sperm cell depends on meiosis, a tightly choreographed process in which chromosomes find their partners, exchange genetic material and then divide. When meiosis goes awry in humans, the consequences can include infertility, miscarriage and birth defects.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-sea-anemone-human-fertility-meiosis.html", "ts": 1792778435.0}, {"t": "An ancient virus in chimpanzee DNA switches off a gene that is active in humans", "b": "Humans and chimpanzees share almost all their genes. Despite this, our brains have developed in different ways. Researchers at Lund University in Sweden have now shown that a viral pandemic dating back several million years is likely to be part of the explanation.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ancient-virus-chimpanzee-dna-gene.html", "ts": 1792778426.0}, {"t": "As flood risk rises, some communities question the idea of resilience", "b": "Climate change is increasing flood risk across the U.K. As floods become more frequent and intense, communities are increasingly encouraged to become resilient and \"live with water.\" Yet in some flood-prone areas, residents are rejecting these calls, concerned that resilience is less about helping communities and more about transferring responsibility from institutions to citizens.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-communities-idea-resilience.html", "ts": 1792778417.0}, {"t": "Paleolithic human DNA reveals east-west connections across Ice Age Europe", "b": "More than 30,000 years ago, people associated with one of Europe's major Paleolithic cultures (the Gravettian) were more interconnected than previously thought. An international research team led by the University of Vienna has uncovered new genetic evidence of long-distance connections between these populations. Published in Science Advances, the study combines genomic data from rare human remains with human DNA preserved in cave sediments.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-paleolithic-human-dna-reveals-east.html", "ts": 1792778411.0}, {"t": "Scientists find key to predicting some El Niño events 12 months ahead", "b": "Scientists have identified the conditions that make it possible to predict some El Niño and La Niña events up to a year in advance, potentially giving communities and decision-makers significantly more time to prepare for weather extremes.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-scientists-key-el-nio-events.html", "ts": 1792778402.0}, {"t": "Why Drug Companies Are Rushing to Market Ketamine Medicines", "b": "Spurred on by the Trump administration’s embrace of psychedelic medicine, researchers are experimenting with new — and not so new — forms of  Boelo warning upgraded to amber", "b": "It is due to be the second of two storms to hit Scotland over the weekend, with Storm Austen bringing heavy rain on Friday.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cwkgjz3dpyj6o?at_medium=RSS&at_campaign=rss", "ts": 1792771991.0}, {"t": "Oil spill washes up on UAE beaches after tanker strike", "b": "Satellite images show oil spreading for miles along the coastline, threatening local marine wildlife", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6rey3n974g5o?at_medium=RSS&at_campaign=rss", "ts": 1792769447.0}, {"t": "Weather warnings in place ahead of Storm Boelo", "b": "The amber Met Office alert for counties Antrim and Londonderry lasts from 21:00 BST on Saturday until 21:00 GMT on Sunday.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c83vqn2x54v1o?at_medium=RSS&at_campaign=rss", "ts": 1792766225.0}, {"t": "Why should I stockpile and what will I need?", "b": "The UK government has warned households to have three days of essential supplies on hand.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cred3xnj0j0qo?at_medium=RSS&at_campaign=rss", "ts": 1792762232.0}, {"t": "October's full Hunter's Moon to light up night sky this weekend", "b": "October's full Moon, known as the Hunter's Moon, will rise on Sunday night. Will the weather be in your favour?", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cw4g19dll8jlo?at_medium=RSS&at_campaign=rss", "ts": 1792758260.0}, {"t": "Denmark nurdles may be from Tyne spill, agency says", "b": "The Danish Environment Protection Agency says nurdles it has tested are similar to the Tyne pellets.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqy43xv1jwv2o?at_medium=RSS&at_campaign=rss", "ts": 1792756574.0}, {"t": "One of Earth’s most powerful supervolcanoes is refilling with fresh magma", "b": "Deep beneath Japan’s Kikai caldera, a massive magma reservoir is refilling 7,300 years after one of the most powerful volcanic eruptions in Earth's recent geological history. Scientists used underwater seismic surveys to reveal a vast store of magma that appears to have accumulated since the ancient catastrophe. The discovery could help explain how supervolcanoes like Yellowstone and Toba rebuild their magma supplies.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261023003214.htm", "ts": 1792754599.0}, {"t": "Dental implants can hijack your immune system, scientists discover", "b": "Researchers have uncovered a surprising reason dental implant infections often resist antibiotics: the implants themselves can contribute to the problem. Bacteria corrode titanium implants, releasing microscopic particles that hijack immune cells, trigger destructive inflammation, and accelerate jawbone loss.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261022081314.htm", "ts": 1792753948.0}, {"t": "Breakthrough PTSD treatment achieves 68% remission rate in clinical trial", "b": "A newly FDA-cleared PTSD treatment uses personalized brain mapping and magnetic stimulation to target abnormal brain activity, with a clinical trial reporting a 52% reduction in symptoms and 68% remission. Researchers believe the technology could transform PTSD care and pave the way for more precise treatments for other mental health conditions.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261022081309.htm", "ts": 1792753345.0}, {"t": "Fund to help businesses switch to green vehicles", "b": "Council leader Stephen Place says it will help businesses counter the rising cost of fuel.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cr62ydqjvg9lo?at_medium=RSS&at_campaign=rss", "ts": 1792750500.0}, {"t": "Scientists discover a surprising double benefit of exercise for Parkinson’s", "b": "A seven-year study found that people with Parkinson’s disease who were more physically active experienced slower declines in memory, thinking, and movement abilities. Those exercising more than eight hours per week showed almost no average cognitive decline, suggesting that staying active may offer important benefits as the disease progresses.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261022081306.htm", "ts": 1792750211.0}, {"t": "Storm Austen hits UK as yellow wind warnings in effect", "b": "Disruption to travel is likely as the season's first named storm brings a swathe of powerful winds to south-west England on Friday.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cq8ezy256e42o?at_medium=RSS&at_campaign=rss", "ts": 1792747803.0}, {"t": "Scientists discover a hidden messaging system deep inside the brain", "b": "A tiny region deep within the brain has surprised scientists by revealing a remarkably sophisticated communication system. Previously thought to broadcast the same chemical signal throughout the brain, this region actually sends targeted messages that help control learning, attention, and behavior, according to new research in mice.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261022081304.htm", "ts": 1792744102.0}, {"t": "BBC presenter battles strong winds as Storm Austen hits Newquay", "b": "BBC lead weather presenter Simon King is in Newquay as the \"full force\" of the storm arrives.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cmzxlgkyl3vpo?at_medium=RSS&at_campaign=rss", "ts": 1792744007.0}, {"t": "India slashes cost of cancer drugs after court rules mark-ups are ‘extortion’", "b": "Case filed in 2022 by patient unable to afford medicine leads to cap on drug prices for millions who face ruin if diagnosed The Indian government has moved to reduce the price of cancer drugs after a retired bank clerk took her case to the supreme court. From next month, 137 cancer drugs in India will be cheaper as the government tries
