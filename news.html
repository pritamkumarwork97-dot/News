": "Astronauts’ hearts just passed a surprising test for Mars", "b": "A new study tracking 13 astronauts suggests that the human heart may be surprisingly well equipped for a journey to Mars, especially with regular exercise during spaceflight. Researchers found that astronauts' hearts adapted to months of weightlessness and handled simulated Martian gravity without major problems, offering new hope for future missions to the Red Planet.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261020085016.htm", "ts": 1792583954.0}, {"t": "How much gas could Jackdaw provide? And will it cut your energy bills?", "b": "BBC Verify looks at what the Jackdaw decision means for bills, energy security and the environment.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cq4g13pplyzzo?at_medium=RSS&at_campaign=rss", "ts": 1792583869.0}, {"t": "Astronaut surprise video leaves pupils starstruck", "b": "The surprise came after a teacher's father met Peake while working on a cruise ship.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmvg9vlgxkv8o?at_medium=RSS&at_campaign=rss", "ts": 1792583719.0}, {"t": "Rejuvenation breakthrough: Scientists reverse 60 years of aging in human cells", "b": "Scientists have turned blood cells from an 80-year-old into neural stem cells with a molecular age of less than 20, effectively reversing more than 60 years of cellular aging in the laboratory. The discovery offers a new way to investigate how cells become younger and could help researchers better understand age-related diseases such as Alzheimer's.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261020085013.htm", "ts": 1792580632.0}, {"t": "NASA’s Perseverance Mars rover just shattered the all-time off-world driving record", "b": "NASA’s Perseverance rover has shattered a historic space exploration record, traveling farther across another world than any vehicle before it. Its advanced se lga that helped scientists win the Nobel prize", "b": "Chlamydomonas and its light-sensing protein help show how memories, feelings and behaviour form in our brains A tiny alga has helped show how memories, feelings and behaviour form in our brains, in research by three scientists awarded the Nobel prize for physiology or medicine this month. Chlamydomonas is a one-celled alga that swims towards light using a light-sensing protein called channelrhodopsin, remarkably similar to the rhodopsin in our eyes. When the channelrhodopsin detects light, electrically charged ions rush into the cell from outside, triggering an electrical signal incredibly fast that tells the alga to move with its hair-like motor. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/21/chlamydomonas-one-celled-alga-nobel-prize", "ts": 1792558804.0}, {"t": "Mystery of Roman sarcophagus unearthed at Westminster Abbey solved at last, expert says", "b": "Archaeologist says skeleton inside coffin inscribed to Valerius Amandinus is likely to be remains of 11th-century abbot It has all the ingredients of a chilling mystery: the skeleton of an unknown man discovered within a Roman sarcophagus unearthed in the grounds of Westminster Abbey. Now an expert has said he has solved the longstanding “who-is-it”, suggesting the remains belonged to a medieval abbot. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/uk-news/2026/oct/21/mystery-roman-sarcophagus-westminster-abbey-solved-at-last-expert-says", "ts": 1792558803.0}, {"t": "Giant tunnel proposed to clean up Windermere's sewage problem", "b": "The plan would eliminate sewage spills into Windermere, blamed for turning the water green.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cr5yn4pky527o?at_medium=RSS&at_campaign=rss", "ts": 1792557896.0}, {"t": "A massive asteroid slammed into the North Sea and unleashed a 330-foot tsunami", "b": "A decades-long m function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
 $('h').textContent="News of "+DATE+" · nothing more, nothing less";
 $('n').innerHTML=cats.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';i=0;render()">${c} (${D[c].length})</button>`).join('');
 const L=D[cat],c=$('c');
 if(i>=L.length){c.innerHTML=`<div class="done"><h2>✓ You're all caught up on ${cat}</h2><p class="meta">That was every story for ${DATE}. See you tomorrow.</p></div>`;$('k').textContent="done";return}
 const s=L[i];c.innerHTML=`<div class="meta">${esc(s.s)}</div><h2>${esc(s.t)}</h2><p>${esc(s.b)}</p><div class="meta"><a href="${esc(s.l||'#')}" target="_blank" rel="noopener">Read full story ↗</a></div>`;
 $('k').textContent=(i+1)+" / "+L.length;c.scrollTop=0}
const go=d=>{i=Math.max(0,Math.min(D[cat].length,i+d));render()};
$('p').onclick=()=>go(-1);$('x').onclick=()=>go(1);
document.onkeydown=e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)};
document.ontouchstart=e=>sx=e.touches[0].clientX;
document.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1)};
render();
</script></body></html>
