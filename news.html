et for zero growth in 2026: UN", "b": "Global maritime trade—which carries more than 80% of the world's goods—is set to stagnate in 2026 due to shipping disruptions and trade uncertainties arising from the war in the Middle East, the United Nations said Thursday.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-global-maritime-growth.html", "ts": 1795708801.0}, {"t": "Protein redesign boosts DNA insertion activity and reveals how molecular machinery selects targets", "b": "Genome engineering is exciting, given its vast potential to treat and even cure diseases, but it is still a largely uncharted biomedical innovation. Scientists at St. Jude Children's Research Hospital recently uncovered the mechanisms involved in precisely integrating DNA into a target genomic location using CRISPR-associated transposases (CASTs). By studying type I-F3 CAST, the researchers unveiled structural findings that explain how this CAST family achieves successful DNA integration at precise target sites and offer insights for future genomic engineering approaches. The results were published in Nature.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-protein-redesign-boosts-dna-insertion.html", "ts": 1795707602.0}, {"t": "Do all groups drift toward rule by the few? Not when time is on their side", "b": "For more than a century, a bleak idea has hung over the ideal of democracy: Given enough time, every group ends up ruled by a few. The idea, known as the iron law of oligarchy, was first proposed by the sociologist Robert Michels in the early 1900s.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-groups-drift-side.html", "ts": 1795706406.0}, {"t": "Learning facts out of interest may take less mental effort than learning them for money", "b": "When completing tasks or acquiring information, humans can be driven by intrinsic and extrinsic motivations. The term intrinsic motivation entails doing something because it is interesting to us or we find it enjoyable, while extrinsic motivation means doing it to obtain a reward, such as money, praise or a good grade.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-facts-mental-effort-money.html", "ts": 1795705205.0}, {"t": "Two mechanisms of amino acid transport in a rare disease-associated protein revealed", "b": "Cells must constantly exchange amino acids with their environment to make proteins and support numerous bodily processes. To do this, they have specialized transporters located in their membranes.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-mechanisms-amino-acid-rare-disease.html", "ts": 1795704001.0}, {"t": "Scientists discover quasar formed within a mere 630 million years of the Big Bang, setting a record", "b": "Scientists have discovered the most distant quasar yet, the core of a galaxy with a slow-chomping black hole at its center dating back to nearly the dawn of the universe.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-scientists-quasar-mere-million-years.html", "ts": 1795701602.0}, {"t": "Contraceptive pill usage in Great Britain fell drastically in last decade, research finds", "b": "Survey published in Lancet reveals ‘hormonal hesitancy’ on the rise – with implants and injections also increasingly spurned The number of young women using hormonal contraception fell drastically in the past decade, with social media fuelling the “hormonal hesitancy” phenomenon. New findings from the fourth National Survey of Sexual Attitudes and Lifestyles (Natsal-4), published in The Lancet, found that almost one in five women in Great Britain at risk of unintended pregnancy were not using effective contraception. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/society/2026/nov/26/contraceptive-pill-usage-in-great-britain-fell-drastically-in-last-decade-research-finds", "ts": 1795698051.0}, {"t": "Early Stone Age rock carvings in Scandinavia may have been signposts for hunting grounds", "b": "Between roughly 9,000 and 4,000 B.C., artists in ancient Scandinavia painstakingly carved large, sometimes life-size images of elk, reindeer, bears and other creatures into rock faces teetering on the edge of fjords, rivers and lakes. But their meaning has long been debated.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-early-stone-age-scandinavia-signposts.html", "ts": 1795698005.0}, {"t": "Sensory deterrents aren't a 'one-size-fits-all' solution for sharks and rays", "b": "A study on how select species of rays and sharks respond to sensory deterrents has reinforced why there isn't a one-size-fits-all solution to prevent fisheries bycatch.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-sensory-deterrents-size-solution-sharks.html", "ts": 1795696802.0}, {"t": "BITS Pilani-Hyderabad researchers develop affordable way to grow microalgae", "b": "BITS Pilani-Hyderabad researchers develop affordable way to grow microalgae", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/national/telangana/bits-pilani-hyderabad-researchers-develop-affordable-way-to-grow-microalgae/article71746060.ece", "ts": 1795695840.0}, {"t": "Many buyers willing to pay more to know where their food comes from", "b": "New research from Curtin University reveals many Australians are prepared to pay more for food when they know where it comes from and how animals are treated, despite ongoing cost-of-living pressures.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-buyers-pay-food.html", "ts": 1795695601.0}, {"t": "Mathematics fact fluency interventions for students with mathematics difficulties", "b": "Associate professor Jonté Myers knows that developing fluency with mathematics facts is key to mathematics proficiency. However, many students struggle to develop these foundational skills.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-mathematics-fact-fluency-interventions-students.html", "ts": 1795694402.0}, {"t": "Young people are having less sex. What's going on? - video", "b": "Sex among British adults has slumped in recent decades, with under-45s having half as many monthly encounters as in 1990 and one in three under-25s reporting that they have never had sexual intercourse. To unpick some of the possible reasons behind these declines, Madeleine Finlay hears from science editor and co-host Ian Sample. He tells her why young people might be having sex later, and what could account for the striking rise in women reporting that they don’t want children. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/video/2026/nov/26/young-people-are-having-less-sex-than-ever-whats-going-on-video", "ts": 1795692955.0}, {"t": "The surprising reason women seem better at multitasking than men", "b": "Men and women appear to be similarly capable of multitasking, but men are more than twice as likely to ignore conversation while juggling multiple activities. Researchers believe this unexpected difference may help explain why women are widely perceived as better multitaskers.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261125045306.htm", "ts": 1795692107.0}, {"t": "Deep beneath Australia, hidden caves could unlock the secrets of alien worlds", "b": "Scientists have solved the mystery of strange trenches scattered across Australia’s vast Nullarbor Plain, revealing an extensive hidden world beneath the surface. These subtle landscape features are created as deeply buried cave systems slowly collapse upward over millions of years. The discovery could help researchers locate unexplored caves containing ancient environmental records and unusual life forms.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261124055901.htm", "ts": 1795691175.0}, {"t": "This 345-million-year-old fossil had scientists fooled for decades", "b": "A famous 345-million-year-old fossil has turned out to be something entirely different from what scientists believed for decades. Advanced X-ray imaging revealed hidden gills and thousands of tiny teeth, exposing a primitive aquatic or amphibious creature rather than an early reptile. The discovery suggests that several adaptations associated with life on land actually evolved in animals still dependent on water.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261125045307.htm", "ts": 1795689977.0}, {"t": "'King tide' waves batter California coast, soaking San Francisco", "b": "Massive waves carried on king tides battered California's coast Wednesday, prompting evacuations and soaking San Francisco, but sparing feared mass disruptions to Thanksgiving holiday travel.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-king-tide-batter-california-coast.html", "ts": 1795689606.0}, {"t": "US Army says controlled blast of explosives in Iowa was 'huge success'", "b": "Officials say no lead has been detected in the surrounding area, which continues to be tested following concerns from locals.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cwg7l5ve251ko?at_medium=RSS&at_campaign=rss", "ts": 1795689515.0}, {"t": "Wildfires raze homes, displace wildlife on Australian island", "b": "Wildfires have forced road closures, displaced animals and razed homes while engulfing over 10% of Australia's southeastern Flinders Island, emergency services said Thursday.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-wildfires-raze-homes-displace-wildlife.html", "ts": 1795688401.0}, {"t": "How Birds With GPS and Audio Sensors Track Hidden Fishing Boats", "b": "Researchers are using seabirds equipped with GPS and audio gear to detect vessels that operate with no tracking signals and to assess the environmental hazards they pose.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/26/climate/seabirds-tracking-hidden-fishing-boats.html", "ts": 1795687445.0}, {"t": "Some miniature Cas12m proteins can cut DNA after all", "b": "An international research group led by graduate student Hayato Morinaga, Assistant Professor Satoshi N. Omura and Professor Osamu Nureki from the University of Tokyo has demonstrated for the first time that some Cas12m proteins do have an active state capable of cutting, or \"cleaving,\" DNA. The team also clarified the structural differences between the active and inactive variations.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-miniature-cas12m-proteins-dna.html", "ts": 1795687206.0}, {"t": "FCC says SpaceX can deploy 1 million satellites for data centers in space. Scientists are skeptical", "b": "The Trump administration on Wednesday gave SpaceX the green light to deploy 1 million satellites that it said would create data centers in space, a long-held, lofty goal of Elon Musk's rocket company, in a move that has raised both skepticism and alarm among some scientists.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fcc-spacex-deploy-million-satellites.html", "ts": 1795685606.0}, {"t": "Musk's plan to send a million SpaceX data satellites into space approved", "b": "The Starmind constellation aims to be the most cost and energy-efficient way to meet the growing demand for AI computing power.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cwp836l8n1jgo?at_medium=RSS&at_campaign=rss", "ts": 1795685264.0}, {"t": "Dragonflies feast on other insects during autumn migrations", "b": "Dragonflies feast on a host of insects—and each other—during their autumn migrations, new research shows. Scientists studied dragonflies at the Pass of Bujaruelo—a 30-meter (98-foot) gap between two high peaks in the Pyrenees, through which millions of insects migrate every year.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-dragonflies-feast-insects-autumn-migrations.html", "ts": 1795678201.0}, {"t": "Low funding for postdoc roles fuelling brain drain, govt. funds only 2,500 positions", "b": "India spends about $13 a year per person on research; China spends $250, the U.S. over $2,100. There are just 262 full-time-equivalent researchers per million people in the country", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/education/the-ecosystem-divide-why-indian-bright-minds-thrive-abroad-but-stall-at-home/article71450553.ece", "ts": 1795677276.0}, {"t": "Whitehouse calls on PM to help save lake fish", "b": "The comedian warns extinction beckons for Arctic charr in Windermere after thousands of years.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6808pxrzy5po?at_medium=RSS&at_campaign=rss", "ts": 1795673136.0}, {"t": "New images reveal crater on asteroid hit by NASA’s DART planetary defence mission", "b": "The DART, short for Double Asteroid Redirection ⁠Test, spacecraft collided with Dimorphos on September 26, 2022; asteroid tumbles in space, with boulders flying around", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/new-images-reveal-crater-on-asteroid-struck-by-dart-spacecraft/article71745339.ece", "ts": 1795671916.0}, {"t": "How waistlines, organ function tell a better story of obesity than BMI does", "b": "In 2025, The Lancet Diabetes & Endocrinology established a commission of 58 experts from different countries to set obesity-related guidelines. A new study in Nature has tested whether the commission’s recommendations can actually distinguish between people at different levels of risk, with data from 8.4 lakh adults", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/how-waistlines-organ-function-tell-a-better-story-of-obesity-than-bmi-does/article71737994.ece", "ts": 1795671032.0}, {"t": "Top 10 math problems AI models have taken a run at in 2026 (so far)", "b": "A flurry of announcements landed in the third week of November claiming that various artificial intelligence (AI) models had solved longstanding mathematical problems", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/top-10-math-problems-ai-models-have-taken-a-run-at-in-2026-so-far/article71745209.ece", "ts": 1795669359.0}, {"t": "World's fastest animal could nearly double its livable territory by 2080 in the UK due to climate change", "b": "Global warming and climate change could have the unexpected bounty of making Great Britain a more welcoming home for the fastest animal on Earth. The area suitable for peregrine falcons within the UK could grow by 74% by the year 2080 under a high-emissions climate scenario, a new study has shown.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-world-fastest-animal-livable-territory.html", "ts": 1795669201.0}, {"t": "Sending an Australian astronaut to space is expensive. How do we work out if it's worth it?", "b": "Australia is currently in talks with the European Space Agency (ESA) over potentially flying Katherine Bennell-Pegg on a future space mission. If accepted, Bennell-Pegg—who is the director of space technology at the Australian Space Agency and completed ESA training in 2024—would become the first officially funded Australian astronaut.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-australian-astronaut-space-expensive-worth.html", "ts": 1795668001.0}, {"t": "New eyes in the sky make timber harvesting and forest conservation easier and more efficient", "b": "Flying thousands of feet above northern and eastern Maine, Dave Sandilands searched for illegally dumped trash. On behalf of the New England Forestry Foundation, the University of Maine pilot was surveying both the 760,000-acre (308,000-hectare) Pingree Easement in northern Maine, home to the state's most productive peregrine falcon nesting area, and 335,000 acres (136,000 hectares) in Washington County through the Downeast Lakes Forestry Partnership.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-eyes-sky-timber-harvesting-forest.html", "ts": 1795664401.0}, {"t": "Scientists discover mysterious lakes more than a mile beneath the Red Sea", "b": "More than a mile beneath the surface of the Red Sea, scientists have discovered rare underwater lakes that could reveal secrets about Earth's ancient oceans and the possibility of alien life. Known as brine pools, these extremely salty, oxygen-free environments are surprisingly teeming with microbial life, challenging our understanding of where living organisms can survive.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261125045259.htm", "ts": 1795660957.0}, {"t": "Do we really know more about space than the ocean?", "b": "New discoveries are made about the world every day—a species of deep-sea fish here, a new galaxy there. There's a saying, \"We know more about space than the ocean.\" But is this true? How do we determine knowing? Is it the number of things we have directly observed, or is it a matter of resolution?", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-space-ocean.html", "ts": 1795660801.0}, {"t": "Astronomers may have discovered a black hole born before the first stars", "b": "A mysterious object named Phoebe, detected when it briefly magnified a distant star, could be a primordial black hole formed just after the Big Bang. With an estimated mass only three times that of the Moon, it may be a 13-billion-year-old cosmic relic that offers new clues to the mystery of dark matter.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261122060346.htm", "ts": 1795658433.0}, {"t": "From solving to 'digesting': How mathematicians can adapt to the dramatic changes AI has brought to their field", "b": "Mathematics is having an existential crisis. On Nov. 20, 2026, a mathematician at the AI company Anthropic claimed that while working with the model Claude, he had solved the generalized Riemann hypothesis, the most famous problem in mathematics. This problem has stood unsolved for 167 years, and solving it could easily warrant a Fields Medal—considered equivalent to a Nobel Prize, but for mathematics.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-digesting-mathematicians-ai-brought-field.html", "ts": 1795657201.0}, {"t": "India’s satellite supply chain ‘highly dependent on imports’, says space body", "b": "India’s space economy is currently valued at nearly $9 billion and is set to grow to $40-45 billion in less than a decade", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/indias-satellite-supply-chain-highly-dependent-on-imports-says-space-body/article71743312.ece", "ts": 1795656405.0}, {"t": "California warns of flooding as King Tides peak over Thanksgiving", "b": "Parts of the Canadian province of British Columbia may also be affected by the storms and flooding, which come as millions of people travel for the holiday.", "s": "BBC News", "l": "https://www.bbc.co.uk/new
