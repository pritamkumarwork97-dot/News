c.co.uk/news/articles/cq398zl8jmvdo?at_medium=RSS&at_campaign=rss", "ts": 1792160390.0}, {"t": "Anna Mani: a star from the hills", "b": "Anna Mani, who dedicated her life to improving weather forecasting in the country, dared to venture into areas India had never stepped into before", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/children/anna-mani-a-star-from-the-hills/article71546743.ece", "ts": 1792157990.0}, {"t": "USC scientists discover how to create a never-ending supply of cancer-fighting cells", "b": "USC scientists have discovered a way to create a potentially renewable supply of genetically engineered immune cells that can attack cancer and strengthen the body's natural defenses. By growing and modifying immature immune cells rather than mature ones, researchers developed a system that can continuously produce tumor-fighting cells inside the body.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015003803.htm", "ts": 1792154810.0}, {"t": "The uranium cubes that exposed Nazi Germany’s nuclear failure", "b": "Scientists investigating Nazi Germany's secret nuclear program have uncovered evidence that its final experimental reactor was nowhere near as close to working as previously claimed. Analysis of surviving uranium cubes and wartime documents reveals that Germany lacked the enormous quantities of uranium and heavy water needed to make its reactor operational.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015073218.htm", "ts": 1792153972.0}, {"t": "Watch: Did Tesla really just unveil a flying car?", "b": "Tesla CEO Elon Musk showcased the vehicle at a facility owned by his SpaceX company, which helped develop the model.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/ckly4mj1g3n9o?at_medium=RSS&at_campaign=rss", "ts": 1792153951.0}, {"t": "Yale scientists discover how stress changes the brain to make memories stronger", "b": "Yale scientists have uncovered how the stress hormone cortisol helps the brain turn emotional experiences into stronger, longer-lasting memories. The discovery reveals that stress can reshape communication between brain networks involved in emotion and memory, potentially explaining why certain moments are so difficult to forget.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261014015517.htm", "ts": 1792151735.0}, {"t": "Elon Musk reveals ‘world’s first flying car’ at Tesla event", "b": "The Tesla Roadster 2 drove up a curved ramp before using SpaceX rocket thrusters to fly, flip and land Elon Musk has revealed Tesla’s latest model, which he claims will be the world’s first flying car, using technology from his aerospace company SpaceX to “basically fly like a rocket”. The billionaire, who hosted a demonstration of the Tesla Roadster 2 at the SpaceX rocket development and testing facility in Texas, said the sports car could go from 0 to 60mph in a record time of less than a second and had thrusters. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/technology/2026/oct/16/elon-musk-reveals-worlds-first-flying-car-spacex", "ts": 1792151584.0}, {"t": "Astronomers discover a strange universal rule behind black hole eruptions", "b": "Scientists have discovered that black holes of vastly different sizes appear to launch powerful jets according to the same universal rule. The breakthrough could explain why some black holes suddenly erupt years after devouring a star and help astronomers predict when these spectacular outbursts will happen.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261014015507.htm", "ts": 1792147533.0}, {"t": "Scientists discover a plastic-eating “Pac-Man” enzyme with a surprising secret", "b": "Scientists have discovered a remarkable “Pac-Man enzyme” that helps bacteria devour certain types of plastic and may offer new hope in the fight against plastic pollution. Researchers found that several biodegradable plastics completely broke down in soil within about a year, while conventional plastic remained largely unchanged.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261014015509.htm", "ts": 1792146723.0}, {"t": "What is behind the success of dark skies festival?", "b": "Stargazers are preparing to enjoy an annual festival that celebrates the beauty of the night sky.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c68xzg941x5vo?at_medium=RSS&at_campaign=rss", "ts": 1792145594.0}, {"t": "Bengaluru scientists decode solar eruptions using Aditya-L1 and Proba-3 satellites", "b": "The coronagraph onboard Aditya-L1 (VELC) and Proba-3 (ASPIICS) conducted joint observations of almost the same part of the solar corona in two different types of observations (spectroscopic from VELC and imaging from ASPIICS)", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/bengaluru-scientists-decode-solar-eruptions-using-aditya-l1-and-proba-3-satellites/article71591287.ece", "ts": 1792134400.0}, {"t": "NASA captures strange waves high above Hurricane Simon", "b": "As Hurricane Simon unleashed destructive winds and flooding along Mexico’s coast, NASA satellites captured an extraordinary sight: massive atmospheric waves rippling high above the storm. The rare images reveal how powerful hurricanes can disturb the upper atmosphere, creating patterns that are usually invisible from space.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015073207.htm", "ts": 1792129844.0}, {"t": "Building bridges for India’s wildlife", "b": "This country has an animal overpass that is nearly a kilometre long and spans a highway, a rail yard, and a golf course. Our increasingly busy highways surely need such facilitators for our wildlif
