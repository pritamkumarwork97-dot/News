577 per kg on Friday, extending its October decline to ₹45,000 and putting it on track for its steepest monthly loss of 2026. Gold also slid, as persistent inflation, rising energy prices and expectations of higher US interest rates weighed on precious metals.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/silver-price-crash-deepens-as-oct-losses-hit-rs-45-000-kg-gold-falls-to-7-month-low-why-are-precious-metals-sinking-11793368770318.html", "ts": 1793372058.0}], "Science": [{"t": "Rediscovered 1935 recordings reveal earliest known spoken audio of endangered Louisiana Creole", "b": "The earliest spoken-word recordings of Louisiana Creole, a uniquely American language at risk of extinction, have been uncovered and analyzed for the first time, shedding light on a tongue that defined the docks and saloons of New Orleans for well over a century.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-rediscovered-reveal-earliest-spoken-audio.html", "ts": 1793384405.0}, {"t": "Drone-based AI system tracks cattle growth without stressful trips to scales", "b": "In beef cattle production, determining the ideal time to sell makes all the difference in a producer's costs. This is because, once an animal reaches its natural growth limit, it stops gaining weight significantly. From that point on, every additional day in a feedlot means spending money on feed without gaining meat in return.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-drone-based-ai-tracks-cattle.html", "ts": 1793384401.0}, {"t": "Q&A: Deep learning–enhanced air quality monitoring achieved using satellite data", "b": "A doctoral dissertation by Andrea Porcheddu, MSc in the field of Technical Physics will be examined at the Faculty of Science, Forestry and Technology, Kuopio campus.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-qa-deep-learningenhanced-air-quality.html", "ts": 1793383209.0}, {"t": "Global wildlife trade is twice previous species estimates, but major data gaps suggest true scale is even larger", "b": "More than 107,000 species are used and traded worldwide, more than double previous estimates, according to new research that suggests the true scale may be far greater due to major gaps in trade and wildlife collection data.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-global-wildlife-previous-species-major.html", "ts": 1793383201.0}, {"t": "The Guardian view on 50 years of The Selfish Gene: flawed, outdated, yet still a model of truly popular science writing | Editorial", "b": "Richard Dawkins’ first work has thrilled fans and frustrated critics for five decades. The science has moved on, but any writer looking to supplant its place must learn its lessons Richard Dawkins’ The Selfish Gene was not predicted to be a success. Its initial print run, published this week in 1976, was just 5,000. It went on to sell millions, and is perhaps the most influential work of pop-science ever. For 50 years, it has been the go-to resource for the layperson seeking to understand evolution. What accounts for its enduring power? Prof Dawkins’ central claim, that “we are survival machines – robot vehicles blindly programmed to preserve the selfish molecules known as genes” was provocative, stripping the messy stuff of human and other life down to a simple law. And yet the book is primarily concerned with proving that complex, selfless behaviour such as altruism in animals can emerge from these basic “selfish” drives, satisfyingly resolving an apparent paradox.", "s": "Science | The Guardian", "l": "https://www.theguardian.com/commentisfree/2026/oct/30/the-guardian-view-on-50-years-of-the-selfish-gene-flawed-outdated-yet-still-a-model-of-truly-popular-science-writing", "ts": 1793382967.0}, {"t": "The New DNA Technology That Linked Ted Bundy to a 52-Year-Old Cold Case", "b": "Software known as STRmix was instrumental in identifying Mr. Bundy’s DNA in a decades-old sample.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/29/science/dna-ted-bundy-cold-case.html", "ts": 1793382875.0}, {"t": "17th-century sleuths in the dock for witchcraft and wizardry", "b": "Magical versions of today's private investigators found themselves on the wrong side of the law in one English city some 400 years ago, according to research by a University of Southampton historian.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-17th-century-sleuths-dock-witchcraft.html", "ts": 1793382022.0}, {"t": "Ancient copper mine hints that Iberia played an important role in Bronze Age trade networks", "b": "Copper is essential for making bronze, which shaped tools, weapons and ornaments across Bronze Age Europe. While many Bronze Age mines have been identified throughout Europe, researchers are still trying to pin down which of them were most active at different times and how far their copper traveled. New research, published in the journal Antiquity, suggests that a series of mines in modern-day Spain and Portugal may have been an important source of copper in the Late Bronze Age, with some of that copper ending up as far away as Scandinavia.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-ancient-copper-hints-iberia-played.html", "ts": 1793382006.0}, {"t": "A gamma-ray powerhouse's smoking gun? Gas trail points to microquasar jets", "b": "In 2016, a binary star system emitting unusually strong gamma rays was discovered in our galactic neighborhood. Now, astronomers have found the smoking gun, or rather, a smoking trail of cool molecular gas that suggests jets emanating from a microquasar—one of the few known outside the Milky Way—are responsible.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-gamma-ray-powerhouse-gun-gas.html", "ts": 1793380818.0}, {"t": "The bonus that makes employees more committed", "b": "Offer your employees money to quit and the ones who say no will work harder as a result. Researchers at the University of Waterloo, Wilfrid Laurier University and McMaster University set out to test whether pay-to-quit programs work as intended. Their results confirmed they do and revealed a benefit that nobody anticipated.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-bonus-employees-committed.html", "ts": 1793380812.0}, {"t": "Different transcription systems shape chromatin behavior in distinct nuclear regions", "b": "Inside the cell nucleus, DNA is wrapped around histone proteins to form nucleosomes, which are further organized into chromatin. Chromatin has traditionally been divided into transcriptionally active euchromatin and relatively inactive heterochromatin. However, chromatin is not a fixed structure. Nucleosomes continuously move within the nucleus, and this motion is closely related to the physical organization and function of the genome.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-transcription-chromatin-behavior-distinct-nuclear.html", "ts": 1793379611.0}, {"t": "Companies' progress on climate reporting gets lost in the average", "b": "Companies are increasingly expected to explain the climate risks and how they are responding. CDP, formerly the Carbon Disclosure Project, is a nonprofit that collects and scores corporate environmental disclosures, including emissions data, climate risks and governance practices. How has CDP's average score changed year by year, and does that trend capture the progress of companies that have disclosed consistently for many years?", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-companies-climate-lost-average.html", "ts": 1793379608.0}, {"t": "As Picard on ‘Star Trek’, Patrick Stewart Influenced Generations of Scientists", "b": "Stewart’s iconic “Star Trek” character inspired astronomers and astronauts in countless ways: “You were the captain of my childhood,” one astrophysicist said.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/30/science/space/patrick-stewart-scientists-react.html", "ts": 1793375714.0}, {"t": "Attenborough-backed appeal secures £30m estate", "b": "The purchase of the vast Rothbury Estate by wildlife groups is hailed as \"something very special\".", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/ck79pj8zn3vwo?at_medium=RSS&at_campaign=rss", "ts": 1793373817.0}, {"t": "Fears for mature Scots Pines burned by huge Highland wildfire", "b": "Experts say some older Scot pine damaged by fire could die removing an important source of seeds", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqd09pv4l3k0o?at_medium=RSS&at_campaign=rss", "ts": 1793373137.0}, {"t": "Perfume bottle and child’s necklace among treasures found in Pompeii wardrobe", "b": "Archaeologists uncover jewellery, cosmetics and coins in cabinet sealed since eruption of Mount Vesuvius in AD79 Fragments of personal objects, from makeup tools and a perfume bottle to coins and a child’s necklace, have been found tucked away in a wooden wardrobe sealed off for almost 2,000 years in the ruins of Pompeii. The artifacts provide an intimate glimpse of daily life in the ancient Roman city before it was devastated by the eruption of Mount Vesuvius in AD79. The wardrobe was discovered in a room of a home on Via dell’Abbondanza, which was one of the most bustling streets in Pompeii. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/30/perfume-bottle-child-necklace-pompeii-wardrobe", "ts": 1793372799.0}, {"t": "Six dead after helicopter crashes in northern Indian state", "b": "The aircraft reportedly took off from the Hindu pilgrimage
