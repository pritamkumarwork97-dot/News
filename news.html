umbers recover. And yes, they like to swim.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/11/20/climate/van-cats-turkey.html", "ts": 1795264295.0}, {"t": "Sessions offer advice on rising energy costs", "b": "A council is urging people to seek support with rising energy costs on heating this winter.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmy49l3x893jo?at_medium=RSS&at_campaign=rss", "ts": 1795262989.0}, {"t": "YouTube faces $3 billion payout to US schools over claims of harming students' mental health", "b": "The platform has become deeply integrated into students' lives, both within and outside US classrooms. Google's Chromebook is also the most widely used laptop among students in the country.", "s": "mint - companies", "l": "https://www.livemint.com/companies/news/youtube-faces-3-billion-payout-to-us-schools-over-claims-of-harming-students-mental-health-11795258515140.html", "ts": 1795261122.0}, {"t": "PSU vs Private banks: Who is powering Nifty Bank's record-high rally after 5% surge? SBI, HDFC, AU, Canara target price", "b": "Banking stocks led the November market rally, with Nifty Bank rising around 16% month-to-date to a record intraday high of 64,485 on November 20. PSU and private bank indexes also advanced sharply, while brokerages cited healthy credit demand and robust lending pipelines.", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/psu-vs-private-banks-who-is-powering-nifty-banks-record-high-rally-after-5-surge-sbi-hdfc-au-canara-target-price-11795255387777.html", "ts": 1795260651.0}, {"t": "Gold, silver price crash: DSP Mutual Fund turns bullish on bullion, reveals new buying strategy; check price levels", "b": "Gold prices plunged to a 14-month low, recording their steepest weekly decline in eight months amid interest-rate concerns and an AI-stock selloff. DSP Mutual Fund is gradually buying gold and silver as prices fall, using predefined price levels rather than trying to predict a  segments of the population. For instance, if a job requires applicants to have earned a bachelor's or master's degree in a relevant subject, people without them may be excluded from the selection process, even if they have gained relevant skills through experience or professional training.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-degree-requirements-linked-higher-pay.html", "ts": 1795285201.0}, {"t": "Anthropic Mathematician Claims to Solve Riemann Hypothesis With Help From Claude", "b": "If confirmed, the proof of the Riemann hypothesis would cement the sense that A.I. might be capable of mastering any problem in the field.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/science/anthropic-ai-math-riemann-hypothesis.html", "ts": 1795279962.0}, {"t": "International UN talks on controlling use of autonomous weapons collapse", "b": "Week-long efforts fail to establish negotiating mandate on AI warfare after Russian ‘filibustering’ Week-long efforts to agree a negotiating mandate for a legally binding international treaty to control the use of autonomous weapons collapsed just before 5am after all-night talks failed to overcome Russian objections. Despite an overwhelming majority of states at the UN’s Convention on Certain Conventional Weapons (CCW) in Geneva wanting to agree a negotiating mandate leading to a legally binding treaty, the need for consensus forced the conference to adopt a much weaker option. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/technology/2026/nov/21/international-talks-control-ai-autonomous-weapons-collapse", "ts": 1795278971.0}, {"t": "Hormuz swim highlights environmental cost of war", "b": "Ocean campaigner Lewis Pugh completes Hormuz challenge and warns of lasting environmental damage.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c95y1gr27xplo?at_medium=RSS&at_campaign=rss", "ts": 1795277551.0}, {"t": "Babies in ancient Greek colony started solid food at 3 months but nursed for nearly 4 years, chemical signatures suggest", "b": "Over 2,500 years ago, Himera was a Greek colony inhabited by local Sicilians, Phoenicians and Greeks. Despite their diverse cultural backgrounds, they all shared one thing: they began weaning their babies early and continued for a long time.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-babies-ancient-greek-colony-solid.html", "ts": 1795275602.0}, {"t": "Time may be far stranger than we realize. Scientists have a way to test it", "b": "Time may be far stranger than we realize, and scientists have proposed a way to detect clocks experiencing multiple flows of time simultaneously. Using atomic clocks with dramatically enhanced sensitivity, researchers hope to reveal a never-before-observed quantum effect that could transform our understanding of time and gravity.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261120075558.htm", "ts": 1795273786.0}, {"t": "A giant star swallowed another star. James Webb reveals the aftermath", "b": "Astronomers have witnessed a spectacular cosmic collision in the Andromeda galaxy, where a small star spiraled into a giant star 18,000 times brighter than the Sun, triggering a violent eruption. NASA’s James Webb Space Telescope captured the aftermath just 47 days later, revealing new details about how two stars can merge into one.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261120075556.htm", "ts": 1795272820.0}, {"t": "Who was buried in Westminster Abbey's Roman coffin? A 150-year mystery may be solved", "b": "A mysterious skeleton discovered in a Roman sarcophagus at Westminster Abbey may finally be identified after more than 150 years. New dating evidence suggests the remains belonged to a high-ranking medieval abbot who was buried inside a centuries-old recycled Roman coffin.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261119194553.htm", "ts": 1795271139.0}, {"t": "A 50-year-old theory about evolution may have been wrong all along", "b": "A decades-old theory suggesting that evolution protects its most important genes from mutations has been dealt a major blow. An extensive new analysis of mutations in bacteria and yeast found no evidence that essential genes mutate less frequently than other genes. Researchers say earlier studies may have been misled by harmful mutations that disappeared through natural selection before scientists could detect them.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261119194538.htm", "ts": 1795269975.0}, {"t": "An ancient failed rift is reawakening inside one of Africa's oldest landmasses", "b": "In April 2017, a magnitude 6.5 earthquake shook southern Africa from an unlikely place: the middle of the Kalahari Craton in eastern Botswana. Cratons are the ancient cores of continents, and this one is built from blocks of crust up to 3.7 billion years old. Geologists have long considered such regions too cold, too thick and too rigid to tear apart.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-ancient-rift-reawakening-africa-oldest.html", "ts": 1795269606.0}, {"t": "Even scientists can't agree on what science actually is", "b": "Scientists cannot agree on what science actually is, and a new study finds their views are surprisingly more divided than those of the general public. The findings could help explain public frustration with scientific uncertainty and raise questions about how artificial intelligence might reshape future discoveries.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261119194541.htm", "ts": 1795269311.0}, {"t": "Scientists say the human family tree may need a radical rewrite", "b": "The human family tree may need a major overhaul. New research from Monash University challenges the traditional classification of our ancient ancestors, arguing that species such as Australopithecus and Paranthropus should be grouped within our own genus, Homo. As scientists uncover more fossils and analyze evolutionary relationships, the boundaries that once separated these ancient relatives are becoming increasingly difficult to defend.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261118074039.htm", "ts": 1795268695.0}, {"t": "Fermi's 14-year all-sky map bridges astronomy's elusive 'MeV gap'", "b": "Gamma rays, the most high-energy type of electromagnetic radiation in the universe, have always had a blind spot. We've always had trouble measuring them in the \"megaelectronvolt\" (MeV) energy range, which astronomers have taken to calling the \"MeV gap.\" But a new paper from an international group of scientists working with the Fermi Large Area Telescope (LAT) Collaboration, recently published in The Astrophysical Journal Supplement Series, takes a stab at closing that gap by identifying 450 cosmic sources in the 20–200 MeV range, providing the clearest view of low-energy gamma rays ever.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fermi-year-sky-bridges-astronomy.html", "ts": 1795266010.0}, {"t": "Chinese-Born Neuroscientist Is Detained by ICE While Traveling From Conference", "b": "Eva Yi Xie was detained on her way back to New Jersey from a neuroscience conference in Washington this week, the latest in a string of researcher arrests.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/science/chinese-scientist-detained-ice-princeton-eva-yi-xie-.html", "ts": 1795265585.0}, {"t": "Turkey’s Van Cats Contend With Rising Temperatures", "b": "A feline research center in Turkey uses air-conditioning and pools to keep residents comfortable as their numbers recover. And yes, they like to swim.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/climate/van-cats-turkey.html", "ts": 1795264295.0}, {"t": "How red squirrels made island their home", "b": "Conservationists say that, with red squirrels dwindling in the UK, Jersey is an \"important refuge\".", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c61k9mwxmplxo?at_medium=RSS&at_campaign=rss", "ts": 1795263535.0}, {"t": "From screens in class to smart glasses, Norway rethinks new technologies", "b": "Three years ago, a schoolteacher in Norway was reprimanded for putting his pupils' iPads aside to return to pen and paper. Now, the whole country is rethinking its approach to new technologies.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-screens-class-smart-glasses-norway.html", "ts": 1795256416.0}, {"t": "A New Era of A.I.-Driven Chaos? That Might Just Be Progress.", "b": "If artificial intelligence is giving rise to outages, cyberattacks and more, it’s consistent with history, in that it shows how new innovations often set off calamitous failure before they make life better.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/21/science/outages-tech-history.html", "ts": 1795255330.0}, {"t": "New Ph.D. Enrollment in the Sciences Dropped 10 Percent Under Trump", "b": "Falling international enrollment drove most of the decline, but there were also fewer American students starting doctoral programs in 2025.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/us/phd-enrollment-sciences-declines.html", "ts": 1795247247.0}, {"t": "CCMB team identifies genes that spur nerve repair, raise possibility of paralysis treatment", "b": "CCMB team identifies genes that spur nerve repair, raise possibility of paralysis treatment", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/cities/Hyderabad/ccmb-team-identifies-genes-that-spur-nerve-repair/article71724538.ece", "ts": 1795244676.0}, {"t": "Beating Ebola takes more than medicine – I saw what worked in west Africa a decade ago | Kayode Akintola", "b": "The outbreak in DR Congo is shaping up to be the worst ever, but the support of local faith leaders – and adequate funding – will be needed to bring it under control Ebola is terrifying: I know, because I lived through the world’s worst outbreak of the disease . That was in west Africa between 2013 and 2016, when anyone infected by the virus had a nearly 40% chance of dying . There were 28,600 cases and 11,300 deaths then. Now a rare strain of Ebola is spreading in the eastern Democratic Republic of the Congo, much more quickly than a decade ago in Sierra Leone, Liberia and neighbouring countries. It is the 17th outbreak in DR Congo and already its worst, with more than 5,000 deaths . The UN is warning that the spread of the disease is outstripping the response, and it is widely expected to become the worst Ebola outbreak in history. There is no proven vaccine or treatment yet for the Bundibugyo variant; almost 50% of those infected have died . Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/global-development/2026/nov/21/ebola-outbreak-congo-worst-ever", "ts": 1795240853.0}, {"t": "‘All human, no AI’ Riemann hypothesis proof out on same day as Claude’s claim", "b": "‘We are still here. We are very much alive. We are not going anywhere,’ mathematician Alessandro Masullo wrote in his paper detailing his efforts to crack mathematics’s greatest unsolved problem", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/all-human-no-ai-riemann-hypothesis-proof-out-on-same-day-as-claudes-claim/article71727336.ece", "ts": 1795239178.0}, {"t": "AI cracks math’s most famous problem. Have mathematicians lost a guiding light?", "b": "Levent Alpöge of Anthropic has announced that he and the company’s AI model Claude have found a proof of the Riemann hypothesis, which concerns the distribution of prime numbers. Mathematicians have spent more than 160 years trying to prove it", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/anthropic-scientist-claims-proof-of-maths-most-famous-problem-with-ai-help/article71727161.ece", "ts": 1795234971.0}, {"t": "What makes rock deep beneath continents break away and sink?", "b": "We usually picture mountain building as rock being pushed upward. But deep beneath some mountain belts and volcanic arcs, the opposite can happen: dense rock at the base of the crust can become unstable, break away and sink hundreds of kilometers into the mantle, dragging part of the rigid outer shell of the Earth (the lithosphere) with it. Seismic images suggest that this process, known as lithospheric dripping, has occurred beneath the central Andes and California's Sierra Nevada.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-deep-beneath-continents.html", "ts": 1795234801.0}, {"t": "Device that measures strawberry skin's strength will aid breeders", "b": "Resilient strawberry varieties will be more easily identifiable thanks to a tool developed by University of Queensland engineering students. The prototype measures the strength of strawberry skin, a key breeding consideration for the Australian Strawberry Breeding Program at Queensland's Department of Primary Industries.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-device-strawberry-skin-strength-aid.html", "ts": 1795232401.0}, {"t": "Quantum software matches classical benchmark for a molecular interaction", "b": "Predicting how molecules interact is central to drug discovery: it offers important information about how a new drug might work in the human body, the side effects it can cause and more. Computationally modeling these interactions can reduce the need for lengthy and expensive lab work, but some interactions still remain beyond the reach of classical computers.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-quantum-software-classical-benchmark-molecular.html", "ts": 1795230001.0}, {"t": "After 8 years in space, a groundbreaking X-ray telescope finally opens its eyes", "b": "After eight years and 10 billion kilometers in space, a groundbreaking X-ray telescope heading to Mercury has captured its first cosmic observations and is performing even better than scientists expected. The instrument could soon reveal Mercury's hidden chemical secrets and transform our understanding of how the solar system's smallest planet formed.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261120075547.htm", "ts": 1795227074.0}, {"t": "The call of the seamount: Two new armored tardigrades described in the Atlantic", "b": "An international team led by researchers from Senckenberg am Meer in Wilhelmshaven has described two new species of marine tardigrades. The tiny marine organisms were discovered in the sediment of the Senghor Seamount off the coast of Cape Verde. According to the researchers, the discovery underscores the role of undersea mountains as oases of biodiversity. The study, which includes comprehensive taxonomic descriptions of the new species, has been published in the journal \"ZooKeys.\"", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-seamount-armored-tardigrades-atlantic.html", "ts": 1795226401.0}, {"t": "Marsha Linehan Has Died. She Transformed Treatment for Personality Disorder.", "b": "After her methods proved effective, she revealed that she had battled her own borderline personality disorder as a child.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/19/well/mind/marsha-linehan-dead.html", "ts": 1795224504.0}, {"t": "Broadening the role of RNA: A messenger, a mediator and now a condensate coordinator", "b": "New research about condensates—cellular compartments that act as hubs for facilitating biological reactions—continues to reveal novel insights into how cells function. Among those continuing to push the field forward are members of the Marine Biological Laboratory's condensate consortium, including Amy Gladfelter, a professor at Duke University and current co-director of the MBL physiology course, and former MBL physiology course student and past MBL Whitman fellow Dragomir Milovanovic, a professor at the Charité Berlin University Institute of Biochemistry.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-broadening-role-rna-messenger-condensate.html", "ts": 1795221601.0}, {"t": "Birds killed in blaze at one of the largest foie gras farms in the US", "b": "Hundreds of young birds were also rescued from the fire, which comes as foie gras is under renewed scrutiny over animal welfare concerns.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cq4gn0dg9194o?at_medium=RSS&at_campaign=rss", "ts": 1795215446.0}, {"t": "'Forever' chemicals? Don't be so sure, says engineer", "b": "Inside the disinfection room of Baltimore's Ashburton water filtration plant, 14 University of Maryland students clad in hard hats peered up at six towering vats of bleach used to treat water that flows from the distant Liberty Reservoir into the facility, killing bacteria and other pathogens before it's routed to the region's kitchen sinks.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-chemicals-dont.html", "ts": 1795214402.0}, {"t": "A fish as old as Montana—the blue sucker discovered to live well over 100 years", "b": "Using bomb radiocarbon dating on microscopic otoliths (earstones), researchers have found that a native species of fish in the Upper Missouri River in Montana is living up to 130 years—more than triple the previous estimate of around 40 years—and some blue suckers alive today hatched in the late 1800s, around the dawn of the automobile and when Montana officially became a state.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fish-montana-blue-sucker-years.html", "ts": 1795213206.0}, {"t": "Caribbean corals are in crisis. Fossil reefs can help point to where corals may persist", "b": "The fossilized remains of ancient coral reefs often sit just meters from living corals in the Caribbean, where reefs have declined sharply over the past 70 years. Those fossils could help show where corals might survive a warming future. In two new papers, researchers at The University of Texas at Austin identify which coral species dominated ancient reefs in northeastern Jamaica and suggest how that record could guide reef rehabilitation.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-caribbean-corals-crisis-fossil-reefs.html", "ts": 1795212001.0}, {"t": "The Race to Build a Quantum Computer Has Become a Sprint", "b": "A rising technology based on “neutral atoms” has accelerated the competition — prompting many experts to believe that a usable machine could arrive this decade.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/science/quantum-computer-neutral-atoms.html", "ts": 1795211166.0}, {"t": "H.I.V. Research Networks May Again Seek Federal Funding, With a Twist", "b": "The Trump administration restarted the process for funding four large research networks after postponing it earlier this year.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/science/hiv-research-funding-nih.html", "ts": 1795210902.0}, {"t": "Ancient bison hunting site in Texas challenges long-held assumptions", "b": "For decades, archaeologists questioned whether Native American communities in the Southern Plains hunted bison by driving herds over cliffs, a sophisticated technique widely documented farther north.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-ancient-bison-site-texas-held.html", "ts": 1795210802.0}, {"t": "Scientists discover twist-tunable interlayer excitons in atomically thin anisotropic semiconductors", "b": "When light shines on a semiconductor, negatively charged electrons and positively charged holes—empty states left behind when electrons move away—pair up and bind together. This bound state is called an exciton. When two atomically thin semiconductor layers are stacked, electrons and holes can reside in different layers, forming what is known as an interlayer exciton (IE).", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-scientists-tunable-interlayer-excitons-atomically.html", "ts": 1795209608.0}, {"t": "Gamified mobile payment features may drive adoption among Gen-Z users", "b": "Gamified features in mobile payment applications may significantly increase adoption among consumers in emerging economies, with men and women responding in almost identical ways, according to research published in the International Journal of Business Information Systems.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-gamified-mobile-payment-features-gen.html", "ts": 1795208405.0}, {"t": "Record-setting X-ray laser reliably generates flashes with wavelengths shorter than distances between atoms", "b": "Researchers from DESY and European XFEL have demonstrated reliable production and transport of X-ray laser flashes with a wavelength of about 0.04 nanometers (or a photon energy of 30,000 electronvolts) at European XFEL, raising their own world record. This means that the X-ray's wavelength is much shorter than typical distances between neighboring atoms in solids, which enables the study of materials with higher spatial resolution than before.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-ray-laser-reliably-generates-wavelengths.html", "ts": 1795208401.0}, {"t": "After 49 Years, Voyager 1 Is a Mind-Blowing One Light-Day From Earth", "b": "Launched in 1977, the hardy spacecraft is still sending messages back home from a staggering distance in interstellar space.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/18/science/nasa-voyager-1-earth-light-day.html", "ts": 1795207505.0}, {"t": "Digital imaging workshop aims to reveal secrets in medieval manuscripts", "b": "Researchers recently used multispectral imaging technology to try to uncover hidden information from medieval manuscripts at the Rare Book and Manuscript Library at the University of Illinois Urbana-Champaign. The library hosted a digital imaging workshop in early October that served as a pilot study for how the technology can help analyze fragile, centuries-old documents.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-digital-imaging-workshop-aims-reveal.html", "ts": 1795207209.0}, {"t": "New hemp plant produces no detectable THC, potentially reducing risk of crop destruction", "b": "Scientists at Texas A&M AgriLife Research, a member of The Texas A&M University System, have developed a hemp plant that produces no detectable cannabinoids, including THC.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-hemp-thc-potentially-crop-destruction.html", "ts": 1795207201.0}, {"t": "Tested on mushrooms, an AI model shows potential for detecting crop stress with far fewer computations", "b": "A new artificial intelligence (AI) model can detect stress in agricultural crops using a nondestructive imaging technique, allowing changes in crop health to be monitored over time. Developed by a team of researchers at Penn State, the new model shows promise for accurately detecting crop stress caused by drought, disease, nutrient deficiency and other causes while using less computing power than some existing AI methods.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-mushrooms-ai-potential-crop-stress.html", "ts": 1795206011.0}, {"t": "Can Instagram reduce prejudice? Study reveals the potential and limits of social media contact", "b": "A research team at the University of Potsdam has conducted a field experiment to investigate whether contact through social media can reduce prejudice. The findings suggest that following an unfamiliar Instagram profile for just three days can lead to more favorable attitudes—not only toward the group represented by the profile. The study was published in the Journal of the Association for Information Systems.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-instagram-prejudice-reveals-potential-limits.html", "ts": 1795206009.0}, {"t": "A million tiny crystals reveal how semiconductors form distinct cores and shells", "b": "Perovskites and related materials called perovskitoids are promising semiconductor materials for solar cells, LEDs and light detectors. Their ingredients and internal crystal structures determine how they absorb and emit light. A chip just 2 centimeters across can hold roughly a million tiny crystals—becoming a miniature material library that can show how some mixtures separate into distinct cores and shells, changing the light they absorb.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-million-tiny-crystals-reveal-semiconductors.html", "ts": 1795204811.0}, {"t": "Hazardous glacial lakes need reservoir-style safety oversight, says researcher", "b": "As the climate warms, thousands of glacial lakes are growing behind potentially unstable natural dams. Despite the potential risk of flooding to communities downstream, these lakes remain outside formal safety regulation.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-hazardous-glacial-lakes-reservoir-style.html", "ts": 1795204806.0}, {"t": "People wade through floodwater because they underestimate danger—how to avoid risk", "b": "A footpath home disappears beneath brown water. The other side is only a few meters away and someone has already crossed. Turning back means a long detour and you will be late. Would you wade through? This is the kind of everyday decision that flood safety advice must address.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-people-wade-floodwater-underestimate-danger.html", "ts": 1795203606.0}, {"t": "Global analysis reveals how lakes amplify glacier ice loss", "b": "Glacial lakes can accelerate the retreat of glaciers. If glaciers border a lake, the water can melt the ice from underneath; furthermore, chunks of ice can break off and fall into the lake. The extent to which these processes influence the situation, compared with other factors, had not been sufficiently clarified at a global level until now.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-global-analysis-reveals-lakes-amplify.html", "ts": 1795203601.0}, {"t": "X-ray technique advances temperature measurements under extreme pressure", "b": "Scientists at Lawrence Livermore National Laboratory (LLNL) have advanced the ability to measure temperatures in materials subjected to extreme pressures at the National Ignition Facility (NIF), providing new insights into how materials behave under conditions relevant to national security and high-energy-density physics.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-ray-technique-advances-temperature-extreme.html", "ts": 1795202406.0}]},DATE="21 November 2026",cats=Object.keys(D);let cat=cats[0],i=0,sx=0;
