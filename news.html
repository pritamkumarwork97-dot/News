e Tata Group and functioning under the Tamil Nadu government, Titan encompasses various lifestyle brands.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/bonds/titan-redeems-rs-1000-crore-commercial-paper/articleshow/135050383.cms", "ts": 1792417872.0}, {"t": "Yes Bank CET1 may fall to 10% if past AT1 coupons are paid: Crisil", "b": "Yes Bank faces a potential decline in core equity capital, projected to fall to around 10% due to accumulated coupon payments on AT1 bonds. Crisil Ratings highlighted a significant liability impact estimated at Rs 6,200 crore, while S&P Global Ratings foresees a reduction in common equity by about Rs 8,400 crore. Despite these concerns, both agencies believe the bank's credit profile will remain stable.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/bonds/yes-bank-cet1-may-fall-to-10-if-past-at1-coupons-are-paid-crisil/articleshow/135059116.cms", "ts": 1792417823.0}, {"t": "Piramal Finance Q2 net profit soars 67% to Rs 545 crore", "b": "Piramal Finance’s assets under management grew 24% to Rs 1.13 lakh crore, led by a 30% rise in retail AUM. Net interest income increased 35%, while its net interest margin expanded 35 basis points to 6.5%.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/earnings/piramal-finance-q2-net-profit-soars-67-to-rs-545-crore/articleshow/135050351.cms", "ts": 1792417775.0}, {"t": "PC Jeweller among 8 stocks that hit 52-week high and rallied up to 42% in a month", "b": "The Sensex plunged 876 points to close at 73,852, even as eight BSE 1000 stocks touched fresh 52-week highs. PC Jeweller led monthly gains at 42%, followed by Sky Gold and Diamonds at 31%, highlighting divergent stock performance.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/news/pc-jeweller-among-8-stocks-that-hit-52-week-high-and-rallied-up-to-42-in-a-month/slideshow/135050343.cms", "ts": cientists discovered that the disaster was preceded by several warning signs, including rapid glacier retreat, heavy rainfall, and thousands of tiny seismic tremors. As glaciers retreat, similar disasters could become a growing danger in mountainous coastal regions.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018205047.htm", "ts": 1792415358.0}, {"t": "Why some people escape Alzheimer’s despite carrying a high-risk gene", "b": "Scientists have discovered why some people with a high genetic risk of Alzheimer’s remain mentally sharp into their 80s, uncovering a rare mutation that protects the brain from harmful protein buildup. The findings reveal a potential new way to prevent early brain damage and could pave the way for treatments that mimic this natural defense.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018205044.htm", "ts": 1792414622.0}, {"t": "How Did Life Arise? Three Turning Points in Early Evolution", "b": "Where did it start? How did it grow complex? Why did it get big? Three moments in Earth’s early history when evolution suddenly, inexplicably turned up the dial.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/19/science/evolution-life-earth.html", "ts": 1792414586.0}, {"t": "Something strange is happening beneath a volcano near 2 million people", "b": "Scientists have discovered evidence of two hidden magma sources beneath Nicaragua’s Masaya volcano, where satellite observations revealed mysterious ground movements suggesting magma is shifting deep underground. The findings could improve eruption forecasting for the active volcano, which sits near 2 million people and attracts tourists to its spectacular lava lake.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018205039.htm", "ts": 1792413309.0}, {"t": "‘Turtle Walker’: Zoya Akhtar-backed documentary pays tribute to Satish Bhaskar’s life and legacy", "b": "The film is a stunning deep dive into the life of turtle conservationist Satish Bhaskar, who walked nearly every inch of India’s coastline to discover the nesting beaches of sea turtles so that they could be protected", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/life-and-style/turtle-walker-zoya-akhtar-taira-malaney-satish-bhaskar-animal-planet-documentary-india-epic-wild-stories/article71599741.ece", "ts": 1792412115.0}, {"t": "Just 3,000 steps a day may help slow Alzheimer's, scientists find", "b": "Walking just 3,000 steps a day could help slow Alzheimer’s-related brain changes, according to new research. Scientists discovered that physical activity was linked to less buildup of harmful tau proteins and nearly half the cognitive and functional decline, even in people already showing early signs of the disease. The strongest benefits appeared at 5,000 to 7,500 daily steps, suggesting that the popular 10,000-step goal may not be necessary.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018205058.htm", "ts": 1792409006.0}, {"t": "A simple touch can bring dying corals back to life in just 7 weeks", "b": "Scientists have discovered that severely bleached corals can make a remarkable comeback simply by touching healthy, genetically identical corals. In laboratory experiments, dying corals regained their color and fully recovered within seven weeks, with as little as five days of contact sometimes enough to start the healing process.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230025.htm", "ts": 1792407952.0}, {"t": "What to Know About the Search for Amelia Earhart’s Plane", "b": "A satellite image sent researchers to a remote Pacific atoll, but their findings brought no resolution to the decades-old search. Here’s what to know.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/19/world/asia/amelia-earhart-plane-search-explained.html", "ts": 1792406840.0}, {"t": "Astronomers discover a ghostly green star unlike any known before", "b": "Astronomers have uncovered a surprising rainbow of dead stars, including the first known star that would appear genuinely green to human eyes. Researchers found that white dwarfs can glow in unexpected shades of pink, purple, yellow, and cyan because of unusual chemical interactions in their extremely dense atmospheres.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261017230018.htm", "ts": 1792405563.0}, {"t": "Scientists win 2026 Nobel Prize for controlling brain cells with light", "b": "A discovery in tiny algae led to a Nobel Prize-winning breakthrough that allows scientists to switch brain cells on and off using light. The revolutionary technique has already helped researchers activate memories and is opening new possibilities for restoring vision and treating brain disorders.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018205037.htm", "ts": 1792404152.0}, {"t": "Musk and Anthropic pledge public share giveaways", "b": "Musk's announcement comes after Anthropic pledged to create a public benefit fund ahead of its blockbuster stock market listing.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cm2kez327gdko?at_medium=RSS&at_campaign=rss", "ts": 1792402705.0}, {"t": "\"Mind-blowing\" Alzheimer’s breakthrough: Two hours of sleep restored without clearing brain plaques", "b": "Scientists have uncovered an unexpected culprit behind sleep loss in Alzheimer’s disease: overactive immune cells in the brain. By temporarily removing these cells, researchers restored more than two hours of sleep per day in mice, revealing a promising new target for treatment.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261018084421.htm", "ts": 1792401585.0}, {"t": "Government asks Meta
