ge as the context does.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/science/quantum-contextuality.html", "ts": 1795168957.0}, {"t": "Mercury Is a Mystery. An International Mission Aims to Solve It.", "b": "BepiColombo is about to become the second spacecraft in history to orbit the planet closest to the sun.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/20/science/mercury-bepi-colombo-orbit.html", "ts": 1795168844.0}, {"t": "Pill to treat pancreatic cancer hailed as ‘biggest breakthrough in decades’", "b": "Cancer undetectable for one in 12 patients in daraxonrasib trial, while nearly all participants’ tumours stopped growing A pill that can shrink and potentially eliminate pancreas tumours is being hailed as the biggest breakthrough treatment for the cancer in decades. In one in 12 of the patients given the drug, daraxonrasib , during a trial, the cancer became undetectable, and the tumours stopped growing in almost all of the 61 patients. The trial participants had recently been diagnosed with advanced pancreatic cancer that had spread to other parts of the body. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/society/2026/nov/20/pill-pancreatic-cancer-breakthrough-daraxonrasib", "ts": 1795167370.0}, {"t": "Wildlife conservation cash targets ex-colliery sites", "b": "The project aims to create and restore habitats for amphibians and lizards at sites in Yorkshire.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmx2785nzpw2o?at_medium=RSS&at_campaign=rss", "ts": 1795155710.0}, {"t": "Mysterious Mercury is about to get a visitor - after spacecraft's eight-year epic voyage", "b": "The mission is set to give us our best ever view of Mercury - the closest planet to the Sun.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c39w9l4v1p9ro?at_medium=RSS&at_campaign=rss", "ts": 1795154396.0}, {"t": "Two massive stars may be secretly feeding the Milky Way’s supermassive black
