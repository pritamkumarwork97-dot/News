my | The Hindu", "l": "https://www.thehindu.com/business/markets/indias-forex-reserves-drop-by-269-bn-to-717-bn/article71674389.ece", "ts": 1793973369.0}], "Science": [{"t": "Noise pollution changes biology or behavior in 80% of animal species studied", "b": "We live in a noisy world. Whether it is the roar of traffic, the rumble of ships or the hum of heavy industry, there is often no escaping noise unless you are a hermit on a desert island.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-noise-pollution-biology-behavior-animal.html", "ts": 1793989204.0}, {"t": "The worse climate change gets, the harder it becomes to stop it", "b": "This year may be seen as a turning point in the climate crisis. The U.N. has accepted that global warming is going to exceed 1.5°C, while climate scientists have concluded that the rate of warming has effectively doubled over the past decade.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-worse-climate-harder.html", "ts": 1793989201.0}, {"t": "SynFit guides enzyme engineering by balancing several useful traits at once", "b": "Enzymes are biology's tiny chemists. They help build, break and rearrange molecules quickly and precisely. In the lab, scientists have long put enzymes to work making useful chemicals. But nature's enzymes cannot do every reaction a researcher might want. Sometimes scientists need an enzyme to take on a job it did not evolve to do. That's where enzyme engineering comes in—researchers make changes to an enzyme, test how those changes affect what the enzyme does and look for versions that work better.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-synfit-enzyme-traits.html", "ts": 1793988003.0}, {"t": "'I heard a barnacle'—how paying attention to nature's background noise can reveal animal secrets", "b": "During four days on Washington's Olympic Peninsula, I saw an Olympic marmot, a species found nowhere else on Earth; four bumblebee species working the same lavender plant; three western hermit crab species new to me; and five orcas slicing through the dark water off Ediz Hook. Any one of them could have been the trip's highlight.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-heard-barnacle-paying-attention-nature.html", "ts": 1793988001.0}, {"t": "Vibrating mirrors of light create analog of a black hole event horizon", "b": "Optical cavities are pairs of light-trapping mirrors and underpin the operation of lasers, atomic clocks and many types of precision sensors. If the distance between the mirrors is changed rapidly enough, some theories predict that the waves inside them should bunch together into short, intense pulses. So far, however, this prediction has never been tested directly.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-vibrating-mirrors-analog-black-hole.html", "ts": 1793986811.0}, {"t": "The John Lewis Christmas ad captures the deep need for grandmothers", "b": "Like many of us, I always enjoy the John Lewis Christmas ad and 2026 is no different. This year, I love the fact that the star of the show is a grandmother.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-john-lewis-christmas-ad-captures.html", "ts": 1793986806.0}, {"t": "Atom-scale model could help improve material growth for advanced electronics", "b": "Penn State researchers have refined an atom-scale model of how silicon carbide changes from a solid into vapor during crystal growth, work that could help manufacturers produce higher-quality material for advanced electronics while reducing costly trial-and-error experiments.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-atom-scale-material-growth-advanced.html", "ts": 1793985607.0}, {"t": "States tax sports betting heavily, but gamblers may barely feel it", "b": "Sports betting has grown explosively since 2018, when a U.S. Supreme Court ruling struck down a federal ban on it. Now, Americans wager more than $165 billion on sports annually, contributing to an industry larger than state-run lotteries even excluding prediction markets such as Kalshi and Polymarket.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-states-tax-sports-heavily-gamblers.html", "ts": 1793985601.0}, {"t": "Scientists achieve record-breaking low temperature on China's space station, paving the way for new physics experiments", "b": "Matter starts to behave differently at extremely low temperatures, creating conditions ideal for studying quantum physics and new states of matter. Now, researchers from China have achieved a new low-temperature record aboard their Tiangong space station. Their research, recently published in Science, might lead to a new generation of experiments in quantum physics and precision measurements in space.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-scientists-temperature-china-space-station.html", "ts": 1793984417.0}, {"t": "Evolutionary history and genetic basis of spruce diversification revealed", "b": "The genus Picea (spruce) is widely distributed across the Northern Hemisphere and is a dominant component of boreal and montane forests. Understanding the evolutionary processes that have shaped diversification and regional differentiation across the genus requires a well-resolved phylogeny of Picea. However, the evolutionary history of Picea has long been obscure due to conflicting genetic signals.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-evolutionary-history-genetic-basis-spruce.html", "ts": 1793984401.0}, {"t": "How climate change worsens heatwaves, droughts, wildfires and floods", "b": "Rising global temperatures mean extreme weather events are becoming more common and more intense.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cy4dgp1p3p1o?at_medium=RSS&at_campaign=rss", "ts": 1793983410.0}, {"t": "A really simple guide to climate change", "b": "Human activities are causing the world to heat up, posing serious threats to people and nature.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c9w15nggj58o?at_medium=RSS&at_campaign=rss", "ts": 1793983251.0}, {"t": "Researchers establish G0 founder population carrying targeted mutations in marine mollusks", "b": "Although genome-editing-based breeding has advanced rapidly in aquaculture, progress in marine mollusks has lagged behind. The main challenge is not genome editing itself, but rather rearing the few edited larvae through metamorphosis to establish a viable G0 founder population.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-g0-founder-population-mutations-marine.html", "ts": 1793983212.0}, {"t": "What is the Paris Agreement and why does 1.5C matter?", "b": "The 2015 pact is at the heart of the international commitment to tackle rising global temperatures.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c93d59d4zy1o?at_medium=RSS&at_campaign=rss", "ts": 1793983147.0}, {"t": "What is net zero and is the UK on track to achieve it?", "b": "Reaching net zero carbon emissions worldwide is essential to limit global warming, UN scientists say.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cx238yyr40qo?at_medium=RSS&at_campaign=rss", "ts": 1793982171.0}, {"t": "What a Democratic Congress Could Mean for Science", "b": "The Trump administration has sought to reshape the nation’s research infrastructure. Democratic lawmakers, newly empowered, are preparing to push back.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/06/science/science-democrats-congress-election.html", "ts": 1793981148.0}, {"t": "Wales scraps controversial Uganda tree-planting scheme", "b": "The Welsh government has given more than £4m to the scheme since 2015, but will end it due to budget pressures.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqm26m2l4p7eo?at_medium=RSS&at_campaign=rss", "ts": 1793978864.0}, {"t": "US rockets firm eyes up mothballed Highland spaceport", "b": "Colorado-based Leap is looking at the spaceport near Tongue as its first launch site outside of the US.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmrlyy5xw276o?at_medium=RSS&at_campaign=rss", "ts": 1793969243.0}, {"t": "Scientists just found dinosaur blood that survived 115 million years", "b": "Scientists have discovered chemically confirmed traces of ancient blood inside 115-million-year-old dinosaur bones, challenging assumptions about how long biological molecules can survive. The extraordinary preservation could unlock new clues about dinosaur physiology and even help scientists search for ancient life elsewhere in the universe.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261105224542.htm", "ts": 1793964481.0}, {"t": "Is ‘ferritin face’ real? Why your iron levels might be low - video", "b": "Social media is awash with claims iron deficiency can be identified in the mirror by dark circles, breaking hair and dry skin. But is ‘ferritin face’ real? Madeleine Finlay tells Ian Sample why so many of us struggle to keep our iron levels up, how we can actually diagnose low iron and the best way to correct a deficiency, with help from Hal Drakesmith, a professor of iron biology at Oxford University, and advice from Dr Sue Pavord, a consultant haematologist at Oxford university hospitals and associate senior lecturer in clinical medicine at St Edmund Hall. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/video/2026/nov/06/is-ferritin-face-real-why-your-iron-levels-might-be-low-video", "ts": 1793962446.0}, {"t": "Could you live on a remote island as a job?", "b": "The new manager will start each workday surrounded by nature at the island wildlife reserve.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/c6kg77jqpwk2o?at_medium=RSS&at_campaign=rss", "ts": 1793960058.0}, {"t": "How A.I. Just Blew Up a Key Tenet of Computer Science", "b": "A longstanding hypothesis held that some problems would always be hard for computers to solve quickly. But OpenAI disproved it — raising the possibility of radical new efficiencies.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/06/science/ai-exponential-time-hypothesis.html", "ts": 1793959326.0}, {"t": "Disaster-Prone Communities Face Cuts and Slowdowns in Federal Help", "b": "The Trump administration is scaling back or stalling investments that help vulnerable places harden themselves to rising flood and fire threats.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/06/climate/fema-grants-cuts-resilience.html", "ts": 1793959245.0}, {"t": "Five-inch-long beetle larvae are quietly destroying blueberry roots", "b": "Scientists have solved a mystery surrounding destructive beetles attacking blueberry bushes in North Carolina, identifying a species whose massive larvae can grow up to five inches long and destroy plant roots. Although farmers have reported damage for more than a decade, the insects responsible remained unidentified until researchers used DNA analysis to uncover the culprit.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261103003200.htm", "ts": 1793957616.0}, {"t": "Don't miss: Meteor showers, fireballs, and a supermoon light up November's night sky", "b": "November's night sky is packed with celestial wonders, from bright meteor fireballs and a close pairing of Mars and Jupiter to a spectacular supermoon. Meanwhile, NASA's Voyager 1 is making history by becoming the first spacecraft to reach a distance of one light-day from Earth.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261105224547.htm", "ts": 1793953268.0}, {"t": "NASA’s Swift telescope falls to Earth after nearly 22 years in space", "b": "After nearly 22 years of exploring the universe’s most violent explosions, NASA’s Swift Observatory has re-entered Earth’s atmosphere over Indonesia. Originally designed to last just two years, the pioneering space telescope transformed our understanding of black holes, exploding stars, and mysterious cosmic outbursts.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261105224545.htm", "ts": 1793949175.0}, {"t": "'Extra special' tamarin twins born at zoo", "b": "Shaldon Wildlife Trust says it is one of two European zoos to breed the species in 2026.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cmx23zzlezp8o?at_medium=RSS&at_campaign=rss", "ts": 1793945718.0}, {"t": "Cellophane bees produce a kind of plastic that also degrades, study finds", "b": "The nest lining of the ground-nesting bee is translucent, flexible, resilient and degrades within a year", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/energy-and-environment/cellophane-bees-produce-a-kind-of-plastic-that-also-degrades-study-finds/article71660428.ece", "ts": 1793940351.0}, {"t": "The Milky Way grew by devouring galaxies, leaving a trail of ghost stars", "b": "Galactic archaeologists are using precise measures and larger sample sizes afforded by new missions to tease apart minute differences between groups of stars, revealing the history of the Milky Way going back almost 12 billion years", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/the-milky-way-grew-by-devouring-galaxies-leaving-a-trail-of-ghost-stars/article71652934.ece", "ts": 1793940039.0}, {"t": "A noisy Anthropocene is im es for preventing or delaying the disease before memory loss begins.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261104084017.htm", "ts": 1793927479.0}, {"t": "Delhi's toxic winter air is back - is the Indian capital prepared for pollution?", "b": "The Delhi government has announced a four-month winter action plan, but experts say that won't be enough.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cm78p0n09q3xo?at_medium=RSS&at_campaign=rss", "ts": 1793920613.0}, {"t": "Powerhouse Parramatta opens this weekend – and it’s dazzling inside and out", "b": "Coups de théâtre abound in the $915m addition to western Sydney’s skyline, which opens on Saturday with five new exhibitions – and a 23-day festival Get our weekend culture and lifestyle email Dubbed the “Opera House of western Sydney”, Powerhouse Parramatta’s white lattice exoskeleton, composed from 1,300 individual pieces and wrapping 30,000 sq metres of interior space, has already become a familiar landmark. Even better known, perhaps, is the project’s controversial history . Since the Parramatta outpost was announced in 2014, a vocal group of dissenters led by former staff and trustees has lamented what they see as the neglect of the museum’s Ultimo site in favour of a new infrastructure project, and what they say is a shift away from the museum’s core business towards contemporary art and events. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/culture/ng-interactive/2026/nov/06/powerhouse-parramatta-opening-festival", "ts": 1793919636.0}, {"t": "Environmental Ballot Wins", "b": "Voters around the country approved measures on conservation, water and data centers on Tuesday.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/05/climate/climate-environment-ballot-meaures-midterms.html", "ts": 1793913579.0}, {"t": "BBC Inside Science", "b": "A glimpse into the world of the incredibly tiny", "s": "BBC News",
