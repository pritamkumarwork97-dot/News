lks", "b": "Several countries that rely heavily on fossil fuels want to delay the next round of scientific assessments that governments use to inform their climate policies.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/13/climate/cop31-turkey-ipcc-climate-report.html", "ts": 1794592785.0}, {"t": "How Chinese brewers refined their booze 5,000 years ago", "b": "More than 5,000 years ago, brewers in eastern China appear to have used red mold to make rice alcohol, then strained the drink through cloth. Microscopic residues on ancient pottery show evidence of both the fermentation method and the filtering process to separate the liquid from leftover grain.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-chinese-brewers-refined-booze-years.html", "ts": 1794591623.0}, {"t": "Kindergarten teachers offer cognitive help during outdoor play but fall short on emotional and social support", "b": "A study in the International Journal of Innovation and Sustainable Development of teachers' behavior during outdoor play at kindergarten has identified a gap between the support children need and the help educators provide, particularly in emotional and social development.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-kindergarten-teachers-cognitive-outdoor-play.html", "ts": 1794591614.0}, {"t": "Self-learning AI separates particle jets from background noise in simulated heavy-ion collisions", "b": "A team of physicists and computer scientists led by researchers at the U.S. Department of Energy's (DOE) Brookhaven National Laboratory developed a new artificial intelligence (AI) approach that learns on its own to separate important high-energy particle jet signals from the enormous background of particles recorded in relativistic heavy-ion collisions, where two beams of heavy ions collide at near the speed of light.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-ai-particle-jets-background-noise.html", "ts": 1794591607.0}, {"t": "Colorful fish reveal how species stay distinct despite interbreeding", "b": "Vividly colored fish dwelling at the bottom of shallow Midwestern streams may help biologists understand the evolutionary mechanisms by which species remain distinct despite their similarities and overlapping ranges. Orangethroat and rainbow darters regularly interbreed where their ranges overlap, yet—millions of years after they first diverged—they remain separate species.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-fish-reveal-species-stay-distinct.html", "ts": 1794590406.0}, {"t": "Rh₃ clusters balance activity and butene selectivity in butane dehydrogenation", "b": "Scientists from the Institute of Metal Research (IMR) of the Chinese Academy of Sciences, in collaboration with researchers from Peking University and Chongqing University, have demonstrated how the geometry and electronic properties of subnanometer rhodium (Rh) active sites shape C–H activation, product desorption and C–C bond cleavage during butane dehydrogenation.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-11-rh-clusters-butene-butane-dehydrogenation.html", "ts": 1794590401.0}, {"t": "Climate action discussed at youth COP meeting", "b": "School children gather to discuss climate issues to coincide with the COP31 conference in Turkey.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/ckx28ly7y387o?at_medium=RSS&at_campaign=rss", "ts": 1794580746.0}, {"t": "What science can tell us about the art of conversation - video", "b": "Scientists at Dartmouth College in New Hampshire say they have discovered a telltale sign of an enjoyable conversation. Apparently the secret of a mutually satisfying chat is a healthy dose of pink noise. Guardian science editor Ian Sample tells co-host Madeleine Finl land. “I definitely think it is down to the fact that it’s a date surrounded by superstition. People are maybe afraid it’s a bad omen for their marriage.” Smyth’s sole Friday 13th wedding, in September 2013, was the first she ever photographed – and it kickstarted her career. But for many businesses, the date is not so auspicious. From weddings to flights, job interviews to elective surgeries, many people avoid booking anything of significance on this date, believing it to be bad luck. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/13/the-sinister-power-of-friday-13th-how-this-maligned-date-affects-our-lives", "ts": 1794546010.0}, {"t": "BBC Inside Science", "b": "China: climate saviour or global villain?", "s": "BBC News", "l": "https://www.bbc.co.uk/sounds/play/w3ct978l?at_medium=RSS&at_campaign=rss", "ts": 1794517200.0}, {"t": "A Key Paris Agreement Goal Is Dead. What Now?", "b": "Leaders at COP31 are confronting a new reality as global warming enters the “unsafe zone.”", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/12/climate/a-key-paris-agreement-goal-is-dead-what-now.html", "ts": 1794514504.0}, {"t": "Now agentic AI can perform complex lab research, and maybe cheaper too", "b": "On November 4, 2026, in the journal Nature, researchers from Shanghai Jiao Tong University presented their findings on an Agentic laboratory platform, “AutoDNA”. It is an artificial intelligence system with agents performing the function of humans who usually perform complex experiments", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/education/now-agentic-ai-can-perform-complex-lab-research-and-maybe-cheaper-too/article71692756.ece", "ts": 1794509931.0}]},DATE="13 November 2026",cats=Object.keys(D);let cat=cats[0],i=0,sx=0;
