56.0}, {"t": "Anthropic, OpenAI turn to faith in search for ethics", "b": "Anthropic, OpenAI turn to faith in search for ethics", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/ai/ai-insights/ai-companies-turn-to-religion-for-moral-guidance-but-experts-warn-of-oversimplification/articleshow/135189602.cms", "ts": 1792927195.0}, {"t": "‘Excess’: Insured, but still responsible", "b": "The NCB rewards claim-free years, either through a discount on renewal premium or an increase in the sum insured, depending on the type of policy.", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/excess-insured-but-still-responsible/article71623110.ece", "ts": 1792927173.0}, {"t": "Upcoming IPO GMP: EAAA India vs SFC Environmental vs BLS Polymers vs MK Sons Fine Jewels vs Bombay Coated Special Steels", "b": "India’s IPO market faces a busy week as EAAA India Alternatives, SFC Environmental Technologies, BLS Polymers, M.K. Sons Fine Jewels and Bombay Coated and Special Steels launch offerings. Their combined issue value is about ₹2,581 crore, with price bands and subscription dates varying by company.", "s": "mint - markets", "l": "https://www.livemint.com/market/ipo/upcoming-ipo-gmp-eaaa-india-vs-sfc-environmental-vs-bls-polymers-vs-mk-sons-fine-jewels-vs-bombay-coated-special-steels-11792924594395.html", "ts": 1792926808.0}, {"t": "Public Colleges Are Passing the $50,000-a-Year Mark. For Locals.", "b": "At the University of California campuses in Berkeley, Irvine and Santa Barbara, students get an unwitting education in navigating the housing market.", "s": "NYT > Business", "l": "https://www.nytimes.com/2026/10/25/business/california-colleges-costs.html", "ts": 1792926681.0}], "Science": [{"t": "How screening tools measure disadvantage may leave rural communities overlooked for public support", "b": "Whether a community is prioritized for public support can depend on how its needs are measured, according to new research from the University of New Hampshire. The study found significant differences in how government screening tools identify communities, particularly in rural areas where those differences could affect access to funding.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-screening-tools-disadvantage-rural-communities.html", "ts": 1792951202.0}, {"t": "When will the weather settle after Storm Boelo?", "b": "Gillian Smart has the weather forecast after the worst of Storm Boelo.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cmrlyeekzldpo?at_medium=RSS&at_campaign=rss", "ts": 1792947872.0}, {"t": "Patterns of polar vortices discovered in lead-free superlattices on silicon", "b": "A team at HZB has, for the first time, reported polar vortices in (BaTiO₃/SrTiO₃)₁₀ superlattices on silicon. These results expand the range of materials and substrates on which polar topological textures can occur and open up new options for incorporating complex ferroelectric states into silicon-based technologies.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-patterns-polar-vortices-free-superlattices.html", "ts": 1792947601.0}, {"t": "Starshield | The non-state sovereigns", "b": "Elon Musk limited Ukraine’s access to the military-grade network of Starlink after Trum pcriticised Kyiv’s strikes on Russia’s energy infrastructure", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/international/profiles-starshield-the-non-state-sovereigns/article71621149.ece", "ts": 1792946763.0}, {"t": "Protecting children from harm isn't enough—welfare systems must support healing through quality mental health care", "b": "In Quebec and across Canada, people working in child welfare do remarkable work to protect children and youth from maltreatment and to support families facing complex challenges.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-children-isnt-welfare-quality-mental.html", "ts": 1792944001.0}, {"t": "A few seconds of loading time can push online learners off track", "b": "An online lesson takes an extra second to load. The wait may seem trivial, but in a study examining large learning platforms, these brief pauses were linked to unfinished assignments, lower scores and less time spent on the site.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-seconds-online-learners-track.html", "ts": 1792941602.0}, {"t": "How people’s genes are revealing why some languages are so unique", "b": "A new study measured how different neighbouring languages were from one another. The authors say that linguistic hotspots may offer glimpses into how human languages became more varied before large migrations and population movements reshaped much of the world", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/how-genetic-history-reveals-why-some-languages-are-so-unique/article71217585.ece", "ts": 1792937373.0}, {"t": "Science Snapshots: October 25, 2026", "b": "Three recent important research developments, all readable in one minute", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/science-snapshots-october-25-2026/article71623601.ece", "ts": 1792935651.0}, {"t": "Microorganisms show promise for reducing emissions from manure", "b": "Dairy farmers sometimes use additives in their cattle housing to reduce emissions from slurry. Emissions of substances such as ammonia occur when urine and feces mix on the floor of the housing. At the same time, dairy farmers want to increase the fertilizing value of the manure when it is applied to agricultural land.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-microorganisms-emissions-manure.html", "ts": 1792933201.0}, {"t": "Southern Africa's first known stenciled rock art found hiding in plain sight", "b": "Southern Africa has one of the most detailed and elaborate bodies of rock art anywhere in the world, from herds of running antelope to dancing men and humanoid beings with wings, hooves and horns. All are painted with fine brushstrokes or fingers. One thing this art lacks is stencils.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-southern-africa-stenciled-art-plain.html", "ts": 1792932002.0}, {"t": "Police using AI risks making discrimination worse, researchers warn", "b": "AI tools learn from biased records and may deepen discrimination against minorities without oversight, researchers say.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/ckpdg4pl7pgvo?at_medium=RSS&at_campaign=rss", "ts": 1792930736.0}, {"t": "Three giant black holes discovered in a galaxy from the dawn of time", "b": "Astronomers have discovered three actively feeding black holes inside a single galaxy more than 12.5 billion light-years away, revealing a remarkable scene from the universe’s infancy. Two of the black holes are separated by just 620 light-years and are expected to eventually merge, while a third lurks farther away. One weighs an astonishing 80 million suns, and another is growing faster than conventional theories predict.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261024222000.htm", "ts": 1792930021.0}, {"t": "US military gives Elon Musk’s SpaceX access to sensitive tracking data", "b": "This gives the company an advantage in tracking objects in orbit, raising national security concerns and fears of greater control over the space industry The US military has given Elon Musk’s SpaceX access to restricted space tracking data, raising a new round of questions about whether the Trump administration is attempting to hand over traffic control in Earth’s orbit to a controversial donor. The access also raises new national security questions, industry observers say. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/25/spacex-access-sensitive-tracking-data", "ts": 1792929605.0}, {"t": "Global underground CO₂ storage hit record 43.6 million metric tons in 2024 alone", "b": "The most comprehensive record yet of carbon dioxide stored underground through geological carbon dioxide storage has been published today, revealing that 43.6 million metric tons were sequestered in 2024 alone—a new annual record—and that 421.7 million metric tons have now been stored in the past three decades.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-global-underground-storage-million-metric.html", "ts": 1792929601.0}, {"t": "New evidence suggests spinosaurus spent most of its life underwater", "b": "Millions of years after animals first conquered land, some took an extraordinary evolutionary U-turn and returned to the water. Using machine learning and thousands of fossil measurements, Yale scientists have uncovered surprising clues about which prehistoric creatures truly became aquatic. Their findings suggest that Spinosaurus spent most of its life underwater, while some ancient marine reptiles previously thought to be fully aquatic actually spent considerable time on land.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261024221956.htm", "ts": 1792929174.0}, {"t": "'What was in the Clyde is basically now on the shore'", "b": "BBC Scotland reports from the scene at Cardross as Storm Boelo batters the country.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cmg47e2znpzpo?at_medium=RSS&at_campaign=rss", "ts": 1792928537.0}, {"t": "Scientists discover how pancreatic cancer rewrites its DNA to escape treatment", "b": "Scientists have discovered how pancreatic cancer cells continually reshape their genetic makeup to become more aggressive, spread, and evade treatment. In laboratory experiments, blocking a key gene reversed some of these dangerous changes, revealing a potential new way to fight the deadly disease.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261024221849.htm", "ts": 1792926025.0}, {"t": "Sea cucumber–inspired gel could help heal damaged tissue in humans", "b": "Inspired by the ability of sea cucumbers to change the stiffness of their bodies, University of Waterloo researchers have developed a gel that could one day help repair damaged tendons and other soft tissues without leaving permanent material behind.", "s": "Phys.org - latest science and technology news stories", "l": "https://phys.org/news/2026-10-sea-cucumberinspired-gel-tissue-humans.html", "ts": 1792926001.0}, {"t": "Low-dose aspirin linked to 70% lower dementia risk, but there's a catch", "b": "A common, inexpensive medication could hold an unexpected clue to preventing dementia. Researchers found that older adults with a specific genetic profile had a 70% lower relative risk of dementia when taking low-dose aspirin, even though previous studies found no overall protective effect. The discovery suggests that genetics could help explain why some people benefit while others do not.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261024222026.htm", "ts": 1792923708.0}, {"t": "More wet and windy weather to follow stormy weekend", "b": "Following the first two named storms of the season, wet and very windy conditions are set to continue into the start of the new week.", "s": "BBC News", "l": "https://www.bbc.co.uk/weather/articles/cwdd858z8ynlo?at_medium=RSS&at_campaign=rss", "ts": 1792923380.0}, {"t": "The penguins are noisy, the people fantastic - what it takes to be an Antarctic postmaster", "b": "George Clarke from Bristol will run the post office at Port Lockroy in Antarctica from October to March.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6dxwklr409eo?at_medium=RSS&at_campaign=rss", "ts": 1792922390.0}, {"t": "Feral dogs ‘a major threat’ to vultures in Thar desert, study finds", "b": "Vultures spend half as long on carcasses at an open dump site than at dog-free enclosures, the scientists observed", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/energy-and-environment/feral-dogs-a-major-threat-to-vultures-in-thar-desert-study-finds/article71617248.ece", "ts": 1792920669.0}, {"t": "Musk says SpaceX restricted Ukraine's Starlink connection as service restored", "b": "The tech billionaire accuses Ukraine of violating its terms of service by using the network for military activity.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cvx28ljp8n4xo?at_medium=RSS&at_campaign=rss", "ts": 1792918800.0}, {"t": "Seabirds and sewage among UNESCO status challenges", "b": "A report marking 10 years of the Isle of Man as a UNESCO Biosphere highlights the scheme's progress.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cwzrd1e364jlo?at_medium=RSS&at_campaign=rss", "ts": 1792912977.0}, {"t": "Rosebank: Life on the oil field at the centre of a political storm", "b": "Scotland editor James Cook finds out what life is like on board a ship in an untapped oil field awaiting its fate.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqy8ljkle97ro?at_medium=RSS&at_campaign=rss", "ts": 1792912538.0}, {"t": "This mysterious mushroom makes people see hundreds of tiny humans", "b": "For nearly a century, people in distant parts of the world have reported a bizarre experience after eating certain wild mushrooms: seeing dozens or even hundreds of tiny, colorful humans moving through the real world. Now, scientists have identified a mushroom species, Lanmaoa asiatica, responsible for these extraordinary hallucinations in China and the Philippines.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261024222021.htm", "ts": 1792910170.0}, {"t": "‘It’s magic’: scientists rediscover how to make ancient Roman colour-changing glass", "b": "Exclusive: Optical engineering that went into 1,600-year-old Lycurgus Cup has baffled experts for centuries The Romans’ proficiency in the art of glass-making has produced some of the wonders of antiquity, but few of their creations better a 1,600-year-old masterpiece which sits in the British Museum. Depending on where a light source is positioned, the Lycurgus Cup changes colour, from jade green under normal lighting to ruby red when lit from behind – an astonishing feat of optical engineering that has confounded historians and glass-makers for centuries. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/25/scientists-rediscover-ancient-roman-colour-changing-glass", "ts": 1792908055.0}, {"t": "ISRO to have four launch pads by 2029, says Narayanan", "b": "The ISRO chief said that the upcoming Kulasekarapattinam spaceport facility will feature crucial infrastructure such as integration buildings, launch pads, rail-track systems, telemetry, tracking, and command systems", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/news/national/isro-to-add-four-launch-pads-by-2029/article71622643.ece", "ts": 1792907624.0}, {"t": "New form of carbon found: diamondiyne", "b": "New form of carbon found: diamondiyne", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/science-for-all-newsletter-new-form-of-carbon-found-diamondiyne/article71607112.ece", "ts": 1792904946.0}, {"t": "Astronomers may have discovered the first moon beyond our Solar System", "b": "Astronomers have uncovered evidence of a bizarre, potentially historic discovery: the fi
