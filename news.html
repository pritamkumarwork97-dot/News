s Science, without the jargon.", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/the-amazon-is-no-longer-a-carbon-sink-it-is-an-emitter/article71655416.ece", "ts": 1793865896.0}, {"t": "NVS-03 reaches geosynchronous orbit; satellite in good health", "b": "‘Four orbit manoeuvres have been successfully completed with a cumulative LAM engine burn of 6164 seconds; with this the satellite has reached Geo Synchronous Orbit at an inclination of 29.980,’ said ISRO", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/sci-tech/science/nvs-03-reaches-geosynchronous-orbit-satellite-in-good-health/article71667218.ece", "ts": 1793856846.0}, {"t": "‘Ferritin face’: can you really diagnose low iron from a selfie? – podcast", "b": "Social media is awash with claims iron deficiency can be identified in the mirror by dark circles, breaking hair and dry skin. But is ‘ferritin face’ real? Madeleine Finlay tells Ian Sample why so many of us struggle to keep our iron levels up, how we can actually diagnose low iron and the best way to correct a deficiency, with help from Hal Drakesmith, a professor of iron biology at Oxford University, and advice from Dr Sue Pavord, a consultant haematologist at Oxford university hospitals and associate senior lecturer in clinical medicine at St Edmund Hall ‘Ferritin face’: are social media claims about iron deficiency fact – or fiction? Support the Guardian: theguardian.com/sciencepod Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/audio/2026/nov/05/ferritin-face-can-you-really-diagnose-low-iron-from-a-selfie-podcast", "ts": 1793854855.0}, {"t": "Historians say King Verica persuaded Rome to invade Britain. But could Verica actually have been a queen?", "b": "Controversial theory that Verica, who incited Emperor Claudius’s AD43 landing, was a woman could put a new spin on British history if true It was a moment that changed the course of British history: in AD43, Roman troops under the emperor Claudius landed in Kent. Now, an archaeologist has claimed the British ruler who persuaded Claudius to invade was not a king but a queen. The controversial conclusion, made by Dr Miles Russell, the director of archaeological fieldwork at Bournemouth University, could throw new light on Britain’s history. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/uk-news/2026/nov/05/verica-rome-invade-britain-queen-or-king", "ts": 1793854854.0}, {"t": "Science should move past ‘top 2%’ label", "b": "India needs both fundamental research and practical solutions without making inclusion in the ‘top 2% scientists’ database’ the primary goal", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/opinion/op-ed/science-should-move-past-top-2-label/article71667264.ece", "ts": 1793853989.0}, {"t": "Anaemia burden — iron alone is no solution", "b": "India must tackle its anaemia burden through targeted nutrition, better diagnostics and comprehensive public health measures, not salt fortification alone", "s": "Science News | Latest Updates on Scientific Discoveries | The Hindu", "l": "https://www.thehindu.com/opinion/lead/anaemia-burden-iron-alone-is-no-solution/article71666828.ece", "ts": 1793851879.0}, {"t": "Scientists turn viruses into weapons against deadly superbugs", "b": "Scientists are advancing a promising new way to fight antibiotic-resistant infections by using viruses that specifically target and kill harmful bacteria. An international team has released the first coordinated guidelines for personalized phage therapy, offering a roadmap for safely bringing this experimental treatment into clinical practice. Early findings are encouraging, with one study reporting improvement in 77% of patients and the disappearance of targeted bacteria in 61%.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/11/261102202828.htm", "ts": 1793846433.0}, {"t": "Swapping from dairy to plant-based milk, cheese and yoghurt ‘could lead to micronutrient deficiencies’", "b": "Young people and women most at risk, study finds, as researchers call for vegan products to be fortified with iodine in particular Switching from dairy products to plant-based alternatives could lead to deficiencies in vital micronutrients, especially among young people and women, a study has found. Even moving partly to vegan alternatives to milk, cheese and yoghurt could lead to falls in iodine, calcium, riboflavin and vitamin B12 if the substitutes, often based on soya, almonds or oats, are not fortified, scientists said. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/nov/04/swapping-dairy-milk-cheese-yoghurt-plant-based-vegan-alternatives-deficiencies-micronutrients-iodine", "ts": 1793835047.0}, {"t": "Typhoons batter East Asia as El Niño makes Pacific 'burn with fever'", "b": "Even for countries where typhoons are a way of life, the last few months have brought unusually wild weather.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cw33kgj7nkemo?at_medium=RSS&at_campaign=rss", "ts": 1793833967.0}, {"t": "Beverly Whipple Has Died. She Introduced the G-Spot to the Mainstream.", "b": "Dr. Whipple studied the female erogenous zone and, with collaborators, wrote a best seller about women’s sexuality. She was 85.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/11/04/science/beverly-whipple-g-spot-dead.html", "ts": 1793833386.0}, {"t": "US prosecutors drop criminal charges against scientist detained over frog embryos", "b": "Kseniia Petrova was detained for four months after arrest with research samples, and feared deportation to Russia Federal prosecutors have dropped all criminal charges against a Russian scientist who spent four months in immigration detention after flyi
