92075444652.html", "ts": 1792079873.0}, {"t": "Pernod Ricard India sales grow 19% in Sept qtr; IPO plan awaits board approval", "b": "Pernod Ricard has demonstrated remarkable sales growth of 19 percent in India for the September quarter, driven by strong market demand and ongoing premiumisation trends. The company's preparatory measures for a potential IPO have positively influenced sales. Despite declines in the US and China, India remains a focal market. The final decision on the IPO awaits board approval.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/ipos/fpos/pernod-ricard-india-sales-grow-19-in-sept-qtr-ipo-plan-awaits-board-approval/articleshow/134971473.cms", "ts": 1792079855.0}, {"t": "US teen turns $500 loan into six-figure brand", "b": "US teen turns $500 loan into six-figure brand", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/international/world-news/at-12-he-took-a-500-loan-in-north-carolina-how-a-hawaii-trip-inspired-his-six-figure-swimwear-brand-coastal-cool/articleshow/134971379.cms", "ts": 1792079840.0}, {"t": "RBI remains cautious on crypto, backs underlying technology: Governor Malhotra", "b": "Governor Sanjay Malhotra says India supports innovation in distributed ledger technology and tokenisation, but is wary of cryptocurrencies over concerns about monetary sovereignty and capital flows", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/rbi-remains-cautious-on-crypto-backs-underlying-technology-governor-malhotra/article71540258.ece", "ts": 1792079829.0}, {"t": "India's current account deficit narrows to $5.2 billion in August as capital account surplus hits $50.6 billion", "b": "India's current account deficit narrowed to $5.2 billion in August, compared to $6.1 billion a year earlier. The capital account surplus increased substantially to $50.6 billion, influenced by non-resident deposits of $83 billion. The balance of payments showed a surplus of $45.4 billion, contrasting with a deficit of $5.6 billion in the previous year. External commercial borrowing saw a net outflow of $22.4 billion during this time.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/news/indias-current-account-deficit-narrows-to-5-2-billion-in-august-as-capital-account-surplus-hits-50-6-billion/articleshow/134979546.cms", "ts": 1792079773.0}, {"t": "Tech Mahindra maintains edge over Wipro in September quarter", "b": "While Wipro reported its slowest second-quarter growth in three years, Tech Mahindra reported its fastest second-quarter growth in the same period.", "s": "mint - companies", "l": "https://www.livemint.com/companies/company-results/wipro-tech-mahindra-quarterly-results-11792069655235.html", "ts": 1792079171.0}, {"t": "HC imposes year-round ban on firecrackers on road", "b": "HC imposes year-round ban on firecrackers on road", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/india/bombay-hc-says-ban-on-firecrackers-on-roads-applicable-throughout-year-diwali-2026/articleshow/134971004.cms", "ts": 1792078714.0}, {"t": "Market Trading Guide: Adani Power among 2 stock recommendations for Friday", "b": "Indian equities rallied as global technology stocks weakened amid AI valuation concerns and US inflation worries. Analysts recommend Bajaj Holdings and Adani Power for Friday, citing improving technical momentum, key support levels and potential upside, subject to market conditions.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/stocks/news/market-trading-guide-adani-power-among-2-stock-recommendations-for-friday/articleshow/134971119.cms", "ts": 1792078221.0}, {"t": "Stellantis to invest ₹4,000 cr, plan 12 India launches, triple market share by 2030", "b": "Jeep and Citroën’s export share is expected to double over the next four years.", "s": "Business News Today – Finance, Industry & Economy | The Hindu", "l": "https://www.thehindu.com/business/Industry/stellantis-to-invest-4000-cr-plan-12-india-launches-triple-market-share-by-2030/article71589051.ece", "ts": 1792078216.0}, {"t": "Maharashtra FDA bans loose spice powders", "b": "Maharashtra FDA bans loose spice powders", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/india/maharashtra-fda-bans-sale-of-loose-spice-powders-mixed-spices-to-curb-adulteration/articleshow/134971010.cms", "ts": 1792077749.0}, {"t": "Interbank trades, ECBs coupons not under FERR: RBI", "b": "Interbank trades, ECBs coupons not under FERR: RBI", "s": "Economic Times", "l": "https://economictimes.indiatimes.com/news/economy/finance/rbi-clarifies-interbank-trades-ecbs-coupons-not-part-of-ferr/articleshow/134970942.cms", "ts": 1792077293.0}, {"t": "RBI clarifies interbank trades, ECBs coupons not part of FERR", "b": "Reserve Bank of India recently clarified the applicability of foreign exchange risk reserve for banks. The requirement does not apply to banks engaging in market-making or proprietary trading. It will also not affect interest on External Commercial Borrowings or dividends payable to non-resident investors. The FERR must be maintained until one day after the derivative contract's termination.", "s": "Markets-Economic Times", "l": "https://economictimes.indiatimes.com/markets/forex/forex-news/rbi-clarifies-interbank-trades-ecbs-coupons-not-part-of-ferr/articleshow/134979553.cms", "ts": 1792077293.0}, {"t": "Textile stocks’ dividend race: Premco Global, Monte Carlo, Siyaram, Ambika Cotton - Which stock spins highest yield?", "b": "Indian textile stocks are attracting attention amid supply-chain diversification, policy support and better trade access. Premco Global posted the highest one-year dividend yield at 9.5%, boosted by a special dividend.&nbsp;", "s": "mint - markets", "l": "https://www.livemint.com/market/stock-market-news/textile-stocks-dividend-race-premco-global-monte-carlo-siyaram-ambika-cotton-which-stock-spins-highest-yield-11792073022730.html", "ts": 1792076866.0}], "Science": [{"t": "Suspected fly tippers shamed with online photos", "b": "Hillingdon Council has shared social media posts showing people allegedly dumping rubbish illegally.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqgm0jepyl01o?at_medium=RSS&at_campaign=rss", "ts": 1792087556.0}, {"t": "Watch: What does Starlink have to do with the Ukraine-Russia war?", "b": "Ukraine's president has told Elon Musk that any restriction on the Starlink's system cost lives.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/cqr7yzpxm083o?at_medium=RSS&at_campaign=rss", "ts": 1792085497.0}, {"t": "How an accelerating Earth led experts to adopt the leap hour", "b": "International delegates agree leap second no longer tenable, but first leap hour not likely to happen for thousands of years After decades of discussion, quibbling and worrying about clocks in computer systems, the world’s official timekeepers have voted to replace what many viewed as a tiresome correction: the leap second. It’s time, they say, for the leap hour. Delegates from 69 countries cast their votes on Thursday at a conference in France of the International Bureau of Weights and Measures, which ensures the world sticks to the same standards of time, weight, distance and more. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/15/times-up-for-the-leap-second-as-scientists-swap-it-for-the-leap-hour", "ts": 1792080970.0}, {"t": "Severe drought declared and hosepipe bans in force - is your area affected?", "b": "Parts of southern England have entered \"severe drought\", while about 30 million people are under hosepipe ban.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/crk661074ejo?at_medium=RSS&at_campaign=rss", "ts": 1792078957.0}, {"t": "Neanderthal remains may be earliest human ancestor find killed by a spear", "b": "Adult excavated in an Iraqi Kurdistan cave died more than 70,000 years ago and bears ‘kill shot’ shoulder wound A smooth round hole in the shoulder blade of a Neanderthal who died more than 70,000 years ago may be the oldest evidence so far of a human ancestor being killed by a wooden spear. Archaeologists spotted the distinctive injury after excavating skeletal remains of the adult and other Neanderthals from under nearly 8 metres of rock and sediment in the Shanidar cave in Iraqi Kurdistan. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/15/neanderthal-remains-human-ancestor-killed-by-spear-iraq-kurdistan-cave-earliest-find", "ts": 1792076423.0}, {"t": "Was Neanderthal life violent? This wound suggests lethal fighting was more common", "b": "A 75,000-year-old Neanderthal spear wound may be evidence violence shaped human life far earlier than thought.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6jrwn3y3xe9o?at_medium=RSS&at_campaign=rss", "ts": 1792076405.0}, {"t": "£15m for zero-emission testing at Belfast Harbour", "b": "It comes after a £15m investment from UK Research and Innovation's Local Innovation Partnerships Fund.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/c6kgqr9n8082o?at_medium=RSS&at_campaign=rss", "ts": 1792076103.0}, {"t": "Inside the Plague Research Labs at the Heart of a Russian Mystery", "b": "A Russian researcher, who died from an unknown illness, worked at a remote anti-plague facility. Few foreigners have visited these labs, which dot the former Soviet states, and are shrouded in secrecy.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/15/science/russia-plague-laboratory-mystery.html", "ts": 1792073521.0}, {"t": "Sheep are disappearing from our hills - and our dinner plates", "b": "Have we have passed \"peak sheep\" in the UK?", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cgrzd72wp5zo?at_medium=RSS&at_campaign=rss", "ts": 1792073413.0}, {"t": "Bleached Coral Rebounded After Touching Healthy Coral, Study Finds", "b": "After sick corals were placed in direct contact with healthy ones of the same genetic makeup, they recovered at “incredible” speed, scientists found.", "s": "NYT > Science", "l": "https://www.nytimes.com/2026/10/14/climate/coral-bleaching-healing-touch.html", "ts": 1792070419.0}, {"t": "Mysterious brain activity under anesthesia challenges what we know about consciousness", "b": "Even under general anesthesia, the human brain can analyze language, recognize different types of words, and predict what comes next in a story, according to a surprising discovery by Baylor researchers. The findings challenge our understanding of consciousness and suggest that the unconscious brain is far more capable than scientists previously realized.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015003440.htm", "ts": 1792068725.0}, {"t": "Arctic sea ice hits another troubling low in 2026", "b": "Arctic sea ice is shrinking in both winter and summer, with satellite records revealing that the region's remaining ice is becoming thinner, younger, and more vulnerable to melting. Despite a recent slowdown in summer losses, scientists warn that the Arctic could experience a nearly ice-free summer before 2050.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261015073212.htm", "ts": 1792068044.0}, {"t": "A fungus is threatening the world’s food supply. Scientists just found a new defense", "b": "Scientists have discovered a potential new weapon against a devastating fungus that threatens rice, wheat, and barley worldwide. By engineering a special type of plant immune receptor, researchers created defenses capable of recognizing multiple fungal threats at once. The breakthrough could eventually lead to crops with powerful, long-lasting disease resistance, helping protect a global food supply increasingly threatened by spreading infections and climate change.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261014015501.htm", "ts": 1792064743.0}, {"t": "Scientists discover a surprising danger in smaller cancer cells", "b": "Scientists have discovered that unusually small cancer cells carrying extra chromosomes can be far more aggressive than larger ones, growing faster, spreading more readily, and resisting common treatments. The surprising finding could help explain why some tumors are especially dangerous and provide a new way to predict cancer outcomes.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261013015835.htm", "ts": 1792063660.0}, {"t": "Why is Starlink internet so important on the battlefield in Ukraine?", "b": "It is the \"backbone of military communications in Ukraine\" that provides vital high-speed internet to forces across the country.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cqkgk4zg54reo?at_medium=RSS&at_campaign=rss", "ts": 1792063519.0}, {"t": "Is your boss watching you? The rise of AI surveillance at work - video", "b": "Workers have always been monitored by their bosses, first through output targets, and then via computer software labelled ‘bossware’. But AI is transforming the capabilities of these systems, processing huge volumes of data to provide minute-by-minute accounts of activity, and productivity. To find out more, Ian Sample hears from UK technology editor Robert Booth. He explains which sectors are adopting this approach, why they are doing it, and how it could end up being counterproductive. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/video/2026/oct/15/is-your-boss-watching-you-the-rise-of-ai-surveillance-at-work-video", "ts": 1792062625.0}, {"t": "Cyril Hilsum obituary", "b": "Government physicist whose radar research paved the way for flat-panel TV and computer screens based on liquid crystals Cyril Hilsum’s research into stable liquid crystals and the devices in which they could be used paved the way for the flat-panel television and computer screens that are now ubiquitous in homes, offices and public spaces. Hilsum, who has died aged 101, was leading a Ministry of Defence team at the Royal Radar Establishment (RRE) in Malvern, Worcestershire, in the late 1960s when Harold Wilson’s Labour government, looking to develop a new generation of miniature radar systems, tasked him with creating flat displays to replace the bulky cathode-ray-tube screens used for traditional radar set-ups. Continue reading...", "s": "Science | The Guardian", "l": "https://www.theguardian.com/science/2026/oct/15/cyril-hilsum-obituary", "ts": 1792061614.0}, {"t": "Two dead in Istanbul after heaviest rainfall in 84 years, governor says", "b": "Residents have been told to avoid leaving their homes unless absolutely necessary.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/articles/cq398x7j1lrwo?at_medium=RSS&at_campaign=rss", "ts": 1792058729.0}, {"t": "Rare study reveals a striking divide inside an Alzheimer’s patient’s brain", "b": "A rare examination of an Alzheimer’s patient’s brain revealed that regions cleared of amyloid plaques had remarkably little of the harmful tau buildup associated with memory loss, while neighboring areas showed extensive damage. The discovery suggests that removing amyloid may have lasting protective effects and could help slow Alzheimer’s progression, especially when treatment begins early.", "s": "All Top News -- ScienceDaily", "l": "https://www.sciencedaily.com/releases/2026/10/261013015814.htm", "ts": 1792058724.0}, {"t": "Historic cannons airlifted for restoration", "b": "Cannons are lifted from St Michael's Mount by helicopter so they can be taken away for restoration.", "s": "BBC News", "l": "https://www.bbc.co.uk/news/videos/ck24096pndy9o?at_medium=RSS&at_campaign=rss", "ts": 1792056703.0}, {"t": "Jonathan, the giant tortoise, is 198 years old. Here is his secr
